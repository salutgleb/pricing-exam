ре 300 000 руб. Для выполнения финансовых целей было решено выпустить 800 бутылок в течение года. На основе данных определите, по какой цене должна продаваться каждая бутылка, чтобы компания достигла своих финансовых ожиданий","formula_id":"f-model1","asks":[{"label":"Цена бутылки","value":2125,"unit":"руб.","tol":0.5}],"steps":["Прямые издержки на бутылку, затраты на управление и маркетинг за год, прибыль за год: модель расчета №1, Л3, сл. 46.","(200 000 + 300 000) / 800 = 500 000 / 800 = 625 руб.","P = 1 500 + 625 = 2 125 руб."],"answer_text":"2 125 руб. за бутылку.","trap":"200 000 это годовые накладные: делим на 800 вместе с прибылью, прямые 1 500 прибавляем отдельно."},{"id":"v4-p2","source":"Прошлый год, вариант 4, задача 2","level":"прошлый год","text":"Представьте себе, что вы открыли собственное кафе в центре города. Вы вложили значительные средства в оборудование кухни и интерьер, но теперь пришло время определить цену на ваше меню. Как же правильно это сделать ? Удельные полные издержки (на одну порцию блюда) составляют 50 рублей. Это включает все затраты на ингредиенты, приготовление и подачу блюда. Ваша целевая рентабельность составляет 20%. Вы инвестировали в открытие кафе 1 миллион рублей. Эти деньги были потрачены на ремонт помещения, покупку оборудования и мебели, а также на создание бренда и маркетинговые мероприятия. Ожидается, что в первый год работы кафе вы продадите 10 000 порций блюд. Рассчитайте цену одного блюда.","formula_id":"f-roi","asks":[{"label":"Цена одного блюда","value":70,"unit":"руб.","tol":0.5}],"steps":["Удельные полные издержки, инвестиции, целевая рентабельность, план продаж: Л3, сл. 48: P = UC + ROI × I / Q.","0,20 × 1 000 000 / 10 000 = 200 000 / 10 000 = 20 руб.","P = 50 + 20 = 70 руб."],"answer_text":"70 руб. за порцию.","trap":"Целевая рентабельность 20% относится к инвестициям 1 000 000. 50 × 1,20 = 60 это норматив к издержкам, другая формула.","ambiguity":"В условии «целевая рентабельность составляет 20%» без слова «инвестиций». Берём ROI (Л3, сл. 48): даны сумма инвестиций и план продаж, их использует только эта формула; так решил и однокурсник, 70 руб. Если читать 20% как норматив к издержкам (Л3, сл. 45), выйдет 50 × 1,20 = 60 руб., тогда инвестиции и план продаж в расчёт не идут."},{"id":"v5-p1","source":"Прошлый год, вариант 5, задача 1","level":"прошлый год","text":"Компания производит уникальный продукт, который требует прямых затрат на производство в размере 120000 руб. Накладные расходы компании составляют 180000 руб., а целевая прибыль — 300 000 руб. План продаж на год составляет 1500 единиц. Какую цену должна установить компания для реализации своего плана, если предполагается, что все товары будут проданы?","formula_id":"f-model1","asks":[{"label":"Цена, решение 1: 120 000 это прямые затраты на единицу","value":120320,"unit":"руб.","tol":0.5},{"label":"Цена, решение 2: 120 000 это прямые затраты на весь выпуск","value":400,"unit":"руб.","tol":0.5}],"steps":["Прямые затраты, накладные, целевая прибыль, план продаж: модель расчета №1, Л3, сл. 46. Эта задача стоит образцом на Л5, сл. 85.","На экзамене пиши оба решения: первым и итоговым на единицу (как у однокурсника и по модели №1), вторым на весь выпуск.","(180 000 + 300 000) / 1 500 = 480 000 / 1 500 = 320 руб. на единицу.","Решение 1, 120 000 на единицу (как 800 руб. в примере слайда): P = 120 000 + 320 = 120 320 руб.","Решение 2, 120 000 на весь годовой выпуск: на единицу 120 000 / 1 500 = 80 руб., P = 80 + 320 = 400 руб.","Проверка решения 1: 120 320 × 1 500 = 180 480 000 = 120 000 × 1 500 + 180 000 + 300 000.","Проверка решения 2: 400 × 1 500 = 600 000 = 120 000 + 180 000 + 300 000."],"answer_text":"Два равноправных ответа: 120 320 руб., если 120 000 на единицу, и 400 руб., если 120 000 на весь выпуск. На экзамене пиши оба решения, итоговым отметь первое (на единицу), второе допиши как другое прочтение. Спросить у Шарко 22.10.","trap":"В скобки идут накладные 180 000 и прибыль 300 000. На слайде в числителе опечатка «Прямые затраты»: в примере там стоят накладные 140 000.","ambiguity":"В условии нет слов «на единицу». За единицу: так подставляют в формулу курса, в примере модели №1 (Л3, сл. 46) «прямые издержки ... 800 руб.» тоже без «на единицу», так решил однокурсник. За весь выпуск: 120 000 одного порядка с годовыми 180 000 и 300 000, а при цене 120 320 прибыль 300 000 это 0,17% выручки; Проверка формулой сходится у обоих решений, прочтения она не различает. На экзамене пиши оба решения и отметь итоговым первое (на единицу, как в модели №1): на Л5, сл. 83 у задачи «один единственно верный вариант ответа». Вопрос Шарко 22.10."},{"id":"v5-p2","source":"Прошлый год, вариант 5, задача 2","level":"прошлый год","text":"Представьте, что Вы открыли небольшой фитнес-центр в своем городе. У Вас уже есть необходимое оборудование и помещение, но теперь нужно определиться с ценами на абонементы. Удельные полные издержки на одно посещение клиентом составляют 200 рублей. Сюда входят затраты на аренду зала, оплата труда тренерам, коммунальные платежи и другие операционные расходы. Ваша целевая рентабельность составляет 20%. Это значит, что к концу года Вы хотите получить прибыль, равную 20% от суммы всех ваших инвестиций. Вы инвестировали в открытие фитнес-центра 1000000 рублей. Эти деньги были потрачены на ремонт помещения, покупку оборудования и рекламу. Ожидается, что в первый год работы фитнес-цента будет продано 10000 абонементов. Рассчитайте цену на один абонемент.","formula_id":"f-roi","asks":[{"label":"Цена абонемента","value":220,"unit":"руб.","tol":0.5}],"steps":["Л3, сл. 48: P = UC + ROI × I / Q. Целевая рентабельность 20% от инвестиций, это сказано в условии.","0,20 × 1 000 000 / 10 000 = 200 000 / 10 000 = 20 руб.","P = 200 + 20 = 220 руб.","Проверка: (220 − 200) × 10 000 = 200 000 руб. = 20% от 1 000 000."],"answer_text":"220 руб. за абонемент.","trap":"20% здесь от инвестиций, так сказано в условии. 200 × 1,20 = 240 это норматив к издержкам, другая формула.","ambiguity":"Издержки названы «на одно посещение», а продаются абонементы. Других данных нет: считаем 200 руб. на абонемент, как все решения."},{"id":"v5-p3","source":"Прошлый год, вариант 5, задача 3","level":"прошлый год","text":"Компания \"Комп\" занимается продажей электроники. Они хотят приобрести новую партию смартфонов для своего магазина. Поставщик предлагает смартфоны по цене 18000 руб. за штуку, но требует, чтобы компания \"Комп\" продавала их не дешевле 22500 руб. Компания \"Комп\" хочет иметь торговую скидку в размере 25% на каждый смартфон, чтобы оставаться конкурентоспособными на рынке. Рассчитайте:\n1) Какова должна быть отпускная цена поставщика, чтобы компания \"Комп\" могла продавать смартфоны по требуемой цене с учетом торговой скидки?\n2) Сколько смартфонов компания \"Комп\" должна заказать, чтобы получить общую выручку не менее 450000 руб.?","formula_id":"f-trade2","asks":[{"label":"Отпускная цена поставщика","value":16875,"unit":"руб.","tol":0.5},{"label":"Сколько смартфонов заказать","value":20,"unit":"шт.","tol":0}],"steps":["Конечную цену 22 500 задаёт поставщик, Комп хочет торговую скидку 25%: ситуация 2, Л3, сл. 50: P_P = P_S × (1 − M_SP).","P_P = 22 500 × (1 − 0,25) = 16 875 руб. Дороже этой цены Комп смартфон не возьмёт.","Проверка: при цене поставщика 18 000 скидка Комп (22 500 − 18 000) / 22 500 = 20%, меньше 25%. Поставщику нужно снизить цену до 16 875.","Выручка Комп = цена продажи × количество: Q = 450 000 / 22 500 = 20 шт."],"answer_text":"1) 16 875 руб. 2) 20 смартфонов.","trap":"Скидка 25% считается от конечной цены: 22 500 × 0,75. Расчёт 18 000 / 0,75 = 24 000 отвечает на другой вопрос: по какой цене продавать при закупке за 18 000.","ambiguity":"Однокурсник прочитал как ситуацию 1: P_S = 18 000 / (1 − 0,25) = 24 000 и 450 000 / 24 000 = 18,75, значит 19 шт. Откуда такое прочтение: на Л3, сл. 50 в ситуации 1 «Отпускная цена на продукт В должна быть не менее 10 000 руб.», это цена продавца P_S. В «Комп» спрашивают отпускную цену поставщика, то есть цену, по которой продаёт поставщик: это P_P. Берём ситуацию 2 (Л3, сл. 50): ищем цену поставки для Комп, конечную цену 22 500 задаёт поставщик, как в формулировке слайда. Числа сходятся ровно: 450 000 / 22 500 = 20. На экзамене добавь строку: «если закупать по 18 000, для скидки 25% продавать по 24 000, тогда нужно 19 шт.»"},{"id":"pool-1","source":"Пул 2026, задача 1","level":"пул","text":"Компания выпускает профессиональные кофемолки. Прямые переменные затраты составляют 3 600 руб. на единицу. На продукт отнесено 9 600 000 руб. годовых накладных расходов. План продаж – 8 000 единиц. Руководство требует получить 6 400 000 руб. прибыли.\n1. Рассчитайте цену методом «прямые затраты + накладные расходы + целевая прибыль».\n2. Определите полную себестоимость единицы, наценку на полную себестоимость и маржу в цене.\n3. Рассчитайте цену, если вместо фиксированной массы прибыли руководство установит целевую маржу 20%.\n4. Объясните, почему умножение полной себестоимости на 1,20 не обеспечивает маржу 20%.","formula_id":"f-model1","asks":[{"label":"Цена для прибыли 6,4 млн","value":5600,"unit":"руб.","tol":0.5},{"label":"Полная себестоимость единицы","value":4800,"unit":"руб.","tol":0.5},{"label":"Наценка на себестоимость","value":16.67,"unit":"%","tol":0.05},{"label":"Маржа в цене","value":14.29,"unit":"%","tol":0.05},{"label":"Цена при целевой марже 20%","value":6000,"unit":"руб.","tol":0.5},{"label":"Маржа при цене «себестоимость × 1,20»","value":16.67,"unit":"%","tol":0.05}],"steps":["Шаг 1. Модель №1: P = VC + (FC + П) / Q = 3 600 + (9 600 000 + 6 400 000) / 8 000 = 3 600 + 2 000 = 5 600 руб.","Шаг 2. Полная себестоимость: C = VC + FC / Q = 3 600 + 9 600 000 / 8 000 = 3 600 + 1 200 = 4 800 руб.","Прибыль на единицу 5 600 − 4 800 = 800 руб.; проверка: 800 × 8 000 = 6 400 000 руб.","Наценка n = (P − C) / C = 800 / 4 800 = 16,67%. Маржа m = (P − C) / P = 800 / 5 600 = 14,29%.","Шаг 3. Цена под маржу 20%: P = C / (1 − m) = 4 800 / 0,80 = 6 000 руб. Прибыль 1 200 руб. на единицу, 9 600 000 руб. в год.","Шаг 4. 4 800 × 1,20 = 5 760 руб. даёт наценку 20%, маржа при этом (5 760 − 4 800) / 5 760 = 16,67%. Маржа считается от цены, поэтому нужна формула с делением."],"answer_text":"Цена 5 600 руб.; себестоимость 4 800 руб.; наценка 16,67%; маржа 14,29%. Для маржи 20% цена 6 000 руб.","trap":"Наценка делится на себестоимость, маржа на цену. На Л3, сл. 8 формула «Себестоимость × (1 + Процент маржи)» на деле даёт наценку: пул считает маржу через деление, так и пиши."},{"id":"pool-2","source":"Пул 2026, задача 2","level":"пул","text":"Компания запускает умное устройство для дома. Полные удельные издержки составляют 1 240 руб., инвестиции в запуск – 45 000 000 руб., план продаж – 18 000 единиц. Целевая рентабельность инвестиций – 24%.\nНа рынке сопоставимые устройства продаются от 1 690 до 2 090 руб. Компания позиционирует продукт на уровне α=0,62 внутри конкурентного диапазона. Исследование WTP показывает верхнюю границу готовности платить 1 950 руб.\n1. Рассчитайте минимальную цену для целевой рентабельности инвестиций.\n2. Рассчитайте цену по диапазонной конкурентной стратегии.\n3. Предложите итоговую психологическую цену, не превышающую WTP.\n4. Определите фактическую рентабельность инвестиций и маржу при итоговой цене.","formula_id":"f-roi","asks":[{"label":"Минимальная цена для ROI 24%","value":1840,"unit":"руб.","tol":0.5},{"label":"Диапазонная цена","value":1938,"unit":"руб.","tol":0.5},{"label":"Психологическая цена","value":1937.99,"unit":"руб.","tol":0.005},{"label":"Фактическая ROI","value":27.92,"unit":"%","tol":0.05},{"label":"Маржа","value":36.02,"unit":"%","tol":0.05}],"steps":["Шаг 1. P_ROI = UC + ROI × I / Q = 1 240 + 0,24 × 45 000 000 / 18 000 = 1 240 + 600 = 1 840 руб.","Шаг 2. P_range = P_min + (P_max − P_min) × α = 1 690 + (2 090 − 1 690) × 0,62 = 1 690 + 248 = 1 938 руб.","Шаг 3. 1 938 ниже WTP 1 950. Окончание 9,99 сразу под расчётной ценой: 1 938 − 0,01 = 1 937,99 руб. Это выше минимума 1 840.","Шаг 4. Прибыль (1 937,99 − 1 240) × 18 000 = 12 563 820 руб.; ROI = 12 563 820 / 45 000 000 = 27,92%.","Маржа (1 937,99 − 1 240) / 1 937,99 = 36,02%."],"answer_text":"Минимум 1 840 руб.; диапазонная 1 938 руб.; психологическая 1 937,99 руб.; ROI около 27,92%, маржа около 36,02%.","trap":"Психологическая цена с копейками: 1 937,99, округлять до 1 938 нельзя. Итог проверь с двух сторон: не ниже минимума по ROI и не выше WTP."},{"id":"pool-3","source":"Пул 2026, задача 3","level":"пул","text":"SaaS-сервис автоматизирует закупочную аналитику корпоративного клиента. Он экономит 3 200 часов работы в год. Стоимость часа сотрудника — 1 800 руб. По оценке клиента, на сервис приходится 35% получаемого эффекта.\nЛучшая альтернатива стоит 1 080 000 руб. в год. По сравнению с ней новый сервис дает дополнительную экономию времени стоимостью 540 000 руб. и снижение ожидаемых потерь от ошибок на 260 000 руб., но требует затрат на миграцию и обучение 140 000 руб. Исследование WTP показывает готовность платить не более 1 620 000 руб. в год. Годовые затраты поставщика на обслуживание клиента — 720 000 руб.\n1. Рассчитайте монетизированную и атрибутируемую ценность.\n2. Рассчитайте дифференцированную ценность и VBP относительно альтернативы.\n3. Установите итоговую цену с учетом WTP.\n4. Рассчитайте цену в месяц, маржу поставщика и остающуюся у клиента атрибутируемую ценность.","formula_id":"f-vbp","asks":[{"label":"Монетизированная выгода B","value":5760000,"unit":"руб.","tol":1},{"label":"Атрибутируемая ценность AV","value":2016000,"unit":"руб.","tol":1},{"label":"Дифференцированная ценность DV","value":660000,"unit":"руб.","tol":1},{"label":"VBP","value":1740000,"unit":"руб.","tol":1},{"label":"Итоговая цена в год","value":1620000,"unit":"руб.","tol":1},{"label":"Цена в месяц","value":135000,"unit":"руб.","tol":1},{"label":"Маржа поставщика","value":55.56,"unit":"%","tol":0.05},{"label":"Остаток ценности у клиента","value":396000,"unit":"руб.","tol":1}],"steps":["Шаг 1. B = 3 200 × 1 800 = 5 760 000 руб. в год; AV = 5 760 000 × 0,35 = 2 016 000 руб.","Шаг 2. DV = 540 000 + 260 000 − 140 000 = 660 000 руб.; VBP = 1 080 000 + 660 000 = 1 740 000 руб. в год.","Шаг 3. WTP 1 620 000 меньше VBP: P = min(1 740 000; 1 620 000) = 1 620 000 руб. в год.","Шаг 4. В месяц: 1 620 000 / 12 = 135 000 руб. (в PDF опечатка «1 650 000 / 12», результат 135 000 верный).","Маржа (1 620 000 − 720 000) / 1 620 000 = 55,56%.","Клиенту остаётся 2 016 000 − 1 620 000 = 396 000 руб. в год."],"answer_text":"B 5 760 000 руб.; AV 2 016 000 руб.; DV 660 000 руб.; VBP 1 740 000 руб. Цена с учётом WTP 1 620 000 руб. в год, 135 000 руб. в месяц. Маржа 55,56%, клиенту остаётся 396 000 руб.","trap":"Затраты на миграцию и обучение вычитай из DV. WTP ограничивает цену сверху: берём меньшее из VBP и WTP. Месячная цена от итоговой 1 620 000."},{"id":"pool-4","source":"Пул 2026, задача 4","level":"пул","text":"Компания выводит на рынок беспроводные наушники. Данные по конкурентам:\nКонкурент A: цена 4 200 руб., доля рынка 15%\nКонкурент B: цена 4 550 руб., доля рынка 25%\nКонкурент C: цена 4 900 руб., доля рынка 35%\nКонкурент D: цена 5 300 руб., доля рынка 25%\nКомпания считает оправданной премию 6% к средневзвешенной рыночной цене. Для диапазонной стратегии релевантными границами признаны 4 550 и 5 300 руб., а уровень позиционирования равен α=0,70. WTP составляет 5 100 руб., себестоимость – 3 600 руб.\nЦеновое правило компании: итоговая цена не должна превышать меньшую из премиальной цены и WTP; среди целых значений выбирается наибольшая цена, заканчивающаяся на 9.\n1. Рассчитайте средневзвешенную цену рынка.\n2. Рассчитайте премиальную и диапазонную цены.\n3. Установите итоговую цену по правилу компании.\n4. Рассчитайте наценку и маржу.","formula_id":"f-market","asks":[{"label":"Средневзвешенная цена рынка","value":4807.5,"unit":"руб.","tol":0.5},{"label":"Премиальная цена","value":5095.95,"unit":"руб.","tol":0.5},{"label":"Диапазонная цена","value":5075,"unit":"руб.","tol":0.5},{"label":"Итоговая цена","value":5089,"unit":"руб.","tol":0},{"label":"Наценка","value":41.36,"unit":"%","tol":0.05},{"label":"Маржа","value":29.26,"unit":"%","tol":0.05}],"steps":["Шаг 1. P̄ = 4 200 × 0,15 + 4 550 × 0,25 + 4 900 × 0,35 + 5 300 × 0,25 = 630 + 1 137,5 + 1 715 + 1 325 = 4 807,50 руб.","Шаг 2. Премия 6%: 4 807,50 × 1,06 = 5 095,95 руб. Диапазонная: 4 550 + (5 300 − 4 550) × 0,70 = 5 075 руб.","Шаг 3. Граница по правилу: min(5 095,95; 5 100) = 5 095,95 руб. Наибольшая целая цена на 9 не выше границы: 5 089 руб. (5 099 уже выше).","Шаг 4. Наценка (5 089 − 3 600) / 3 600 = 41,36%; маржа (5 089 − 3 600) / 5 089 = 29,26%."],"answer_text":"Средневзвешенная 4 807,50 руб.; премиальная 5 095,95 руб.; диапазонная 5 075 руб. Итоговая 5 089 руб., наценка 41,36%, маржа 29,26%.","trap":"Взвешивай по долям: простое среднее четырёх цен 4 737,50 руб. Диапазонная цена в правило не входит: граница это меньшая из премиальной и WTP."},{"id":"pool-5","source":"Пул 2026, задача 5","level":"пул","text":"Онлайн-платформа продает билеты на мероприятие. Базовая цена – 3 000 руб. В рассматриваемый момент спрос составляет 820 билетов, доступное предложение – 650 билетов, коэффициент чувствительности α=0,50.\nПосле корректировки по спросу и предложению система учитывает три независимых внешних фактора:\nСезонность: вес 0,15, оценка 0,40\nАкция конкурента: вес 0,10, оценка −0,60\nКрупное городское событие: вес 0,20, оценка 0,70\nРегламент ограничивает цену сверху 3 600 руб. Себестоимость обслуживания одного билета – 2 100 руб. После применения ограничений система выбирает наибольшую целую цену с окончанием 9, не превышающую потолок.\n1. Рассчитайте цену по спросу и предложению.\n2. Выполните многофакторную корректировку.\n3. Примените ценовой потолок и психологическое окончание.\n4. Рассчитайте маржу итоговой цены.","formula_id":"f-dyn","asks":[{"label":"Цена по спросу и предложению","value":3392.31,"unit":"руб.","tol":0.5},{"label":"Сумма влияния факторов Σ wᵢfᵢ","value":0.14,"tol":0.005},{"label":"Цена после факторов","value":3867.23,"unit":"руб.","tol":0.5},{"label":"Итоговая цена","value":3599,"unit":"руб.","tol":0},{"label":"Маржа","value":41.65,"unit":"%","tol":0.05}],"steps":["Шаг 1. P₁ = P_base × (1 + α × (D − S) / S) = 3 000 × (1 + 0,50 × (820 − 650) / 650) = 3 392,31 руб.","Шаг 2. Σ wᵢfᵢ = 0,15 × 0,40 + 0,10 × (−0,60) + 0,20 × 0,70 = 0,06 − 0,06 + 0,14 = 0,14.","P₂ = 3 392,31 × (1 + 0,14) = 3 867,23 руб.","Шаг 3. Расчётная цена выше потолка: min(3 867,23; 3 600) = 3 600 руб. Наибольшая целая цена на 9 не выше потолка: 3 599 руб.","Шаг 4. Маржа (3 599 − 2 100) / 3 599 = 41,65%."],"answer_text":"По спросу и предложению 3 392,31 руб.; после факторов 3 867,23 руб.; после потолка и окончания на 9 3 599 руб. Маржа 41,65%.","trap":"(D − S) делится на предложение S = 650. Акция конкурента с минусом снижает сумму факторов. Потолок и окончание 9 применяй последними."},{"id":"pool-6","source":"Пул 2026, задача 6","level":"пул","text":"Товар проходит цепочку «производитель — дистрибьютор — розничная сеть». Розничная сеть требует торговую скидку 28% от конечной цены. Дистрибьютор требует скидку 16% от своей цены продажи розничной сети. Полная себестоимость производителя — 6 100 руб. Производитель требует маржу не ниже 25%.\nПервоначально маркетинг предложил конечную цену 12 990 руб.\n1. Рассчитайте закупочную цену розницы и отпускную цену производителя при конечной цене 12 990 руб.\n2. Определите фактическую маржу производителя.\n3. Рассчитайте минимальную конечную цену, обеспечивающую маржу производителя 25%.\n4. Предложите минимальную целую психологическую цену с окончанием 9, которая удовлетворяет всем участникам канала.","formula_id":"f-chain","asks":[{"label":"Закупочная цена розницы","value":9352.8,"unit":"руб.","tol":0.5},{"label":"Отпускная цена производителя","value":7856.35,"unit":"руб.","tol":0.5},{"label":"Маржа производителя при 12 990","value":22.36,"unit":"%","tol":0.05},{"label":"Минимальная цена производителя для маржи 25%","value":8133.33,"unit":"руб.","tol":0.5},{"label":"Минимальная конечная цена","value":13447.97,"unit":"руб.","tol":0.5},{"label":"Психологическая цена","value":13449,"unit":"руб.","tol":0}],"steps":["Шаг 1. Розница: P_R = 12 990 × (1 − 0,28) = 9 352,80 руб. Производитель: P_M = 9 352,80 × (1 − 0,16) = 7 856,35 руб.","Шаг 2. Маржа производителя (7 856,35 − 6 100) / 7 856,35 = 22,36%. Требование 25% не выполнено.","Шаг 3. Минимальная цена производителя: 6 100 / (1 − 0,25) = 8 133,33 руб.","Конечная цена: P_M = P_final × 0,72 × 0,84, значит P_final = 6 100 / (0,75 × 0,72 × 0,84) = 13 447,97 руб.","Шаг 4. Минимальная целая цена на 9 не меньше 13 447,97: 13 449 руб.","Проверка: 13 449 × 0,72 × 0,84 = 8 133,96 руб., маржа 25,01%."],"answer_text":"При 12 990 розница закупает по 9 352,80 руб., дистрибьютор по 7 856,35 руб., маржа производителя 22,36%. Минимальная конечная цена 13 447,97 руб., рекомендуемая 13 449 руб.","trap":"Скидки по цепочке перемножаются: 0,72 × 0,84 = 0,6048. Здесь граница снизу (нужна маржа), поэтому цену на 9 берём выше: 13 449. Цена 13 439 уже ниже минимума."},{"id":"pool-7","source":"Пул 2026, задача 7","level":"пул","text":"Компания продает три продукта в устойчивом натуральном миксе 50% : 30% : 20%.\nПродукт A: цена 1 800 руб., переменные затраты 1 000 руб., доля в количестве 50%\nПродукт B: цена 2 900 руб., переменные затраты 1 700 руб., доля в количестве 30%\nПродукт C: цена 4 600 руб., переменные затраты 2 800 руб., доля в количестве 20%\nПостоянные затраты – 13 440 000 руб.\n1. Рассчитайте средневзвешенную маржинальную прибыль на условную единицу продаж.\n2. Рассчитайте точку безубыточности и количество каждого продукта.\n3. Определите выручку в точке безубыточности.\n4. Рассмотрите акцию: цена B снижается на 10%, микс становится 45% : 40% : 15%, а постоянные затраты возрастают на 600 000 руб. Рассчитайте новую точку безубыточности, сохраняя новый микс точно.","formula_id":"f-bep","asks":[{"label":"Средневзвешенная маржинальная прибыль","value":1120,"unit":"руб.","tol":0.5},{"label":"ТБУ","value":12000,"unit":"шт.","tol":0},{"label":"Из них A","value":6000,"unit":"шт.","tol":0},{"label":"Из них B","value":3600,"unit":"шт.","tol":0},{"label":"Из них C","value":2400,"unit":"шт.","tol":0},{"label":"Выручка в ТБУ","value":32280000,"unit":"руб.","tol":1},{"label":"Новая средневзвешенная маржинальная прибыль","value":994,"unit":"руб.","tol":0.5},{"label":"Новая ТБУ","value":14125,"unit":"шт.","tol":0},{"label":"Выручка в новой ТБУ","value":35934700,"unit":"руб.","tol":1}],"steps":["Шаг 1. Маржинальная прибыль: A 1 800 − 1 000 = 800; B 2 900 − 1 700 = 1 200; C 4 600 − 2 800 = 1 800 руб.","WACM = 800 × 0,50 + 1 200 × 0,30 + 1 800 × 0,20 = 400 + 360 + 360 = 1 120 руб.","Шаг 2. Q_BE = FC / WACM = 13 440 000 / 1 120 = 12 000 шт. (в PDF в числителе опечатка VC, нужны постоянные FC).","A: 12 000 × 0,50 = 6 000; B: 12 000 × 0,30 = 3 600; C: 12 000 × 0,20 = 2 400 шт.","Шаг 3. Выручка: 6 000 × 1 800 + 3 600 × 2 900 + 2 400 × 4 600 = 10 800 000 + 10 440 000 + 11 040 000 = 32 280 000 руб.","Шаг 4. Новая цена B: 2 900 × 0,90 = 2 610 руб., CM_B = 2 610 − 1 700 = 910 руб.","WACM' = 800 × 0,45 + 910 × 0,40 + 1 800 × 0,15 = 360 + 364 + 270 = 994 руб.; FC' = 13 440 000 + 600 000 = 14 040 000 руб.","Q' = 14 040 000 / 994 = 14 124,75, часть штуки продать нельзя: вверх до 14 125 шт.","По миксу: A 6 356, B 5 650, C 2 119 шт. Выручка 6 356 × 1 800 + 5 650 × 2 610 + 2 119 × 4 600 = 35 934 700 руб."],"answer_text":"WACM 1 120 руб.; ТБУ 12 000 шт. (6 000 A, 3 600 B, 2 400 C), выручка 32 280 000 руб. После акции ТБУ 14 125 шт., выручка 35 934 700 руб.","trap":"В числителе постоянные затраты FC. Дробную ТБУ округляй вверх: 14 124,75 даёт 14 125. Выручку в ТБУ считай по каждому продукту по его цене.","ambiguity":"«Сохраняя новый микс точно»: в эталоне общий объём округлён вверх до 14 125, а штуки по продуктам до целых (6 356,25 и 2 118,75 округлены). Если требовать микс 45 : 40 : 15 в целых штуках строго, объём должен делиться на 20: 14 140. Берём эталон пула, 14 125."},{"id":"pool-8","source":"Пул 2026, задача 8","level":"пул","text":"Компания анализирует ассортимент по годовому вкладу в маржинальную прибыль.\nПродукт A: цена 5 000 руб., переменные затраты 3 000 руб., продажи 1 000 шт.\nПродукт B: цена 3 000 руб., переменные затраты 1 800 руб., продажи 900 шт.\nПродукт C: цена 2 500 руб., переменные затраты 1 600 руб., продажи 700 шт.\nПродукт D: цена 1 600 руб., переменные затраты 1 100 руб., продажи 800 шт.\nПродукт E: цена 1 000 руб., переменные затраты 700 руб., продажи 1 000 шт.\nПродукт F: цена 800 руб., переменные затраты 510 руб., продажи 1 000 шт.\nИспользуйте правило: группа A – позиции до накопленного вклада около 80%; группа B – следующие позиции до 95%; группа C – остальные. Если очередной товар заметно пересекает границу, преподаватель вправе принять обоснованное соседнее решение, но в эталоне используется наиболее близкая к границе классификация.\nДля продукта D руководство устанавливает целевую маржу не ниже 40%. После повышения цены ожидается снижение объема продаж на 6%. Рассматриваются психологические цены 1 799 и 1 849 руб.\n1. Рассчитайте годовую маржинальную прибыль каждого продукта, доли и ABC-классы.\n2. Рассчитайте минимальную цену D для маржи 40%.\n3. Сравните цены 1 799 и 1 849 руб. по марже и годовому вкладу.\n4. Выберите цену и повторно оцените долю продукта D в общей маржинальной прибыли.","formula_id":"f-abc","asks":[{"label":"Общий годовой вклад","value":4700000,"unit":"руб.","tol":1},{"label":"Доля D в общем вкладе","value":8.51,"unit":"%","tol":0.05},{"label":"Сколько позиций в группе A","value":3,"unit":"шт.","tol":0},{"label":"Сколько позиций в группе B","value":2,"unit":"шт.","tol":0},{"label":"Минимальная цена D для маржи 40%","value":1833.33,"unit":"руб.","tol":0.5},{"label":"Маржа при 1 799","value":38.85,"unit":"%","tol":0.05},{"label":"Вклад D при 1 799","value":525648,"unit":"руб.","tol":1},{"label":"Маржа при 1 849","value":40.51,"unit":"%","tol":0.05},{"label":"Вклад D при 1 849","value":563248,"unit":"руб.","tol":1},{"label":"Новая доля D","value":11.58,"unit":"%","tol":0.05}],"steps":["Шаг 1. Вклад = (цена − переменные) × продажи: A 2 000 000; B 1 080 000; C 630 000; D 400 000; E 300 000; F 290 000. Всего 4 700 000 руб.","Доли по убыванию: 42,55 / 22,98 / 13,4 / 8,51 / 6,38 / 6,17%. Накопленные: 42,55 / 65,53 / 78,94 / 87,45 / 93,83 / 100%.","Классы: A, B, C до 78,94% в группе A; D (87,45%) и E (93,83%) в группе B; F в группе C.","Шаг 2. Минимальная цена D: 1 100 / (1 − 0,40) = 1 833,33 руб. Цена 1 799 маржу 40% не даёт.","Шаг 3. Объём D после повышения: 800 × (1 − 0,06) = 752 шт.","1 799: маржа (1 799 − 1 100) / 1 799 = 38,85% (в PDF «≈ 38,86%», точнее 38,85), вклад 699 × 752 = 525 648 руб.","1 849: маржа (1 849 − 1 100) / 1 849 = 40,51%, вклад 749 × 752 = 563 248 руб. Выше и вклад, и маржа: берём 1 849.","Шаг 4. Новый общий вклад 4 700 000 − 400 000 + 563 248 = 4 863 248 руб.; доля D 563 248 / 4 863 248 = 11,58%.","Накопленная доля после A, B, C 76,29%, после D 87,87%: D остаётся в группе B."],"answer_text":"Группа A: продукты A, B, C; группа B: D, E; группа C: F. Минимальная цена D для маржи 40% 1 833,33 руб. 1 799 даёт 38,85% маржи, 1 849 даёт 40,51% и вклад 563 248 руб. Доля D растёт с 8,51% до 11,58%.","trap":"Маржа здесь к цене по переменным затратам: P = VC / (1 − 0,40). Новый объём 752 одинаков для обеих цен. Доли считай от нового общего вклада."},{"id":"tr-1","source":"Тренировка 1","level":"тренировка","formula_id":"f-ptc","text":"Мебельная фабрика «Дубрава» назначает цену стула по нормативу рентабельности. Удельные полные издержки на один стул 2 400 руб., норматив рентабельности к издержкам 15%. Через год издержки вырастут до 2 640 руб., норматив останется прежним. Какой будет цена стула сейчас и через год?","asks":[{"label":"Цена сейчас","value":2760,"unit":"руб.","tol":0.5},{"label":"Цена через год","value":3036,"unit":"руб.","tol":0.5}],"steps":["Л3, сл. 45: P = UC × (1 + PTC_UC).","Сейчас: 2 400 × 1,15 = 2 760 руб.","Через год: 2 640 × 1,15 = 3 036 руб."],"answer_text":"2 760 руб. сейчас, 3 036 руб. через год.","trap":"Через год меняются только издержки, норматив 15% тот же."},{"id":"tr-2","source":"Тренировка 2","level":"тренировка","formula_id":"f-discount","text":"Магазин продаёт велосипед за 24 900 руб. На осенней распродаже на эту модель действует скидка 12%. Рассчитай цену со скидкой и сколько рублей экономит покупатель.","asks":[{"label":"Цена со скидкой","value":21912,"unit":"руб.","tol":0.5},{"label":"Экономия покупателя","value":2988,"unit":"руб.","tol":0.5}],"steps":["P = P₀ × (1 − d) = 24 900 × 0,88 = 21 912 руб.","Экономия: 24 900 − 21 912 = 2 988 руб. (то же 24 900 × 0,12)."],"answer_text":"21 912 руб., экономия 2 988 руб."},{"id":"tr-3","source":"Тренировка 3","level":"тренировка","formula_id":"f-roi","text":"Студия йоги вложила в ремонт зала и оборудование 2 400 000 руб. Удельные полные издержки на одно занятие 350 руб., план на год 12 000 занятий. Целевая рентабельность инвестиций 30%. Рассчитай минимальную цену занятия методом целевой рентабельности инвестиций.","asks":[{"label":"Цена занятия","value":410,"unit":"руб.","tol":0.5}],"steps":["Л3, сл. 48: P = UC + ROI × I / Q.","0,30 × 2 400 000 / 12 000 = 720 000 / 12 000 = 60 руб.","P = 350 + 60 = 410 руб."],"answer_text":"410 руб. за занятие."},{"id":"tr-4","source":"Тренировка 4","level":"тренировка","formula_id":"f-roi","text":"Стартап «АкваЧист» выпускает фильтр для воды.\nИнвестиции: 6 млн руб.\nВыпуск: 4 000 шт. в год.\nЦелевая рентабельность: 20% инвестиций.\nМатериалы на единицу: 900 руб.\nТруд на единицу: 350 руб.\nМаркетинг и доставка: 600 000 руб. в год.\nНайди удельные полные издержки, цену и целевую прибыль за год.","asks":[{"label":"Удельные полные издержки","value":1400,"unit":"руб.","tol":0.5},{"label":"Цена","value":1700,"unit":"руб.","tol":0.5},{"label":"Целевая прибыль за год","value":1200000,"unit":"руб.","tol":1}],"steps":["UC = 900 + 350 + 600 000 / 4 000 = 900 + 350 + 150 = 1 400 руб.","Прибыль на единицу: 0,20 × 6 000 000 / 4 000 = 300 руб.","P = 1 400 + 300 = 1 700 руб. (Л3, сл. 48).","Целевая прибыль: 0,20 × 6 000 000 = 1 200 000 руб. в год (300 × 4 000)."],"answer_text":"UC 1 400 руб., цена 1 700 руб., целевая прибыль 1 200 000 руб. в год.","trap":"Маркетинг и доставку раздели на выпуск и прибавь к UC, как в «ЭкоБусте». Без них цена 1 550, это ошибка."},{"id":"tr-5","source":"Тренировка 5","level":"тренировка","formula_id":"f-model1","text":"Пекарня «Колос» печёт торты на заказ. Прямые затраты на один торт 1 100 руб. На торты отнесено 360 000 руб. накладных расходов в год. Владелец хочет получить 540 000 руб. прибыли при плане 1 500 тортов в год. Какой должна быть цена торта?","asks":[{"label":"Цена торта","value":1700,"unit":"руб.","tol":0.5}],"steps":["Модель расчета №1, Л3, сл. 46: P = VC + (FC + П) / Q.","(360 000 + 540 000) / 1 500 = 900 000 / 1 500 = 600 руб.","P = 1 100 + 600 = 1 700 руб."],"answer_text":"1 700 руб."},{"id":"tr-6","source":"Тренировка 6","level":"тренировка","formula_id":"f-model1","text":"Типография печатает настенные календари. Прямые затраты на весь годовой тираж 40 000 штук составляют 2 000 000 руб. Накладные расходы за год 600 000 руб., целевая прибыль 1 000 000 руб. Все календари будут проданы. Какую цену поставить на календарь?","asks":[{"label":"Прямые затраты на календарь","value":50,"unit":"руб.","tol":0.5},{"label":"Цена календаря","value":90,"unit":"руб.","tol":0.5}],"steps":["Прямые затраты даны на весь тираж: на единицу 2 000 000 / 40 000 = 50 руб.","(600 000 + 1 000 000) / 40 000 = 1 600 000 / 40 000 = 40 руб.","P = 50 + 40 = 90 руб.","Проверка: 90 × 40 000 = 3 600 000 = 2 000 000 + 600 000 + 1 000 000."],"answer_text":"90 руб. за календарь.","trap":"Подставишь 2 000 000 как затраты на единицу, выйдет 2 000 040. Сначала проверь, на что даны прямые затраты: на штуку или на весь выпуск."},{"id":"tr-7","source":"Тренировка 7","level":"тренировка","formula_id":"f-ptc","text":"Компания «ЭкоКружка» делает керамические кружки. Полные издержки на одну кружку 360 руб., норматив рентабельности к издержкам 30%. Руководство хочет, чтобы розничная цена была не ниже 490 руб. Определи цену. Для заказов от 50 штук действует скидка 8%: найди цену кружки для оптовика и сумму заказа на 50 штук.","asks":[{"label":"Цена по нормативу","value":468,"unit":"руб.","tol":0.5},{"label":"Итоговая розничная цена","value":490,"unit":"руб.","tol":0.5},{"label":"Цена со скидкой 8%","value":450.8,"unit":"руб.","tol":0.5},{"label":"Сумма за 50 кружек","value":22540,"unit":"руб.","tol":1}],"steps":["Л3, сл. 45: P = 360 × 1,30 = 468 руб.","468 \u003c 490, итоговая цена 490 руб.","Опт: 490 × (1 − 0,08) = 450,80 руб.","50 × 450,80 = 22 540 руб."],"answer_text":"Цена 490 руб.; опт 450,80 руб. за кружку, 22 540 руб. за 50 штук.","trap":"Скидку бери от итоговой цены 490, она выше расчётной."},{"id":"tr-8","source":"Тренировка 8","level":"тренировка","formula_id":"f-trade2","text":"Производитель чая задаёт конечную розничную цену пачки 640 руб. Магазин «Лист» работает с торговой скидкой 25%. По какой максимальной цене поставки магазин возьмёт пачку? Сколько он заплатит за партию 500 пачек?","asks":[{"label":"Цена поставки за пачку","value":480,"unit":"руб.","tol":0.5},{"label":"Партия 500 пачек","value":240000,"unit":"руб.","tol":1}],"steps":["Конечную цену задаёт поставщик: ситуация 2, Л3, сл. 50: P_P = P_S × (1 − M_SP).","P_P = 640 × 0,75 = 480 руб.","Партия: 480 × 500 = 240 000 руб."],"answer_text":"Не дороже 480 руб. за пачку, 240 000 руб. за партию."},{"id":"tr-9","source":"Тренировка 9","level":"тренировка","formula_id":"f-trade1","text":"Поставщик хочет получать за кофемашину 36 000 руб., конечная цена не ограничена. Магазин работает с торговой скидкой 20%. По какой минимальной цене магазину продавать кофемашину? Сколько кофемашин нужно продать, чтобы выручка магазина была не меньше 1 000 000 руб.?","asks":[{"label":"Минимальная цена продажи","value":45000,"unit":"руб.","tol":0.5},{"label":"Сколько продать","value":23,"unit":"шт.","tol":0}],"steps":["Задана цена поставщика: ситуация 1, Л3, сл. 50: P_S = P_P / (1 − M_SP).","P_S = 36 000 / 0,80 = 45 000 руб.","Q = 1 000 000 / 45 000 = 22,22. Штуки целые и выручка «не меньше»: 23 шт."],"answer_text":"45 000 руб.; 23 кофемашины.","trap":"36 000 × 1,20 = 43 200 даёт магазину скидку только 16,67%. 22 штуки дадут 990 000 руб., мало."},{"id":"tr-10","source":"Тренировка 10","level":"тренировка","formula_id":"f-trade2","text":"Поставщик ноутбуков предлагает их магазину «Пиксель» по 52 000 руб. за штуку и требует продавать не дешевле 64 000 руб. «Пиксель» хочет торговую скидку 25%. 1) Какой должна быть отпускная цена поставщика, чтобы магазин продавал по требуемой цене и получал свою скидку? 2) Какую скидку магазин получит при цене поставщика 52 000 руб.? 3) Сколько ноутбуков заказать, чтобы выручка по цене 64 000 руб. была не меньше 1 000 000 руб.?","asks":[{"label":"Отпускная цена поставщика","value":48000,"unit":"руб.","tol":0.5},{"label":"Скидка магазина при 52 000","value":18.75,"unit":"%","tol":0.05},{"label":"Сколько заказать","value":16,"unit":"шт.","tol":0}],"steps":["Конечную цену задаёт поставщик: ситуация 2, Л3, сл. 50: P_P = 64 000 × (1 − 0,25) = 48 000 руб.","При 52 000: (64 000 − 52 000) / 64 000 = 18,75%, меньше 25%.","Q = 1 000 000 / 64 000 = 15,625, вверх до 16 шт."],"answer_text":"1) 48 000 руб. 2) 18,75%. 3) 16 ноутбуков.","trap":"Тот же тип, что «Комп» (вариант 5, задача 3): скидка от конечной цены 64 000."},{"id":"tr-11","source":"Тренировка 11","level":"тренировка","formula_id":"f-model1","text":"Компания выпускает электросамокаты. Прямые переменные затраты 18 000 руб. на единицу. На продукт отнесено 36 000 000 руб. годовых накладных расходов. План продаж 6 000 штук. Руководство требует 18 000 000 руб. прибыли.\n1. Рассчитай цену методом «прямые затраты + накладные + целевая прибыль».\n2. Определи полную себестоимость единицы, наценку и маржу.\n3. Рассчитай цену при целевой марже 25%.\n4. Какую маржу дала бы цена «себестоимость × 1,25»?","asks":[{"label":"Цена по модели №1","value":27000,"unit":"руб.","tol":0.5},{"label":"Полная себестоимость","value":24000,"unit":"руб.","tol":0.5},{"label":"Наценка","value":12.5,"unit":"%","tol":0.05},{"label":"Маржа","value":11.11,"unit":"%","tol":0.05},{"label":"Цена при марже 25%","value":32000,"unit":"руб.","tol":0.5},{"label":"Маржа при «себестоимость × 1,25»","value":20,"unit":"%","tol":0.05}],"steps":["P = 18 000 + (36 000 000 + 18 000 000) / 6 000 = 18 000 + 9 000 = 27 000 руб.","C = 18 000 + 36 000 000 / 6 000 = 18 000 + 6 000 = 24 000 руб.; прибыль на единицу 3 000 руб.","Наценка 3 000 / 24 000 = 12,5%; маржа 3 000 / 27 000 = 11,11%.","Под маржу 25%: 24 000 / 0,75 = 32 000 руб.","24 000 × 1,25 = 30 000 руб.: наценка 25%, маржа 6 000 / 30 000 = 20%."],"answer_text":"27 000 руб.; C 24 000 руб.; наценка 12,5%, маржа 11,11%; под маржу 25% цена 32 000 руб.; «× 1,25» даёт маржу 20%."},{"id":"tr-12","source":"Тренировка 12","level":"тренировка","formula_id":"f-roi","text":"Компания выводит умную колонку. Полные удельные издержки 2 100 руб., инвестиции 30 000 000 руб., план продаж 25 000 штук, целевая рентабельность инвестиций 20%. Сопоставимые колонки стоят от 2 290 до 3 090 руб., позиционирование α = 0,4. WTP не выше 2 800 руб.\n1. Минимальная цена для целевой ROI.\n2. Цена по диапазонной стратегии.\n3. Психологическая цена: окончание 9,99 сразу под расчётной, не выше WTP.\n4. Фактическая ROI и маржа при итоговой цене.","asks":[{"label":"Минимальная цена по ROI","value":2340,"unit":"руб.","tol":0.5},{"label":"Диапазонная цена","value":2610,"unit":"руб.","tol":0.5},{"label":"Психологическая цена","value":2609.99,"unit":"руб.","tol":0.005},{"label":"Фактическая ROI","value":42.5,"unit":"%","tol":0.05},{"label":"Маржа","value":19.54,"unit":"%","tol":0.05}],"steps":["P_ROI = 2 100 + 0,20 × 30 000 000 / 25 000 = 2 100 + 240 = 2 340 руб.","P_range = 2 290 + (3 090 − 2 290) × 0,4 = 2 290 + 320 = 2 610 руб.","2 610 ниже WTP 2 800: 2 610 − 0,01 = 2 609,99 руб., выше минимума 2 340.","Прибыль (2 609,99 − 2 100) × 25 000 = 12 749 750 руб.; ROI = 12 749 750 / 30 000 000 = 42,5%.","Маржа (2 609,99 − 2 100) / 2 609,99 = 19,54%."],"answer_text":"2 340; 2 610; 2 609,99 руб.; ROI 42,5%, маржа 19,54%."},{"id":"tr-13","source":"Тренировка 13","level":"тренировка","formula_id":"f-vbp","text":"Сервис учёта склада экономит клиенту 2 500 часов работы в год. Час сотрудника стоит 1 200 руб. На сервис приходится 40% эффекта. Лучшая альтернатива стоит 600 000 руб. в год. По сравнению с ней новый сервис даёт дополнительную экономию 300 000 руб. и снижает потери на 150 000 руб., но внедрение стоит 90 000 руб. WTP не выше 900 000 руб. в год. Затраты поставщика на обслуживание клиента 450 000 руб. в год.\n1. Монетизированная выгода и атрибутируемая ценность.\n2. Дифференцированная ценность и VBP.\n3. Итоговая цена с учётом WTP.\n4. Цена в месяц, маржа поставщика и ценность, которая остаётся клиенту.","asks":[{"label":"Монетизированная выгода B","value":3000000,"unit":"руб.","tol":1},{"label":"Атрибутируемая ценность AV","value":1200000,"unit":"руб.","tol":1},{"label":"Дифференцированная ценность DV","value":360000,"unit":"руб.","tol":1},{"label":"VBP","value":960000,"unit":"руб.","tol":1},{"label":"Итоговая цена в год","value":900000,"unit":"руб.","tol":1},{"label":"Цена в месяц","value":75000,"unit":"руб.","tol":1},{"label":"Маржа поставщика","value":50,"unit":"%","tol":0.05},{"label":"Остаток ценности у клиента","value":300000,"unit":"руб.","tol":1}],"steps":["B = 2 500 × 1 200 = 3 000 000 руб.; AV = 3 000 000 × 0,40 = 1 200 000 руб.","DV = 300 000 + 150 000 − 90 000 = 360 000 руб.; VBP = 600 000 + 360 000 = 960 000 руб.","P = min(960 000; 900 000) = 900 000 руб. в год.","В месяц 900 000 / 12 = 75 000 руб.; маржа (900 000 − 450 000) / 900 000 = 50%.","Клиенту остаётся 1 200 000 − 900 000 = 300 000 руб. в год."],"answer_text":"B 3 000 000; AV 1 200 000; DV 360 000; VBP 960 000; цена 900 000 руб. в год (75 000 в месяц); маржа 50%; клиенту 300 000 руб."},{"id":"tr-14","source":"Тренировка 14","level":"тренировка","formula_id":"f-market","text":"Компания выводит фитнес-браслет. Конкуренты: A 2 900 руб., доля 20%; B 3 200 руб., доля 30%; C 3 500 руб., доля 40%; D 4 100 руб., доля 10%. Премия к средневзвешенной цене 5%. Для диапазонной стратегии границы 3 200 и 4 100 руб., α = 0,6. WTP 3 600 руб., себестоимость 2 500 руб. Правило: цена не выше меньшей из премиальной цены и WTP, из целых цен берётся наибольшая с окончанием 9.\n1. Средневзвешенная цена рынка.\n2. Премиальная и диапазонная цены.\n3. Итоговая цена.\n4. Наценка и маржа.","asks":[{"label":"Средневзвешенная цена","value":3350,"unit":"руб.","tol":0.5},{"label":"Премиальная цена","value":3517.5,"unit":"руб.","tol":0.5},{"label":"Диапазонная цена","value":3740,"unit":"руб.","tol":0.5},{"label":"Итоговая цена","value":3509,"unit":"руб.","tol":0},{"label":"Наценка","value":40.36,"unit":"%","tol":0.05},{"label":"Маржа","value":28.75,"unit":"%","tol":0.05}],"steps":["P̄ = 2 900 × 0,20 + 3 200 × 0,30 + 3 500 × 0,40 + 4 100 × 0,10 = 580 + 960 + 1 400 + 410 = 3 350 руб.","Премия: 3 350 × 1,05 = 3 517,50 руб. Диапазон: 3 200 + 900 × 0,6 = 3 740 руб.","Граница: min(3 517,50; 3 600) = 3 517,50 руб. Наибольшая целая на 9 не выше: 3 509 руб. Диапазонная цена в правило не входит.","Наценка (3 509 − 2 500) / 2 500 = 40,36%; маржа (3 509 − 2 500) / 3 509 = 28,75%."],"answer_text":"3 350; 3 517,50; 3 740; итог 3 509 руб.; наценка 40,36%, маржа 28,75%.","trap":"3 519 уже выше границы 3 517,50: бери 3 509."},{"id":"tr-15","source":"Тренировка 15","level":"тренировка","formula_id":"f-dyn","text":"Отель продаёт номера на выходные. Базовая цена 6 000 руб. Спрос 130 бронирований, свободно 100 номеров, коэффициент чувствительности α = 0,4. После корректировки по спросу учитываются факторы: сезонность (вес 0,20, оценка 0,50), акция конкурента (вес 0,10, оценка −0,80), городской форум (вес 0,15, оценка 0,60). Потолок цены 7 500 руб., себестоимость номера 4 200 руб. Система берёт наибольшую целую цену с окончанием 9, не выше потолка и расчётной цены.\n1. Цена по спросу и предложению.\n2. Цена после факторов.\n3. Итоговая цена.\n4. Маржа.","asks":[{"label":"Цена по спросу и предложению","value":6720,"unit":"руб.","tol":0.5},{"label":"Цена после факторов","value":7459.2,"unit":"руб.","tol":0.5},{"label":"Итоговая цена","value":7459,"unit":"руб.","tol":0},{"label":"Маржа","value":43.69,"unit":"%","tol":0.05}],"steps":["P₁ = 6 000 × (1 + 0,4 × (130 − 100) / 100) = 6 000 × 1,12 = 6 720 руб.","Σ wᵢfᵢ = 0,20 × 0,50 + 0,10 × (−0,80) + 0,15 × 0,60 = 0,10 − 0,08 + 0,09 = 0,11.","P₂ = 6 720 × 1,11 = 7 459,20 руб.","Потолок 7 500 не мешает: min(7 459,20; 7 500) = 7 459,20. Наибольшая целая на 9 не выше: 7 459 руб.","Маржа (7 459 − 4 200) / 7 459 = 43,69%."],"answer_text":"6 720; 7 459,20; 7 459 руб.; маржа 43,69%.","trap":"Потолок здесь не срабатывает: окончание 9 берётся от расчётной цены 7 459,20."},{"id":"tr-16","source":"Тренировка 16","level":"тренировка","formula_id":"f-chain","text":"Товар идёт по цепочке: производитель, дистрибьютор, розничная сеть. Сеть требует торговую скидку 30% от конечной цены, дистрибьютор 15% от своей цены продажи сети. Полная себестоимость производителя 4 000 руб., он требует маржу не ниже 20%. Маркетинг предлагает конечную цену 8 490 руб.\n1. Цена закупки сети и отпускная цена производителя при 8 490 руб.\n2. Маржа производителя.\n3. Минимальная конечная цена для маржи 20%.\n4. Минимальная целая цена с окончанием 9, которая устроит всех.","asks":[{"label":"Цена закупки сети","value":5943,"unit":"руб.","tol":0.5},{"label":"Цена производителя","value":5051.55,"unit":"руб.","tol":0.5},{"label":"Маржа производителя","value":20.82,"unit":"%","tol":0.05},{"label":"Минимальная конечная цена","value":8403.36,"unit":"руб.","tol":0.5},{"label":"Цена с окончанием 9","value":8409,"unit":"руб.","tol":0}],"steps":["P_R = 8 490 × 0,70 = 5 943 руб.; P_M = 5 943 × 0,85 = 5 051,55 руб.","Маржа (5 051,55 − 4 000) / 5 051,55 = 20,82%: требование 20% выполнено.","Минимум: 4 000 / (0,80 × 0,70 × 0,85) = 4 000 / 0,476 = 8 403,36 руб.","Наименьшая целая на 9 не ниже минимума: 8 409 руб. Проверка: маржа производителя 20,05%."],"answer_text":"5 943 и 5 051,55 руб.; маржа 20,82%; минимум 8 403,36 руб.; цена 8 409 руб.","trap":"Граница здесь снизу: цену на 9 берём выше минимума. 8 399 уже не даёт маржу 20%."},{"id":"tr-17","source":"Тренировка 17","level":"тренировка","formula_id":"f-bep","text":"Компания продаёт три продукта в миксе 60% : 25% : 15% (по штукам).\nA: цена 900 руб., переменные затраты 600 руб.\nB: цена 1 500 руб., переменные затраты 900 руб.\nC: цена 2 400 руб., переменные затраты 1 400 руб.\nПостоянные затраты 4 800 000 руб.\n1. Средневзвешенная маржинальная прибыль.\n2. ТБУ и количество каждого продукта.\n3. Выручка в ТБУ.\n4. Цена C снижается на 10%, микс 55% : 30% : 15%, постоянные затраты растут на 300 000 руб. Найди новую ТБУ.","asks":[{"label":"WACM","value":480,"unit":"руб.","tol":0.5},{"label":"ТБУ","value":10000,"unit":"шт.","tol":0},{"label":"Из них A","value":6000,"unit":"шт.","tol":0},{"label":"Из них B","value":2500,"unit":"шт.","tol":0},{"label":"Из них C","value":1500,"unit":"шт.","tol":0},{"label":"Выручка в ТБУ","value":12750000,"unit":"руб.","tol":1},{"label":"Новая WACM","value":459,"unit":"руб.","tol":0.5},{"label":"Новая ТБУ","value":11112,"unit":"шт.","tol":0}],"steps":["CM: A 300, B 600, C 1 000 руб. WACM = 300 × 0,60 + 600 × 0,25 + 1 000 × 0,15 = 180 + 150 + 150 = 480 руб.","Q_BE = 4 800 000 / 480 = 10 000 шт.: A 6 000, B 2 500, C 1 500.","Выручка: 6 000 × 900 + 2 500 × 1 500 + 1 500 × 2 400 = 5 400 000 + 3 750 000 + 3 600 000 = 12 750 000 руб.","Новая цена C 2 160 руб., CM_C = 760. WACM' = 300 × 0,55 + 600 × 0,30 + 760 × 0,15 = 165 + 180 + 114 = 459 руб.","Q' = (4 800 000 + 300 000) / 459 = 11 111,11, вверх до 11 112 шт."],"answer_text":"WACM 480 руб.; ТБУ 10 000 шт. (A 6 000, B 2 500, C 1 500); выручка 12 750 000 руб.; новая ТБУ 11 112 шт.","trap":"11 111,11 округляй вверх: 11 111 штук не покроют постоянные затраты."},{"id":"tr-18","source":"Тренировка 18","level":"тренировка","formula_id":"f-abc","text":"Компания оценивает ассортимент по годовому вкладу в маржинальную прибыль (цена, переменные затраты, продажи):\nA: 4 000 руб., 2 500 руб., 600 шт.\nB: 2 000 руб., 1 400 руб., 1 000 шт.\nC: 1 500 руб., 1 000 руб., 700 шт.\nD: 900 руб., 600 руб., 800 шт.\nE: 600 руб., 450 руб., 1 000 шт.\nПравило: группа A до накопленного вклада около 80%, B до 95%, C остальные; при пересечении границы берётся классификация, ближайшая к границе.\nДля E нужна маржа не ниже 30%. После повышения цены продажи E упадут на 5%. Рассматриваются цены 639 и 659 руб.\n1. Общий вклад, накопленная доля и группы.\n2. Минимальная цена E для маржи 30%.\n3. Маржа и вклад E при 639 и 659 руб.\n4. Новая доля E при выбранной цене.","asks":[{"label":"Общий вклад","value":2240000,"unit":"руб.","tol":1},{"label":"Накопленная доля после A, B, C","value":82.59,"unit":"%","tol":0.05},{"label":"Сколько позиций в группе A","value":3,"unit":"шт.","tol":0},{"label":"Минимальная цена E для маржи 30%","value":642.86,"unit":"руб.","tol":0.5},{"label":"Маржа при 639","value":29.58,"unit":"%","tol":0.05},{"label":"Вклад E при 639","value":179550,"unit":"руб.","tol":1},{"label":"Маржа при 659","value":31.71,"unit":"%","tol":0.05},{"label":"Вклад E при 659","value":198550,"unit":"руб.","tol":1},{"label":"Новая доля E","value":8.68,"unit":"%","tol":0.05}],"steps":["Вклад = (цена − переменные) × продажи: A 900 000; B 600 000; C 350 000; D 240 000; E 150 000. Всего 2 240 000 руб.","Накопленные доли: 40,18 / 66,96 / 82,59 / 93,3 / 100%.","После B 66,96%, после C 82,59%: 82,59 ближе к 80, чем 66,96, поэтому A, B, C в группе A. D (93,3%) в группе B, E в группе C.","Минимальная цена E: 450 / (1 − 0,30) = 642,86 руб. Цена 639 её не достигает.","Объём после повышения 1 000 × 0,95 = 950 шт. 639: маржа 29,58%, вклад 189 × 950 = 179 550 руб. 659: маржа 31,71%, вклад 209 × 950 = 198 550 руб. Берём 659.","Новый общий вклад 2 240 000 − 150 000 + 198 550 = 2 288 550 руб.; доля E 8,68%."],"answer_text":"Группа A: A, B, C; B: D; C: E. Минимальная цена E 642,86 руб.; выбираем 659 (маржа 31,71%, вклад 198 550 руб.); доля E 8,68%.","trap":"Маржа по переменным затратам: 450 / 0,70. Цена 639 даёт меньше 30%, хотя ниже 659 всего на 20 руб."},{"id":"tr-19","source":"Тренировка 19","level":"тренировка","formula_id":"f-comp","text":"Новая марка выпускает термокружку. Переменные затраты 230 руб. на штуку, постоянные затраты 120 000 руб. в месяц, план продаж 1 500 штук в месяц. Прямой конкурент в том же сегменте продаёт похожую кружку за 450 руб. Компания ставит цену на 31 руб. ниже конкурента.\n1. Себестоимость кружки при плане продаж.\n2. Цена по формуле «Цена конкурента ± Δ».\n3. Наценка и маржа при этой цене.\n4. Точка безубыточности в штуках.\n5. Цена, если вместо рублей снизить цену конкурента на k = 5%, и наибольшая целая цена на 9 не выше неё.","asks":[{"label":"Себестоимость единицы","value":310,"unit":"руб.","tol":0.5},{"label":"Цена от конкурента","value":419,"unit":"руб.","tol":0.5},{"label":"Наценка","value":35.16,"unit":"%","tol":0.05},{"label":"Маржа","value":26.01,"unit":"%","tol":0.05},{"label":"ТБУ","value":635,"unit":"шт.","tol":0},{"label":"Цена при k = 5%","value":427.5,"unit":"руб.","tol":0.5},{"label":"Целая цена на 9","value":419,"unit":"руб.","tol":0}],"steps":["Полная себестоимость: UC = VC + FC / Q = 230 + 120 000 / 1 500 = 230 + 80 = 310 руб.","Цена от прямого конкурента, Л3, сл. 19: Цена = Цена конкурента ± Δ = 450 − 31 = 419 руб., выше себестоимости 310.","Наценка (419 − 310) / 310 = 35,16%; маржа (419 − 310) / 419 = 26,01%.","ТБУ одного продукта: 120 000 / (419 − 230) = 120 000 / 189 = 634,92, вверх до 635 шт. План 1 500 выше.","С процентом, Л3, сл. 20: 450 × (1 − 0,05) = 427,50 руб. Наибольшая целая цена на 9 не выше: 419 руб., та же цена."],"answer_text":"Себестоимость 310 руб.; цена 419 руб.; наценка 35,16%, маржа 26,01%; ТБУ 635 шт. в месяц; при k = 5% 427,50 руб., с окончанием 9: 419 руб.","trap":"В ТБУ дели на маржинальную прибыль по переменным затратам: 120 000 / (419 − 310) = 1 100,92 неверно, постоянные уже вошли в себестоимость 310. Дробную ТБУ округляй вверх."},{"id":"tr-20","source":"Тренировка 20","level":"тренировка","formula_id":"f-elast","text":"Магазин канцтоваров снизил цену тетради А5 с 80 до 72 руб. Продажи выросли с 1 500 до 1 950 штук в месяц.\n1. На сколько процентов изменилась цена?\n2. На сколько процентов изменились продажи?\n3. Коэффициент ценовой эластичности спроса. Эластичен ли спрос по цене?","asks":[{"label":"Изменение цены (со знаком)","value":-10,"unit":"%","tol":0.05},{"label":"Изменение продаж","value":30,"unit":"%","tol":0.05},{"label":"Коэффициент эластичности E (со знаком)","value":-3,"tol":0.05}],"steps":["Л2, сл. 8: E = ((ΔQ_d / Q_d) × 100%) / ((ΔP / P) × 100%). Базу берём исходную, до изменения (вывод).","Цена: (72 − 80) / 80 = −8 / 80 = −10%.","Продажи: (1 950 − 1 500) / 1 500 = 450 / 1 500 = 30%.","E = 30% / (−10%) = −3. |E| = 3 больше 1: спрос эластичен по цене (Л2, сл. 8)."],"answer_text":"Цена −10%, продажи +30%, E = −3: |E| больше 1, спрос эластичен по цене.","trap":"Проценты считай от исходных 80 руб. и 1 500 шт. От новых значений вышло бы −11,11% и 23,08%, E = −2,08: тот же вывод, но число неверное."},{"id":"tr-21","source":"Тренировка 21","level":"тренировка","formula_id":"f-express","text":"Студия керамики продаёт кружки ручной работы. Переменные затраты на кружку 400 руб. (глина, глазурь, обжиг). Постоянные затраты 90 000 руб. в месяц, план 150 кружек в месяц. Конкуренты продают похожие кружки по цене от 900 до 1 500 руб. Опрос показал: по цене 3 000 руб. купят хотя бы одну кружку, дороже не купит никто.\n1. Цена, максимизирующая прибыль, по экспресс-методу.\n2. Какую цену дал бы тот же метод, если вместо 3 000 руб. взять максимальную цену конкурентов?","asks":[{"label":"Цена экспресс-методом","value":1700,"unit":"руб.","tol":0.5},{"label":"Цена, если взять максимальную цену конкурентов","value":950,"unit":"руб.","tol":0.5}],"steps":["Л2, сл. 33: цена, максимизирующая прибыль, это среднее арифметическое переменных затрат на единицу и максимальной цены, по которой продашь хотя бы одну единицу: P = (VC + P_F) / 2.","P = (400 + 3 000) / 2 = 3 400 / 2 = 1 700 руб.","С максимальной ценой конкурентов (точка E, сл. 32): (400 + 1 500) / 2 = 950 руб. Оценка занижена: F правее E (сл. 29). Она ещё и ниже полной себестоимости 1 000 руб. (400 + 90 000 / 150): по ней кружки продавались бы в убыток."],"answer_text":"1 700 руб.; с ценой конкурентов вышло бы 950 руб.","trap":"Метод берёт переменные затраты 400 руб., без постоянных. С полной себестоимостью 400 + 90 000 / 150 = 1 000 руб. вышло бы (1 000 + 3 000) / 2 = 2 000 руб., это ошибка."}],"sub":"43 задачи · 3 балла за верную","done_rule":"шаг готов, когда последняя попытка по каждой задаче верная"},{"id":"case","type":"case","icon":"case","title":"Кейс","sub":"20 баллов из 44","done_rule":"Засчитан, когда все 5 пунктов написаны своими словами за 40 минут и чек-лист пройден целиком.","condition":{"source":"Фото бланка прошлого года (с. 2 PDF однокурсника). Структура совпадает со слайдом 86 Л5. На слайде за «Х» скрыты цены поставщиков, аренда, товары и цены игроков; объёмов в месяц и пометок про упаковку и наладку там нет.","text_blocks":["1. Компания производит продукт (выбрать один)\nа) альбом для рисования в прозрачной упаковке (А4, 12 листов) – 1000 штук в месяц\nб) блокноты для заметок без упаковки, без наладки линии (А4, 48 листов) - 1000 штук в месяц\nв) белый картон в упаковке (А4, 12 листов) 100 штук в месяц\nг) бумага плотная в упаковке (А4, 20 листов) – 10000 штук в месяц","2. Ресурсный план компании (выбрать переменные и постоянные затраты на Ваш продукт)\n1. Бумага плотная (упаковка, 5000 листов, цена поставщика 5000 руб.)\n2. Белый картон (упаковка, 1000 листов, цена поставщика 10000 руб.)\n3. Скобы-держатели (упаковка, 10000 штук, цена поставщика 10000 руб.)\n4. Прозрачная упаковка (упаковка, А4, 5000 штук, цена производителя 5000 руб.)\n5. Этикетка-наклейка (упаковка, 100 штук, цена производителя 1000 руб.)\n6. Фасовщик (премиально-сдельная оплата труда, 10 руб/шт)\n7. Мастер производственной линии (повременная оплата труда, 40000 руб. в месяц)\n8. Начальник производственного цеха (повременная оплата труда, 100000 руб. в месяц)\n9. Наладчик производственной линии (премиально-сдельная оплата труда, 100 руб. за 1 наладку, наладка требуется после производства 100 единиц продукта)\n10. аренда цеха (120000 руб. за 12 месяцев)","3. На рынке канцтоваров действуют игроки (выбрать прямого конкурента, определить наценку, определить базовую цену и сегмент:\nА. альбом для рисования по цене 120,00 руб.\nБ. альбом для рисования по цене 170,00 руб.\nВ. альбом для рисования по цене 100,00 руб.\nГ. блокноты для заметок по цене 135,00 руб.\nД. блокноты для заметок по цене 150,00 руб.\nЕ. блокноты для заметок по цене 200,00 руб.\nЖ. белый картон по цене 200,00 руб.\nЗ. белый картон по цене 250,00 руб.\nИ. белый картон по цене 300,00 руб.\nК. бумага плотная по цене 80,00 руб.\nЛ. бумага плотная по цене 120,00 руб.\nМ. бумага плотная по цене 250,00 руб.","4. Выбрать сегмент с учетом нужных «9Р» (описать позиционирование и нужные обязательные «Р» для выбранного сегмента)\nа) эконом\nб) массмаркет\nв) премиум\nг) люксовый","5. Выбрать и разработать тактику ценообразования с учетом цели компании (описать цель, прописать структурно тактику (сроки, охват, ценовое предложение)\n5.1. тактики ценообразования\nа) Big roll\nб) Flexible pricing\nв) G-B-B\n5.2. цели фирмы\nа) максимизация прибыли\nб) максимизация дохода\nв) увеличение числа клиентов (доли рынка)"]},"facts":[{"label":"Как оценивают кейс","text":"«Студент рассчитал верно себестоимость, выбрал прямого конкурента, определил ценовой сегмент с учетом концепции маркетинг-микса, предложил эффективную тактику с учетом заданной цели - это абсолютно верный ответ (20 баллов)». Четыре проверки: себестоимость, прямой конкурент, сегмент через 9P, тактика под цель.","source":"Л5, сл. 83"},{"label":"Начальник цеха","text":"В затраты не включай. Однокурсник пишет, что Шарко считает это ошибкой и в прошлом году снимала за это «пол-балла вроде». Почему, он сам не знает («Я не понимаю, почему…»), сведения из вторых рук («испорченный телефон со студентами»). Спросить у Шарко 22.10. Для ответа одна строка: «Допускаю, что линия одна и ею руководит мастер, поэтому начальник цеха продукту не нужен». Бумага: 47 руб. без него, 57 руб. с ним. Запасная строка, если начальника включают: постоянные 150 000 руб., при цене 109 руб. наценка 52 руб. (91%), маржа 47,7%, ТБУ 150 000 / (109 − 42) = 2 239 пачек в месяц. Альбом и блокнот с ним убыточны при любой цене из списка.","source":"PDF однокурсника, с. 1; расчёт"},{"label":"Формула бизнеса","text":"«С = Переменные затраты (Прямые) * Объем производства + Постоянные затраты (Косвенные)». Себестоимость единицы = С / объём.","source":"Л1, сл. 38"},{"label":"Что переменное, что постоянное","text":"Переменные: «Сырье, Материалы, Сдельная оплата труда, Расходные части, Упаковка (индивидуальная)». Постоянные: «Аренда», «Повременная оплата труда» и др. Значит фасовщик и наладчик (сдельная оплата) переменные, мастер (повременная) и аренда постоянные.","source":"Л1, сл. 41–42"},{"label":"Аренда и наладчик","text":"Аренда 120 000 руб. за 12 месяцев = 10 000 руб. в месяц. Наладчик: 100 руб. за наладку раз в 100 единиц = 1 руб. на единицу, у бумаги 100 наладок = 10 000 руб. в месяц. В таблице однокурсника опечатка «110 000», итог 420 000 при этом верный.","source":"Условие, п. 2.9 и 2.10; PDF однокурсника, с. 2"},{"label":"Прямой конкурент","text":"«Цена конкурента: определяется ближайший конкурент в одном сегменте». Итоги Л2: «Важно: определить точных конкурентов, чтобы границы сегмента/ниши были достоверными!»","source":"Л3, сл. 19; Л2, сл. 46"},{"label":"Минимальная цена","text":"Точка безубыточности «Позволяет определить минимальную цену или минимальный объем продаж для покрытия затрат». При плане продаж минимальная цена равна полной себестоимости единицы.","source":"Л3, сл. 63"},{"label":"Почему конкурентный метод","text":"Конкурентное ценообразование актуально, когда «Рынок насыщен похожими товарами» и «Покупатели чувствительны к цене и легко переключаются между брендами»; эффективно, когда «Компания не может значительно отличаться от конкурентов». Это ровно случай плотной бумаги.","source":"Л3, сл. 18"},{"label":"Цена задаёт сегмент","text":"«Цена – это ключевой элемент, который напрямую определяет ценовой сегмент продукта и оказывает влияние на все последующие маркетинговые решения».","source":"Л3, сл. 69"},{"label":"Наценка и маржа","text":"«Наценка (%) = ((Розничная цена - Себестоимость) / Себестоимость) × 100». «Маржа (%) = ((Розничная цена - Себестоимость) / Розничная цена) × 100». «Маржа не может быть больше 100 %», наценка «может составлять и 200, и 500 %». Вывод слайда: «для установки цены удобно использовать наценку, для анализа прибыльности лучше применять маржу».","source":"Л3, сл. 7–10"},{"label":"Диапазонный метод","text":"Формула «определяет цену, отличную от конкурентов сегмента, но с учетом позиционирования»: «Цена = Цена мин +((Цена макс − Цена мин ) × α)». «минимальная для Вас не равна самой низкой цене, как и максимальная». «среднерыночная цена при α = 0.5». Диапазон строят между конкурентами своего сегмента. У плотной бумаги в масс-маркете один игрок, Л, поэтому в образце цена от прямого конкурента (Л3, сл. 19).","source":"Л3, сл. 22"},{"label":"Цена безразличия","text":"«Общая ценность = Цена безразличия + Положительная ценность отличий – Отрицательна ценность отличий». Цена безразличия это цена лучшей альтернативы для покупателя.","source":"Л2, сл. 18"},{"label":"Девятка на конце","text":"«Остановитесь на цифре 9», рядом пример: «Было 120, стало 99». На Л3, сл. 30 формула «Цена = N − 0,01», но пример того же слайда даёт целые рубли: «100 – 0,01 = 99 рублей». В задачах пула 2026 тоже целая цена на 9 (задачи 4–6), копейки только в задаче 2: 1 937,99. Цена Л как раз 120, наша 109.","source":"Л2, сл. 20; Л3, сл. 30; пул 2026, задачи 2, 4–6"},{"label":"Экспресс-метод","text":"Цена, максимизирующая прибыль, это среднее между «Переменными затратами на единицу продукции» и «Максимальной ценой, по которой вы сможете продать хотя бы одну единицу продукции». Это точка F: «А по какой цене я смогу продать хотя бы одну, всего лишь одну единицу?» (сл. 31). В условии её нет, поэтому в образце метода нет. Необязательная проверка: (42 + 250) / 2 = 146 руб. Допущение: вместо F взята максимальная цена конкурентов, М 250 руб. По лекции это точка E: «Максимальная стоимость, которую ставят ваши конкуренты, находящиеся в зоне видимости клиента» (сл. 32). На графике F правее E (сл. 29), поэтому 146 только нижняя оценка.","source":"Л2, сл. 29, 31–33"},{"label":"Три цели, три цены","text":"«Прибыль, Доход, Количество клиентов». В примере с омывайкой 150 руб. дали больше всего клиентов, 250 руб. больше всего выручки, 490 руб. больше всего прибыли: «ВСЕ ТРИ ЦЕНЫ СУЩЕСТВЕННО ОТЛИЧАЮТСЯ ДРУГ ОТ ДРУГА!»","source":"Л5, сл. 7, 12–15"},{"label":"Когда цена ниже конкурента оправдана","text":"«Ценовая конкуренция может стать выигрышной только при условиях: 1) если спрос на продукт высоко эластичен…» и при эффекте масштаба. «Политика снижения цен оправдана, если удастся достигнуть эффекта масштаба и снизить затраты». Предупреждения: «Снижение цен – самый худший способ играть в конкурентом поле»; фирме-новичку при ценовой войне: «не вступать в войну или стать нишевым игроком». Поэтому цену ниже Л держи умеренной (109 руб., около 9% ниже) и объясняй эластичностью масс-маркета и масштабом.","source":"Л5, сл. 27, 29, 33, 34; Л3, сл. 82"},{"label":"Неудачная цена","text":"«Неудачное завышение цен после санкций – переход с масс-маркета в категорию премиум-сегмента и кратное повышение цен без обоснованных и рациональных причин. Итог: постоянные скидки и распродажи…». Бумагу за 47 руб. в премиум за 249 руб. без реальной разницы с Л не ставь.","source":"Л3, сл. 74"},{"label":"Тактические скидки","text":"«1) За большой объем закупок… 2) За внесезонную покупку; 3) За ускорение оплаты; 4) За поощрение продаж нового продукта; 5) При комплексной закупке продуктов…; 6) За отказ от продуктов фирм-конкурентов; 7) Для «верных» и престижных покупателей».","source":"Л5, сл. 18"},{"label":"Сроки решений","text":"На слайде у каждого уровня два срока: стратегический «3-5 ЛЕТ----2-3 года» (утверждает топ-менеджмент), тактический «1-3 ГОДА----1-2 года» (руководители проектных / целевых групп), оперативный «ДО 1 ГОДА---6 месяцев» (руководители функциональных подразделений), мгновенный (ситуативный) «ДО 1 МЕСЯЦА ----до 1 недели» (сотрудники). Что значит вторая запись, на слайде не сказано: в тесте узнавай обе. Тактику в кейсе планируй от 12 месяцев, акцию короче подавай как этап внутри неё (вывод).","source":"Л5, сл. 6"},{"label":"Цифры на экзамене","text":"На Л5, сл. 86 за «Х» скрыты цены поставщиков («цена поставщика Х»), аренда («ХХХ руб. за 12 месяцев»), товары и цены игроков («продукт В по цене Х»). Объёмов в месяц и пометок «в прозрачной упаковке», «без упаковки, без наладки линии», «в упаковке» на слайде нет, часть ресурсов и игроков пропущена. На бланке могут смениться и цифры, и состав: до расчёта найди пометки про упаковку и наладку, от них зависит, входят ли упаковка и наладчик в переменные. Дальше считай тем же алгоритмом из каркаса.","source":"Л5, сл. 86; условие прошлого года"}],"products":[{"key":"а","name":"Альбом для рисования в прозрачной упаковке (А4, 12 листов), 1 000 шт/мес","variable":[{"resource":"Бумага плотная","calc":"12 листов × 1 руб. (5 000 руб. / 5 000 листов) = 12 руб.","per_unit":12},{"resource":"Скобы-держатели","calc":"2 скобы × 1 руб. (10 000 руб. / 10 000 шт) = 2 руб.","per_unit":2},{"resource":"Прозрачная упаковка","calc":"1 шт × 1 руб. (5 000 руб. / 5 000 шт) = 1 руб.","per_unit":1},{"resource":"Этикетка-наклейка","calc":"1 шт × 10 руб. (1 000 руб. / 100 шт) = 10 руб.","per_unit":10},{"resource":"Фасовщик","calc":"сдельно, 10 руб. за штуку","per_unit":10},{"resource":"Наладчик","calc":"100 руб. за наладку / 100 шт = 1 руб. (10 наладок в месяц = 1 000 руб.)","per_unit":1}],"fixed":[{"resource":"Мастер производственной линии","per_month":40000},{"resource":"Аренда цеха (120 000 / 12)","per_month":10000}],"head_included":false,"totals":{"vc_unit":36,"fc_month":50000,"q_month":1000,"cost_unit":86,"cost_unit_with_head":186,"total_month":86000,"formula":"С = 36 × 1 000 + 50 000 = 86 000 руб. в месяц; себестоимость 86 000 / 1 000 = 86 руб."},"competitors":[{"letter":"В","price":100,"segment":"эконом","gap":14,"gap_with_head":-86},{"letter":"А","price":120,"segment":"масс-маркет","gap":34,"gap_with_head":-66},{"letter":"Б","price":170,"segment":"премиум","gap":84,"gap_with_head":-16}],"verdict":"запасной","why":"Запасной № 1. Без начальника цеха 86 руб., работает в масс-маркете против А (120 руб.): при цене 109 наценка 23 руб., при 119 наценка 33 руб. В экономе против В (100 руб.) запас всего 14 руб. С начальником 186 руб., убыток при любой цене из списка. Спорный состав: если добавить обложку из 2 листов картона, себестоимость 106 руб. и масс-маркет почти без прибыли.","assumptions":["2 скобы на альбом (допущение)","обложка из картона не входит: в условии альбом это 12 листов (допущение)","с обложкой из 2 листов картона переменные 56 руб., себестоимость 106 руб."]},{"key":"б","name":"Блокноты для заметок без упаковки, без наладки линии (А4, 48 листов), 1 000 шт/мес","variable":[{"resource":"Бумага плотная","calc":"48 листов × 1 руб. (5 000 руб. / 5 000 листов) = 48 руб.","per_unit":48},{"resource":"Скобы-держатели","calc":"2 скобы × 1 руб. (10 000 руб. / 10 000 шт) = 2 руб.","per_unit":2},{"resource":"Этикетка-наклейка","calc":"1 шт × 10 руб. (1 000 руб. / 100 шт) = 10 руб.","per_unit":10},{"resource":"Фасовщик","calc":"сдельно, 10 руб. за штуку","per_unit":10}],"fixed":[{"resource":"Мастер производственной линии","per_month":40000},{"resource":"Аренда цеха (120 000 / 12)","per_month":10000}],"head_included":false,"totals":{"vc_unit":70,"fc_month":50000,"q_month":1000,"cost_unit":120,"cost_unit_with_head":220,"total_month":120000,"formula":"С = 70 × 1 000 + 50 000 = 120 000 руб. в месяц; себестоимость 120 000 / 1 000 = 120 руб."},"competitors":[{"letter":"Г","price":135,"segment":"эконом","gap":15,"gap_with_head":-85},{"letter":"Д","price":150,"segment":"масс-маркет","gap":30,"gap_with_head":-70},{"letter":"Е","price":200,"segment":"премиум","gap":80,"gap_with_head":-20}],"verdict":"запасной","why":"Запасной № 2. Без начальника 120 руб., с ним 220 руб. (убыток при любой цене из списка). Против Г (135 руб.) запас 15 руб., против Д (150 руб.) 30 руб., против Е (200 руб.) 80 руб. Для премиума есть довод: плотная бумага в блокноте это заметное качество (вывод). Спорный состав: нужны ли этикетка и фасовщик продукту без упаковки, без них себестоимость 100 руб.","assumptions":["2 скобы на блокнот (допущение)","этикетка остаётся: марка и штрихкод нужны и без упаковки (допущение)","фасовщик остаётся: собирает и укладывает блокноты (допущение)","без этикетки и фасовщика переменные 50 руб., себестоимость 100 руб."]},{"key":"в","name":"Белый картон в упаковке (А4, 12 листов), 100 шт/мес","variable":[{"resource":"Белый картон","calc":"12 листов × 10 руб. (10 000 руб. / 1 000 листов) = 120 руб.","per_unit":120},{"resource":"Прозрачная упаковка","calc":"1 шт × 1 руб. (5 000 руб. / 5 000 шт) = 1 руб.","per_unit":1},{"resource":"Этикетка-наклейка","calc":"1 шт × 10 руб. (1 000 руб. / 100 шт) = 10 руб.","per_unit":10},{"resource":"Фасовщик","calc":"сдельно, 10 руб. за штуку","per_unit":10},{"resource":"Наладчик","calc":"100 руб. за наладку / 100 шт = 1 руб. (1 наладка в месяц = 100 руб.)","per_unit":1}],"fixed":[{"resource":"Мастер производственной линии","per_month":40000},{"resource":"Аренда цеха (120 000 / 12)","per_month":10000}],"head_included":false,"totals":{"vc_unit":142,"fc_month":50000,"q_month":100,"cost_unit":642,"cost_unit_with_head":1642,"total_month":64200,"formula":"С = 142 × 100 + 50 000 = 64 200 руб. в месяц; себестоимость 64 200 / 100 = 642 руб."},"competitors":[{"letter":"Ж","price":200,"segment":"эконом","gap":-442,"gap_with_head":-1442},{"letter":"З","price":250,"segment":"масс-маркет","gap":-392,"gap_with_head":-1392},{"letter":"И","price":300,"segment":"премиум","gap":-342,"gap_with_head":-1342}],"verdict":"ловушка","why":"100 штук в месяц, поэтому постоянные 500 руб. на штуку. Себестоимость 642 руб. при ценах конкурентов 200–300 руб. Даже при 300 руб. безубыточность наступает на 317 штуках в месяц, план 100. С начальником 1 642 руб.","assumptions":["100 штук в месяц: 1 наладка в месяц, 100 руб."]},{"key":"г","name":"Бумага плотная в упаковке (А4, 20 листов), 10 000 шт/мес","variable":[{"resource":"Бумага плотная","calc":"20 листов × 1 руб. (5 000 руб. / 5 000 листов) = 20 руб.","per_unit":20},{"resource":"Прозрачная упаковка","calc":"1 шт × 1 руб. (5 000 руб. / 5 000 шт) = 1 руб.","per_unit":1},{"resource":"Этикетка-наклейка","calc":"1 шт × 10 руб. (1 000 руб. / 100 шт) = 10 руб.","per_unit":10},{"resource":"Фасовщик","calc":"сдельно, 10 руб. за штуку","per_unit":10},{"resource":"Наладчик","calc":"100 руб. за наладку / 100 шт = 1 руб. (100 наладок в месяц = 10 000 руб.)","per_unit":1}],"fixed":[{"resource":"Мастер производственной линии","per_month":40000},{"resource":"Аренда цеха (120 000 / 12)","per_month":10000}],"head_included":false,"totals":{"vc_unit":42,"fc_month":50000,"q_month":10000,"cost_unit":47,"cost_unit_with_head":57,"total_month":470000,"formula":"С = 42 × 10 000 + 50 000 = 470 000 руб. в месяц; себестоимость 470 000 / 10 000 = 47 руб."},"competitors":[{"letter":"К","price":80,"segment":"эконом","gap":33,"gap_with_head":23},{"letter":"Л","price":120,"segment":"масс-маркет","gap":73,"gap_with_head":63},{"letter":"М","price":250,"segment":"премиум","gap":203,"gap_with_head":193}],"verdict":"рекомендую","why":"Состав однозначный: бумага, упаковка, этикетка, фасовщик, наладчик. Объём 10 000 даёт постоянные всего 5 руб. на пачку. Продукт с запасом окупается в любом сегменте и даже с начальником цеха (57 руб.). Запас до цены Л 73 руб. на пачку. Минус: этот продукт брали все прошлогодние решения, поэтому текст пиши своими словами.","assumptions":["картон и скобы пачке бумаги не нужны"]}],"segments":[{"key":"эконом","must_p":["Product","Price","Place"],"alt_p":["Product","Price","People"],"positioning":"Самая низкая цена при базовом качестве, товар есть везде, рекламы почти нет. Для бумаги: «плотная бумага дешевле всех на полке, в магазине у дома и на маркетплейсах».","slide":"Л3, сл. 70, 76–79, 103","quotes":[{"text":"Товары, ориентированные на минимизацию затрат и доступность для широкого круга потребителей. Цель этого сегмента – предложить максимально низкую цену при приемлемом качестве.","slide":"Л3, сл. 70"},{"text":"Это недорогие широко распространенные и практически не имеющие рекламы товары. Уникальное предложение оправдывается ценой.","slide":"Л3, сл. 76"},{"text":"Цена должна быть самой низкой на рынке","slide":"Л3, сл. 77"},{"text":"Основная задача продавца товаров эконом-сегмента – уменьшение издержек производства","slide":"Л3, сл. 77"},{"text":"При этом продукт должен выполнять заявленные функции на базовом уровне","slide":"Л3, сл. 77"},{"text":"Продукт должен быть доступен всем и почти везде","slide":"Л3, сл. 78"},{"text":"Именно поэтому различные супермаркеты создали собственные торговые марки именно в эконом-сегменте","slide":"Л3, сл. 78"},{"text":"Доступность более широкой ЦА, “самореклама” засчет низкой цены по принципу “сарафанного радио”","slide":"Л3, сл. 79"}],"discounts":"Прямо про скидки в экономе на слайдах не сказано. Вывод: цена и так самая низкая, поэтому глубоких скидок нет; уместны скидки за объём и за внесезонную покупку (Л5, сл. 18), если цена остаётся выше себестоимости.","promotion":"«практически не имеющие рекламы» (сл. 76), удешевление «при полном или частичном отсутствии рекламы» (сл. 79). Продвигают низкая цена и сарафанное радио.","for_paper":"Прямой конкурент К (80 руб.). Цена ниже К: 79 руб. Наценка 32 руб. (68%), маржа 40,5%."},{"key":"масс-маркет","must_p":["Product","Price","Promotion"],"alt_p":["Product","Price","Place"],"positioning":"Хорошее соотношение цены и качества для широкой аудитории. Для бумаги: «плотная бумага для школы, творчества и офиса, качество как у известных марок, цена ниже».","slide":"Л3, сл. 70, 81–84, 103","quotes":[{"text":"Продукты ориентированы на массового потребителя, предоставляя хорошее соотношение «цена-качество». Этот сегмент обычно охватывает наибольшую долю рынка.","slide":"Л3, сл. 70"},{"text":"сегмент рынка товаров, который охватывает широкую аудиторию потребителей и предлагает продукцию по доступным ценам","slide":"Л3, сл. 81"},{"text":"Цена должна быть конкурентоспособной, но при этом достаточной для обеспечения рентабельности","slide":"Л3, сл. 82"},{"text":"В масс-маркете высокая эластичность спроса по цене","slide":"Л3, сл. 82"},{"text":"Продукция должна быть качественная но при этом не слишком дорогая в производстве","slide":"Л3, сл. 83"},{"text":"Для сегмента масс-маркета важно агрессивное продвижение, которое включает использование традиционных рекламных каналов, а также цифрового маркетинга","slide":"Л3, сл. 84"},{"text":"Компании стремятся формировать лояльность через регулярные акции, скидки и программы лояльности","slide":"Л3, сл. 84"}],"discounts":"Скидки и акции здесь норма: «регулярные акции, скидки и программы лояльности» (сл. 84). На сл. 71 в продвижении есть строка «Скидки и акции, выгодные предложения», вывод: она про эконом и масс-маркет.","promotion":"Активное продвижение: традиционная реклама и цифровой маркетинг (сл. 84), «стратегическое ценообразование чтобы стимулировать спрос» (сл. 84).","for_paper":"Прямой конкурент Л (120 руб.). Базовая цена 120 − 11 = 109 руб. (Л3, сл. 19). Наценка 62 руб. (132%), маржа 57%. P: на сл. 103 у масс-маркета две равные тройки, Product + Price + Place или Product + Price + Promotion. В образце Promotion: в разделе масс-маркета разобраны Price, Product и Promotion (сл. 82–84)."},{"key":"премиум","must_p":["Product","Promotion","Process"],"alt_p":["Product","Promotion","People"],"positioning":"Уникальные свойства и престиж, цена транслирует ценность. Бумаге нужна реальная разница с масс-маркетом (например, сервис для компаний). Без неё это «неудачная цена» со сл. 74.","slide":"Л3, сл. 70, 74, 86–88, 103","quotes":[{"text":"Товары, предлагающие уникальные характеристики, дополнительную ценность. Позиционируются как эксклюзивные. Целевая аудитория – потребители, готовые платить за качество и престиж.","slide":"Л3, сл. 70"},{"text":"Цена показывает платежеспособность, избирательность и качество; не «завлекает» ценой, а транслирует свои ценности через нее","slide":"Л3, сл. 86"},{"text":"Минимальные скидки: премиум уже в отличии от масс-маркета не хочет нравиться","slide":"Л3, сл. 86"},{"text":"Нет цели «продать» товар, покупатель самостоятельно принимает решение о покупке","slide":"Л3, сл. 86"},{"text":"Создание определенного пользовательского опыта в премиум-сегменте позволяет выстроить долгосрочные отношения с покупателем, а также использовать его как дополнительный метод продвижения","slide":"Л3, сл. 87"},{"text":"Цель продвижения премиум сегмента – показать «разницу» с масс-сегментом, но при этом стать «близким» потребителю","slide":"Л3, сл. 88"}],"discounts":"«Минимальные скидки» (сл. 86). Пример ForesT: лидер с премиальными ценами разрешил каждому клиенту «уторговать» свою скидку, итог на слайде: «потеря лояльности клиентов, потеря лидирующей позиции!» (Л5, сл. 23–24).","promotion":"«Фокус на имидже бренда», «Ставка на эксклюзивность и уникальность», «Эффект недоступности», «Эмоциональная связь и общие ценности», «Эксклюзивные мероприятия и показы», «Сотрудничество с известными личностями», «Коллаборации с масс-маркетом» (сл. 88).","for_paper":"Прямой конкурент М (250 руб.). Цена 239–249 руб. даёт наценку больше 400% при себестоимости 47 руб. Без реальной разницы с Л это риск сл. 74. Не советую. P: на сл. 103 у премиума две равные тройки, Product + Promotion + People или Product + Promotion + Process; Process и Promotion разобраны на сл. 87–88."},{"key":"люкс","must_p":["Process","Physical Evidence","Product"],"alt_p":["Process","Physical Evidence","People"],"positioning":"Бренд, эксклюзивность и статус, ценность выше цены. Для канцтоваров из условия не подходит: в списке нет люксового игрока.","slide":"Л3, сл. 70, 90–93, 103","quotes":[{"text":"В этом сегменте ключевым фактором является бренд, эксклюзивность и статус. Потребители готовы платить за премиальное качество, ограниченные выпуски и индивидуальный подход.","slide":"Л3, сл. 70"},{"text":"Вывод: для люксового сегмента каждый показатель должен быть на высоком уровне для соответствия ожиданиям потребителя.","slide":"Л3, сл. 92"},{"text":"Однако если выделять три ключевых элемента, адаптированных для сегмента люкс, то следует учитывать: Product, Process, Physical Environment","slide":"Л3, сл. 92"},{"text":"для люксового сегмента ценность продукта/услуги (качество, уровень сервиса, удовлетворение эстетических ценностей) выше цены","slide":"Л3, сл. 93"}],"discounts":"Про скидки в люксе на слайдах не сказано. Вывод: скидок нет.","promotion":"На сл. 71 в продвижении строка «Индивидуальный подход, эксклюзивность», вывод: она про премиум и люкс. Персонализированный сервис, VIP-обслуживание, эксклюзивные услуги и привилегии на сл. 93 стоят в колонке Process.","for_paper":"Нет игрока и нет оснований. Товары люкса на сл. 91: «высокая мода («от-кутюр»)», «ювелирные изделия», «элитные автомобили/дома», «предметы искусства». Не выбирай."}],"tactics":[{"key":"Big roll","definition":"Модель, которая предполагает, что цена на комплексный продукт зафиксирована, но конфигурацию продукта оставляет и определяет сам клиент. Например, компания Subway в период кризиса запустила кампанию «Footlong» - самый длинный хот-дог по цене 5 у.е. и только в самом популярном месте франшизы (не во всех точках). При этом каждый клиент имел опцию составить свой авторский рецепт знаменитого лакомства, выбирая сколь угодное количество и ассортимент ингредиентов и соусов.","how_for_paper":"Фиксированная цена за набор, состав выбирает клиент. Товар у нас один, конфигурировать почти нечего: число пачек, надпись на этикетке (рисование, печать, поделки) и день доставки. Пример: «Коробка для класса за 990 руб.: 10 пачек, назначение на этикетках и день доставки школа выбирает сама». Самая слабая тактика для одной бумаги.","slide":"Раздатка с описанием тактик (фото на с. 5 PDF однокурсника); в лекциях только название, Л5, сл. 86","goal_fit":"Число клиентов: в примере Subway кампания в кризис привлекала покупателей (вывод).","timing_reach_offer":"Сроки: тактика на 12 месяцев (Л5, сл. 6: тактический уровень от 1 года), внутри неё акция на 2–3 месяца (допущение: в раздатке сказано только, что Subway запустила кампанию «в период кризиса», срок не указан). Охват: только сильные точки, как «в самом популярном месте франшизы», например 2 маркетплейса и 5 крупных магазинов. Ценовое предложение: одна цена за набор, состав выбирает клиент.","risk":"Клиент может собрать самую дорогую конфигурацию: проверь, что цена набора покрывает худший вариант."},{"key":"Flexible pricing","definition":"Модель, которая предполагает, что в разный период времени цена на один и тот же продукт меняется. Например, билет на популярный концерт артиста стоит дешевле, если его купить по предоплате задолго до события, а чем ближе дата концерта, тем цена выше.","how_for_paper":"Цена зависит от срока покупки. «Событие» для бумаги: начало учебного года 1 сентября (допущение о пике спроса). Ранний заказ дешевле, ближе к сезону цена выше: июнь 95 руб., июль 99 руб., с августа 109 руб. В лекциях опора: пример Aviasales, «Стратегия гибкого ценообразования»: «Динамическое измен
