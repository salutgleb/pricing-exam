          h('span.x-prow-text', [h('span.x-prow-title', { text: title(e) }), h('span.x-prow-sub', { text: lastLine(e) })])]);
        b.addEventListener('click', function () { run([e], 'Одна ошибка'); });
        return b;
      });
      S.frame(0, 1, m.total ? String(m.total) : '', [
        h('p.ex-label', { text: 'Ошибки' }), h('h2.ex-head', { text: m.total ? 'Повтори, где ошибся' : 'Ошибок нет' }),
        m.total ? h('div.x-chips', [E.chip(m.text, 'bad', 'mistakes')]) : null,
        m.total ? h('div.x-plist', rows) : h('div.x-empty', [icon('check', 40), h('p', { text: 'Сюда попадают вопросы, последовательности и задачи, где последняя попытка неверная. Пока их нет.' })]),
        E.tip('Ошибка уходит отсюда, когда в новой сессии ответишь верно с первой попытки. Повтор в конце той же сессии её не снимает.', null, 'info')
      ], S.foot([ui.button(m.total ? 'Повторить все · ' + m.total : 'К шагам', { onClick: function () { if (m.total) run(m.list, 'Ошибки'); else S.close(); } })]));
    }
  };
})();

/* ---- exam-mock.js ---- */
/* exam-mock.js — пробник. locked: true — узел с замком и подписью note («Пишем вместе с Claude»).
 * locked: false — полный вариант {minutes: 90, test: [...], ordering: [...], problems: [...], case: {text_blocks}}:
 * таймер, режим «на бумаге» (только условия), бланк ответов и проверка после по правилам экзамена.
 * Состояние — progress.cases[mock.id] = {timer: {start, acc}, answers: {id: строка}, checked: t}. Попытки идут в общий учёт. */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;
  var tick = null;

  function st(step) { return E.caseState(step.id); }
  function minutes(step) { return step.minutes || E.page.exam.duration_min || 90; }
  function timeLeft(step) {
    var t = st(step).timer || {}, used = (t.acc || 0) + (t.start ? E.now() - t.start : 0);
    return { left: minutes(step) * 60000 - used, used: used, started: !!t.start || !!t.acc };
  }
  function clock(ms) { var s = Math.ceil(Math.abs(ms) / 1000); return (ms < 0 ? '−' : '') + Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function timerChip(step) {
    var el = h('span.x-chip.is-blue.x-mock-clock', [icon('clock', 15), h('span', { text: clock(timeLeft(step).left) })]);
    clearInterval(tick);
    tick = setInterval(function () {
      if (!document.body.contains(el)) { clearInterval(tick); return; }
      var tl = timeLeft(step);
      el.lastChild.textContent = tl.left > 0 ? clock(tl.left) : 'время вышло';
      el.classList.toggle('is-bad', tl.left <= 0);
    }, 1000);
    return el;
  }
  function maxPoints(step) { return 0.5 * (step.test || []).length + (step.ordering || []).length + 3 * (step.problems || []).length; }

  function intro(step) {
    var tl = timeLeft(step), s = st(step);
    var parts = [['Тест', (step.test || []).length], ['Последовательности', (step.ordering || []).length], ['Задачи', (step.problems || []).length]];
    S.intro({ label: 'Пробник', head: step.title,
      stats: parts.filter(function (p) { return p[1]; }).map(function (p) { return E.chip(p[0] + ' · ' + p[1], null); })
        .concat(step.case ? [E.chip('Кейс', null)] : []),
      modes: [
        { icon: 'mock', title: tl.started ? 'Продолжить: условия' : 'Начать: только условия', sub: minutes(step) + ' минут, пиши на бумаге', onClick: function () { paper(step); } },
        { icon: 'pen', title: 'Ввести ответы и проверить', sub: s.checked ? 'уже проверял: можно поправить и проверить снова' : 'после бумаги', onClick: function () { sheet(step); } }
      ],
      tips: [E.tip(step.note || 'Как на экзамене: таймер, условия без подсказок, потом бланк ответов и баллы по правилам.', 'blue', 'info'),
        tl.started ? h('button.x-linkbtn.is-danger', { type: 'button', on: { click: function () {
          E.putCase(step.id, { timer: { start: null, acc: 0 }, answers: {}, checked: null });
          intro(step);
        } } }, [icon('repeat', 18), h('span', { text: 'Начать пробник заново' })]) : null],
      start: { label: tl.started ? 'К условиям' : 'Начать', onClick: function () { paper(step); } } });
  }

  function paper(step) {
    if (!timeLeft(step).started) E.putCase(step.id, { timer: { start: E.now(), acc: 0 } });
    var n = 0, body = [h('div.x-phead', [h('p.ex-label', { text: 'Пробник · на бумаге' }), timerChip(step)]), h('h2.ex-head', { text: step.title })];
    if ((step.test || []).length) {
      body.push(h('h3.x-sub', { text: 'Часть 1 · тест' }));
      step.test.forEach(function (it) {
        n++;
        body.push(h('div.x-paper-q', [h('p.x-paper-n', { text: n + '.' }), h('div', [h('p.x-p', { text: it.q }),
          h('ul.x-paper-opts', Object.keys(it.options || {}).map(function (k) { return h('li', [h('b', { text: k + ') ' }), document.createTextNode(it.options[k])]); }))])]));
      });
    }
    if ((step.ordering || []).length) {
      body.push(h('h3.x-sub', { text: 'Часть 2 · последовательности' }));
      step.ordering.forEach(function (it) {
        n++;
        body.push(h('div.x-paper-q', [h('p.x-paper-n', { text: n + '.' }), h('div', [h('p.x-p', { text: it.q }),
          h('ul.x-paper-opts', L.LETTERS.map(function (k) { return h('li', [h('b', { text: k + ') ' }), document.createTextNode((it.items || {})[k] || '')]); })),
          it.mapping_labels ? h('ul.x-paper-opts', it.mapping_labels.map(function (m) { return h('li', { text: m }); })) : null])]));
      });
    }
    if ((step.problems || []).length) {
      body.push(h('h3.x-sub', { text: 'Часть 3 · задачи' }));
      step.problems.forEach(function (it) {
        n++;
        body.push(h('div.x-paper-q', [h('p.x-paper-n', { text: n + '.' }), h('div', E.text(it.text, 'x-p').concat([
          h('p.x-src', { text: 'Найти: ' + (it.asks || []).map(function (a) { return a.label; }).join('; ') })]))]));
      });
    }
    if (step.case && (step.case.text_blocks || []).length) {
      body.push(h('h3.x-sub', { text: 'Часть 4 · кейс' }));
      step.case.text_blocks.forEach(function (t) { body.push(h('div.x-cond-block', E.text(t, 'x-p'))); });
    }
    S.frame(0, 1, '', body, S.foot([ui.button('Ввести ответы', { onClick: function () { sheet(step); } })]));
  }

  function blanks(step) {
    var a = st(step).answers || {}, n = 0;
    (step.test || []).forEach(function (it) { if (!a[it.id]) n++; });
    (step.ordering || []).forEach(function (it) { if ((a[it.id] || '').length < 4) n++; });
    (step.problems || []).forEach(function (it) { (it.asks || []).forEach(function (_, j) { if (!String(a[it.id + '#' + j] || '').trim()) n++; }); });
    return n;
  }

  function sheet(step) {
    var answers = Object.assign({}, st(step).answers), rows = [];
    function save(id, value) { answers = Object.assign({}, answers); answers[id] = value; E.putCase(step.id, { answers: answers }); }
    var n = 0;
    (step.test || []).forEach(function (it) {
      n++;
      var keys = Object.keys(it.options || {});
      var box = h('div.x-letters');
      function paint() {
        ui.clear(box);
        keys.forEach(function (k) {
          box.appendChild(h('button.x-letter' + (answers[it.id] === k ? '.is-on' : ''), { type: 'button', text: k, on: { click: function () { save(it.id, answers[it.id] === k ? '' : k); paint(); } } }));
        });
      }
      paint();
      rows.push(h('div.x-map-row', [h('p.x-map-label', { text: n + '. ' + String(it.q).slice(0, 70) + (String(it.q).length > 70 ? '…' : '') }), box]));
    });
    (step.ordering || []).forEach(function (it) {
      n++;
      var input = h('input.x-num.x-letters-in', { type: 'text', maxlength: 4, autocomplete: 'off', placeholder: 'АБВГ', aria: { label: 'Ответ ' + n } });
      input.value = answers[it.id] || '';
      input.addEventListener('input', function () { input.value = input.value.toUpperCase().replace(/[^АБВГ]/g, '').slice(0, 4); save(it.id, input.value); });
      rows.push(h('label.x-ask', [h('span.x-ask-label', { text: n + '. ' + String(it.q).slice(0, 70) }), h('span.x-ask-row', [input])]));
    });
    (step.problems || []).forEach(function (it) {
      n++;
      (it.asks || []).forEach(function (ask, j) {
        var key = it.id + '#' + j, input = h('input.x-num', { type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'число', aria: { label: ask.label } });
        input.value = answers[key] || '';
        input.addEventListener('input', function () { save(key, input.value); });
        rows.push(h('label.x-ask', [h('span.x-ask-label', { text: n + '. ' + ask.label }), h('span.x-ask-row', [input, E.signButton(input, function () { save(key, input.value); }),
          ask.unit ? h('span.x-unit', { text: ask.unit }) : null])]));
      });
    });
    S.frame(0, 1, '', [h('div.x-phead', [h('p.ex-label', { text: 'Пробник · бланк ответов' }), timerChip(step)]), h('h2.ex-head', { text: 'Перенеси ответы с бумаги' }),
      h('div.x-asks', rows), E.tip('Последовательности пиши четырьмя буквами подряд, как на бланке. Кейс проверим вместе с Claude.', null, 'info')],
    S.foot([ui.button('К условиям', { variant: 'outline', onClick: function () { paper(step); } }), ui.button('Проверить', { onClick: function () {
      var n = st(step).checked ? 0 : blanks(step);
      if (!n) { result(step); return; }
      ui.confirm('Пустых ответов: ' + n, 'Первая проверка идёт в учёт, пустые запишутся как ошибки. Проверить сейчас?', 'Проверить', 'Вернуться').then(function (yes) { if (yes) result(step); });
    } })]));
  }

  function result(step) {
    var tl = timeLeft(step), answers = st(step).answers || {}, pts = 0, lines = [], first = !st(step).checked;
    E.putCase(step.id, { timer: { start: null, acc: tl.used }, checked: E.now() });
    (step.test || []).forEach(function (it, i) {
      var ok = answers[it.id] === it.answer;
      pts += ok ? 0.5 : 0;
      if (first) E.attempt(it.id, ok, true, { ans: answers[it.id] || '', sc: ok ? 0.5 : 0 });
      if (!ok) lines.push(h('li', [h('b', { text: 'Тест ' + (i + 1) + ': ' }), document.createTextNode('верно ' + it.answer + ', у тебя ' + (answers[it.id] || 'пусто') + '. ' + (it.why || ''))]));
    });
    (step.ordering || []).forEach(function (it, i) {
      var user = (answers[it.id] || '').padEnd(4, '_'), v = L.orderVerdict(user, it.answer);
      pts += v.score;
      if (first) E.attempt(it.id, v.score === 1, true, { ans: user, sc: v.score });
      if (v.score < 1) lines.push(h('li', [h('b', { text: 'Последовательность ' + (i + 1) + ': ' }), document.createTextNode('ключ ' + it.answer + ', у тебя ' + (answers[it.id] || 'пусто') + ' · ' + L.points(v.score) + ' б.')]));
    });
    (step.problems || []).forEach(function (it, i) {
      var res = L.checkAsks(it.asks || [], (it.asks || []).map(function (_, j) { return answers[it.id + '#' + j] || ''; }));
      pts += res.ok ? 3 : 0;
      if (first) E.attempt(it.id, res.ok, true, { ans: (it.asks || []).map(function (_, j) { return answers[it.id + '#' + j] || ''; }).join(' | '), sc: res.ok ? 3 : 0 });
      if (!res.ok) lines.push(h('li', [h('b', { text: 'Задача ' + (i + 1) + ': ' }), document.createTextNode((it.answer_text || '') + ' ' + (it.steps || []).join(' '))]));
    });
    var max = maxPoints(step);
    S.frame(1, 1, '', [h('p.ex-label', { text: 'Пробник · итог' }), h('h2.ex-head', { text: L.points(pts) + ' из ' + L.points(max) + ' баллов без кейса' }),
      h('div.end-stats.x-mock-stats', [S.stat('gold', 'Баллы', 'trophy', L.points(pts) + '/' + L.points(max)), S.stat('blue', 'Время', 'clock', Math.round(tl.used / 60000) + ' мин')]),
      lines.length ? h('div.x-sec', [E.label('Где потерял баллы', 'mistakes'), h('ul.x-ul', lines)]) : E.tip('Без потерь в тесте, последовательностях и задачах.', 'ok', 'check'),
      E.tip((first ? 'Ошибки пробника добавлены в шаг «Ошибки». ' : 'Повторная проверка: в учёт попыток не идёт. ') + 'Кейс (до 20 баллов) проверим вместе с Claude.', 'blue', 'info')],
    S.foot([ui.button('Готово', { onClick: S.close })]));
  }

  E.types.mock = {
    open: function (step, sub) {
      if (sub === 'paper') return paper(step);
      if (sub === 'sheet') return sheet(step);
      intro(step);
    }
  };
})();

/* ---- exam-home.js ---- */
/* exam-home.js — главная страницы экзамена (шапка с печатью, герой с обратным отсчётом и кольцом шагов, «Сегодня»,
 * «Что будет на экзамене» со счётчиками «знаю N из M», путь шагов, «Мой порядок», «Источники и границы») и переходы:
 * #/step/<id>[/<режим>] — шаг или сразу сессия (test: variant|all|mistakes|disputed; ordering: run|v1..|mistakes;
 * problems|formulas|mistakes: run; case: cond|analysis|rehearsal; mock: paper|sheet), #/progress — перенос прогресса.
 * Параметры адреса: ?now=2026-10-23T10:00 — «сейчас» по Москве для проверки, ?reset — стереть прогресс. */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;
  var WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var root = null, renderedDay = '';

  function examLine() {
    var t = Date.parse(E.page.exam.datetime);
    if (!isFinite(t)) return 'Экзамен';
    var d = new Date(t + 3 * 3600e3), mm = d.getUTCMinutes(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return 'Экзамен · ' + WD[d.getUTCDay()] + ' ' + pad(d.getUTCDate()) + '.' + pad(d.getUTCMonth() + 1) + ' · ' + d.getUTCHours() + ':' + pad(mm);
  }
  /* «Осталось 3 дня 3 ч»: число и единица не разрываются, остаток уходит на вторую строку целиком. */
  function countdownText() {
    var exam = E.page.exam, cd = L.countdown(E.now(), exam.datetime, exam.duration_min);
    return cd.state === 'before' ? 'Осталось ' + cd.text.replace(/ /g, ' ') : cd.text;
  }

  // ------------------------------------------------------------------ герой
  function hero() {
    var counted = L.countedSteps(E.spec), done = counted.filter(function (s) { return E.stats(s).done; }).length;
    var next = L.nextStep(E.spec, E.progress()), started = counted.some(function (s) { return E.stats(s).solved > 0; });
    var m = E.mistakeSummary();
    var action = next ? { label: started ? 'Продолжить' : 'Начать', go: function () { E.openStep(next.id); } }
      : m.total ? { label: 'Повторить ошибки', go: function () { E.openStep('mistakes', 'run'); } } : null;
    var exam = E.page.exam;
    return h('section.hero.u-c0.m-hero.x-hero', [
      h('div.m-hero-top', [
        h('div', [h('p.hero-line', { text: examLine() }), h('h1.hero-title.x-countdown', { text: countdownText() }),
          h('p.hero-sub', { text: next ? 'Дальше: ' + next.title : m.total ? 'Шаги готовы. Остались ошибки: ' + m.total : 'Все шаги готовы. Повтори спорные и формулы' })]),
        h('div.m-hero-ring', [ui.ring(done, counted.length, 78, 8), h('div', [h('b', { text: done + '/' + counted.length }), h('small', { text: 'готово' })])])
      ]),
      h('div.m-hchips', [h('span.m-hchip', [icon('clock', 16), h('span', { text: (exam.duration_min || 90) + ' минут' })]),
        h('span.m-hchip', [icon('flag', 16), h('span', { text: E.count(counted.length, 'шаг', 'шага', 'шагов') })])]),
      ui.button(action ? action.label : 'Всё готово', { variant: 'white', wide: true, disabled: !action, onClick: function () { if (action) action.go(); } })
    ]);
  }

  // ------------------------------------------------------------------ части экзамена
  function partRow(part, stats) {
    var sum = part.count * part.points_each, line, bar = null, full = false, target = null;
    if (part.key === 'case') {
      var c = stats.case;
      line = c ? 'пункты ' + c.written + ' из ' + c.points + ' · чек-лист ' + c.ticked + ' из ' + c.criteria : 'кейс ещё не добавлен';
      full = !!c && c.points > 0 && c.written === c.points && c.ticked === c.criteria;
      if (c) bar = ui.bar(c.written + c.ticked, Math.max(1, c.points + c.criteria), 'thin');
      target = E.stepsOf('case')[0];
    } else {
      var s = stats[part.key] || { known: 0, total: 0, solved: 0 };
      line = s.total ? 'знаю ' + s.known + ' из ' + s.total + (s.solved > s.known ? ' · решено ' + s.solved : '') : 'задания ещё не добавлены';
      full = s.total > 0 && s.known === s.total;
      if (s.total) bar = ui.bar(s.known, s.total, 'thin');
      var type = part.key === 'single' ? 'test' : part.key;
      var steps = E.stepsOf(type);
      target = steps.filter(function (x) { return !E.stats(x).done; })[0] || steps[0];
    }
    return h('button.m-drow.x-part', { type: 'button', disabled: !target, on: { click: function () { if (target) E.openStep(target.id); } } }, [
      E.dot(full),
      h('span.x-part-text', [h('span.m-drow-text', { text: part.title }),
        h('span.m-drow-sub', { text: part.count + ' × ' + L.points(part.points_each) + ' = ' + L.points(sum) + ' ' + L.plural(sum, 'балл', 'балла', 'баллов') + ' · ' + part.rule }),
        h('span.x-part-prog', [h('small', { text: line }), bar])]),
      h('span.m-tag.x-points', { text: L.points(sum) + ' б.' })
    ]);
  }
  function partsCard() {
    var parts = E.page.exam.parts || [], stats = L.partStats(E.spec, E.progress());
    var total = parts.reduce(function (a, p) { return a + p.count * p.points_each; }, 0);
    var exam = E.page.exam;
    var meta = [(exam.duration_min || 90) + ' минут', exam.place, exam.variants ? E.count(exam.variants, 'вариант', 'варианта', 'вариантов') : ''].filter(Boolean).join(' · ');
    return h('section.card.m-deliver.x-parts', [h('div.card-head', [h('h2.card-title', { text: 'Что будет на экзамене' }), h('span.m-tag', { text: L.points(total) + ' ' + L.plural(total, 'балл', 'балла', 'баллов') })])]
      .concat(parts.map(function (p) { return partRow(p, stats); }),
        [h('p.m-rule', [icon('info', 20), h('span', { text: meta + '. «Знаю»: два верных ответа подряд с первой попытки.' })])]));
  }

  // ------------------------------------------------------------------ путь шагов
  function stepMeta(step, st) {
    if (step.type === 'mistakes') { var m = E.mistakeSummary(); return m.total ? m.text : 'пока нет: появятся из твоих ответов'; }
    if (step.type === 'mock') return step.locked ? (step.note || 'Пишем вместе с Claude') : step.sub || '';
    if (step.type === 'case') {
      var c = st.caseCounts;
      return c.written || c.ticked ? 'пункты ' + c.written + ' из ' + c.points + ' · чек-лист ' + c.ticked + ' из ' + c.criteria : step.sub || '';
    }
    if (!st.solved && !st.mistakes) return step.sub || '';
    var word = step.type === 'formulas' ? 'помню ' : 'решено ';
    return word + st.solved + ' из ' + st.total + (st.known ? ' · знаю ' + st.known : '') + (st.mistakes ? ' · ошибок ' + st.mistakes : '');
  }
  function stepRow(step, next) {
    var st = E.stats(step), counted = L.counts(step), locked = step.type === 'mock' && step.locked;
    var mistakes = step.type === 'mistakes' ? E.mistakeSummary().total : 0;
    var now = !!next && next.id === step.id;
    var state = locked ? 'is-locked' : st.done ? 'is-done' : now ? 'is-now' : !counted && !mistakes ? 'is-opt' : 'is-todo';
    var prog = counted && st.total > 1 && st.solved > 0 && !st.done
      ? h('span.m-step-prog', [ui.bar(st.solved, st.total, 'thin'), h('small', { text: st.solved + '/' + st.total })]) : null;
    var nodeIcon = locked ? 'lock' : st.done ? 'check' : step.icon || 'star';
    return h('button.m-step.x-step.' + state, { type: 'button', on: { click: function () { E.openStep(step.id); } } }, [
      h('span.m-node.' + state, [icon(nodeIcon, 30)]),
      h('span.x-step-text', [h('span.m-step-title', { text: step.title }), h('span.m-step-meta', { text: stepMeta(step, st) }), prog,
        now ? h('span.m-go.x-go-inline', { text: st.solved ? 'Дальше' : 'Начать' }) : null]),
      mistakes ? h('span.x-count-pill', { text: String(mistakes) }) : h('span.m-chev', [icon('chevron', 22)])
    ]);
  }
  function stepsBlock() {
    var path = E.spec.steps.filter(function (s) { return s.type !== 'plan'; }), counted = L.countedSteps(E.spec);
    var next = L.nextStep(E.spec, E.progress()), plan = E.planStep();
    var note = E.page.order_note;
    return h('section.x-steps', [
      h('div.m-h', [h('h2.m-h-title', { text: 'Шаги' }), h('span.m-h-meta', { text: counted.filter(function (s) { return E.stats(s).done; }).length + ' из ' + counted.length })]),
      h('div.m-steps', path.map(function (s) { return stepRow(s, next); })),
      note || plan ? h('div.m-order.x-order', [icon('info', 20), h('div', [note ? h('p', { text: note }) : null,
        plan ? h('button.x-linkbtn', { type: 'button', on: { click: function () { E.openStep(plan.id); } } }, [icon('plan', 18), h('span', { text: 'План по дням' })]) : null])]) : null
    ]);
  }

  // ------------------------------------------------------------------ источники и границы
  function sourcesBlock() {
    var kids = (E.page.sources || []).map(function (s) { return h('p', [h('b', { text: s.title }), s.note ? document.createTextNode(' · ' + s.note) : null]); });
    (E.page.limits || []).forEach(function (t) { kids.push(h('p', { text: t })); });
    kids.push(h('p.x-src', { text: 'Прогресс хранится в этом браузере' + (E.persistent() ? '' : ' (сейчас не сохраняется: перенеси его через кнопку ⇄ вверху)') +
      '. Попытка: первый ответ в сессии; повтор в конце сессии тренирует, но не меняет счёт. «Знаю»: две верные первые попытки подряд.' }));
    return h('section.x-sources', [E.fold('Источники и границы', kids)]);
  }

  function renderHome() {
    var shell = h('div.m-shell.x-shell', [E.topbar(renderHome),
      h('main.m-layout.x-layout', [hero(), E.todayCard(renderHome), partsCard(), stepsBlock(), sourcesBlock()])]);
    if (root) root.replaceWith(shell); else document.body.appendChild(shell);
    root = shell;
    renderedDay = L.mskDay(E.now());
  }
  E.renderHome = renderHome;

  // ------------------------------------------------------------------ переходы
  E.openStep = function (id, sub) {
    var step = E.step(id);
    if (!step) return;
    if (step.type === 'mock' && step.locked) { ui.toast((step.title || 'Пробник') + ': ' + (step.note || 'пишем вместе с Claude')); return; }
    var t = E.types[step.type];
    if (!t) return;
    if (!S.isOpen()) S.open(renderHome);
    S.setHash('#/step/' + id + (sub ? '/' + sub : ''));
    try {
      t.open(step, sub);
      if (S.isEmpty()) S.close();   // режим без заданий: тост уже показан, пустой слой без крестика не оставляем
    } catch (err) {
      S.close();
      ui.toast('Шаг «' + (step.title || id) + '» не открылся: ошибка в данных шага', { ms: 6000 });
      if (window.console) console.error('exam: шаг ' + id, err);
    }
  };
  function route(hash) {
    if (hash === '#/progress') { E.progressSheet(renderHome); return; }
    var m = /^#\/step\/([\w-]+)(?:\/([\w-]+))?/.exec(hash || '');
    if (m) E.openStep(m[1], m[2]);
  }

  function boot() {
    if (/[?&]reset\b/.test(location.search)) {
      E.setProgress(L.emptyProgress());
      location.replace(location.pathname);
      return;
    }
    renderHome();
    route(location.hash);
    if (E.corrupt()) ui.toast('Сохранённый прогресс не прочитался и начат заново; копия лежит в ключе «' + E.page.id + ':v1:corrupt»', { ms: 9000 });
    else if (!E.persistent()) ui.toast('Прогресс в этом окне не сохраняется: перенеси его кнопкой ⇄ вверху', { ms: 6000 });
    setInterval(function () {
      var el = document.querySelector('.x-countdown');
      if (el) el.textContent = countdownText();
      if (!S.isOpen() && L.mskDay(E.now()) !== renderedDay) renderHome();
    }, 30000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
