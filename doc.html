.m-play.is-playing { animation: m-beat .9s ease-in-out infinite alternate; }
@keyframes m-beat { from { filter: brightness(1); } to { filter: brightness(1.18); } }
.m-ts { margin: 0 0 22px; color: var(--muted); font: 700 14px/1.3 var(--font); text-align: center; }
.m-ts b { color: var(--head); }
.m-answer {
  display: block; width: 100%; min-height: 140px; padding: 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--polar); color: var(--head);
  font: 600 19px/1.45 var(--font), var(--cjk); resize: vertical;
}
.m-answer:focus { outline: none; border-color: var(--sel-line); background: var(--card); }
.m-answer::placeholder { color: var(--hare); }
.m-tip { display: flex; gap: 10px; margin-top: 16px; padding: 12px 14px; border: 2px solid var(--t-peach-line); border-radius: 14px; background: var(--t-peach-bg); color: var(--text); font: 600 14px/1.45 var(--font); }
.m-tip .ic { flex: none; width: 20px; height: 20px; color: var(--t-peach); }
.m-tip.is-yellow { border-color: var(--t-yellow-line); background: var(--t-yellow-bg); }
.m-tip.is-yellow .ic { color: #c98a0e; }
.m-tip rt { font-size: 9px; }
.m-ru-bubble { display: flex; align-items: flex-start; gap: 14px; margin: 0 0 22px; }
.m-ru-bubble .logo-seal { flex: none; width: 52px; height: 52px; font-size: 30px; border-radius: 16px; }
.m-ru-bubble .bubble { color: var(--head); font: 700 20px/1.4 var(--font); }
.m-hints { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.m-hint {
  display: inline-grid; justify-items: center; padding: 6px 10px 5px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px;
  background: var(--card); color: var(--head);
}
.m-hint:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.m-hint b { font: 400 19px/1.2 var(--cjk); }
.m-hint small { color: var(--muted); font: 700 11px/1.1 var(--font); }
.m-linkbtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; border: 0; background: none; color: var(--macaw); font: 800 14px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.m-linkbtn .ic { width: 18px; height: 18px; }

.ls-foot.is-key .ls-sheet { background: var(--polar); }
.ls-foot.is-key .v-title { color: var(--head); }
.ls-foot.is-key .v-icon { color: var(--owl); }
.m-key { display: grid; gap: 4px; max-height: 44vh; overflow-y: auto; }
.m-key-label { margin-top: 8px; color: var(--muted); font: 800 12px/1 var(--font); letter-spacing: .7px; text-transform: uppercase; }
.m-key-zh { color: var(--head); font: 400 22px/1.75 var(--cjk); }
.m-key-zh rt { font-size: 10px; }
.m-key-ru { color: var(--text); font: 600 16px/1.4 var(--font); }
.m-key-mine { color: var(--text); font: 600 16px/1.45 var(--font), var(--cjk); }
.m-key-note { margin-top: 6px; color: var(--muted); font: italic 600 13px/1.4 var(--font); }
.m-key-note rt { font-size: 8px; }
.m-transcript { display: grid; gap: 6px; margin-top: 6px; }
.m-tline { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: baseline; gap: 8px; }
.m-who { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--owl); color: #fff; font: 400 15px/1 var(--cjk); }
.m-who.is-m { background: var(--macaw); }
.m-tline .m-key-zh { font-size: 18px; }
.m-diff .ok { color: var(--ok-ink); }
.m-diff .miss { border-radius: 4px; background: rgba(255, 150, 0, .25); }
.m-score { color: var(--muted); font: 800 13px/1 var(--font); letter-spacing: .5px; text-transform: uppercase; }

.m-read-zh { margin: 10px 0 6px; color: var(--head); font: 400 30px/1.95 var(--cjk); text-align: center; }
.m-read-zh rt { font-size: 12px; }
.m-parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0 6px; }
.m-part {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px;
  background: var(--card); color: var(--head); font: 400 19px/1.2 var(--cjk);
}
.m-part .ic { width: 18px; height: 18px; color: var(--macaw); }
.m-part:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.m-part.is-playing { border-color: var(--sel-line); background: var(--sel-bg); }
.m-meaning { margin: 16px auto 0; max-width: 460px; color: var(--text); font: 600 17px/1.45 var(--font); text-align: center; }
.m-center { display: flex; justify-content: center; }

.m-chat { display: grid; gap: 14px; }
.m-msg { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: end; gap: 10px; }
.m-msg.is-right { grid-template-columns: minmax(0, 1fr) 44px; }
.m-msg.is-right .m-ava { order: 2; }
.m-ava { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--owl); color: #fff; box-shadow: 0 3px 0 var(--owl-lip); font: 400 19px/1 var(--cjk); }
.m-msg.is-right .m-ava { background: var(--macaw); box-shadow: 0 3px 0 var(--macaw-lip); }
.m-bubble {
  position: relative; display: block; width: 100%; padding: 10px 40px 12px 14px; border: 2px solid var(--line); border-radius: 18px; background: var(--card);
  color: inherit; text-align: left;
}
.m-msg.is-left .m-bubble { border-bottom-left-radius: 6px; }
.m-msg.is-right .m-bubble { border-bottom-right-radius: 6px; }
.m-bubble-who { color: var(--muted); font: 800 12px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.m-bubble-zh { margin-top: 2px; color: var(--head); font: 400 21px/1.8 var(--cjk); }
.m-bubble-zh rt { font-size: 10px; }
.m-bubble-ru { display: none; margin-top: 6px; color: var(--text); font: 600 15px/1.4 var(--font); }
.m-bubble.is-open .m-bubble-ru { display: block; }
.m-bubble.is-playing { border-color: var(--sel-line); box-shadow: 0 0 0 3px var(--sel-bg); }
.m-bubble .m-say { position: absolute; top: 10px; right: 10px; color: var(--macaw); }
.m-seg { display: inline-flex; margin: 0 0 18px; padding: 4px; border: 2px solid var(--line); border-radius: 14px; background: var(--polar); }
.m-seg button { padding: 9px 14px; border: 0; border-radius: 10px; background: none; color: var(--muted); font: 800 14px/1 var(--font); letter-spacing: .5px; text-transform: uppercase; }
.m-seg button.is-on { background: var(--card); color: var(--owl); box-shadow: 0 2px 0 var(--line); }
.m-restore { display: grid; gap: 8px; margin-top: 8px; }
.m-restore .m-answer { min-height: 60px; font-size: 18px; }
.m-restore details summary { color: var(--macaw); font: 800 13px/1 var(--font); letter-spacing: .5px; text-transform: uppercase; cursor: pointer; }

.m-checks { display: grid; gap: 10px; margin-top: 18px; }
.m-check {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 2px solid var(--line);
  border-bottom-width: 4px; border-radius: 16px; background: var(--card); color: var(--head); font: 700 16px/1.35 var(--font); text-align: left;
}
.m-check.is-on { border-color: var(--jade); background: var(--ok-bg); color: var(--ok-ink); }
.m-check.is-on .m-dot { border-color: var(--jade); background: var(--jade); color: #fff; }
.m-plan { display: grid; gap: 10px; margin: 0 0 18px; padding: 0; counter-reset: m; }
.m-plan li { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 12px; color: var(--head); font: 700 16px/1.4 var(--font); list-style: none; counter-increment: m; }
.m-plan li::before { content: counter(m); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--m-tint); color: var(--owl); font: 900 15px/1 var(--font); }
.m-plan rt { font-size: 9px; }
.m-links { display: grid; gap: 10px; margin: 16px 0 0; }

.m-wgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .m-wgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.m-wtile {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 2px 8px; padding: 12px 12px 10px; border: 2px solid var(--line);
  border-bottom-width: 4px; border-radius: 16px; background: var(--card); color: inherit; text-align: left;
}
.m-wtile:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.m-wtile-zh { color: var(--head); font: 400 26px/1.2 var(--cjk); }
.m-wtile-py { color: var(--muted); font: 700 13px/1.25 var(--font); }
.m-wtile-ru { grid-column: 1 / -1; margin-top: 4px; color: var(--text); font: 600 14px/1.35 var(--font); }
.m-wtile .m-say { grid-row: 1; grid-column: 2; color: var(--macaw); }
.m-wtile .m-say .ic { width: 20px; height: 20px; }

.m-out {
  padding: 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--polar); color: var(--head); font: 600 15px/1.6 var(--font), var(--cjk);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.m-out .miss { padding: 1px 6px; border-radius: 6px; background: var(--bad-bg); color: var(--bad-ink); font-weight: 800; }
.m-out-actions { display: flex; gap: 12px; margin-top: 14px; }
.m-out-actions .btn { flex: 1; }

/* ------------------------------------------------------------------ конспект */

.m-tabs, .m-lchips { display: flex; gap: 8px; margin: 0 -16px; padding: 4px 16px 10px; overflow-x: auto; scrollbar-width: none; }
.m-tabs::-webkit-scrollbar, .m-lchips::-webkit-scrollbar { display: none; }
.m-tab {
  flex: none; display: inline-flex; align-items: center; gap: 8px; height: 42px; margin-bottom: 3px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--muted); box-shadow: 0 3px 0 var(--line); font: 800 14px/1 var(--font); letter-spacing: .6px; text-transform: uppercase;
}
.m-tab .ic { width: 20px; height: 20px; }
.m-tab.is-on { border-color: var(--m-tint-lip); background: var(--m-tint); color: var(--owl); box-shadow: 0 3px 0 var(--m-tint-lip); }
.m-tab .n { padding: 3px 7px; border-radius: 999px; background: var(--cardinal); color: #fff; font-size: 11px; letter-spacing: 0; }
.m-lchip {
  flex: none; height: 36px; margin-bottom: 3px; padding: 0 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--card); color: var(--text);
  font: 800 14px/1 var(--font); white-space: nowrap;
}

/* ---- exam.css ---- */
/* exam.css — страница подготовки к экзамену поверх стилей hanyu (app.css, views.css, lesson.css, dz.css).
 * Свой цвет марки: спокойный тёмно-синий вместо бордо hanyu. Контраст (WCAG): белый на #1f4e7f 8,6:1, на тёмной теме
 * белый на #3a6ea5 5,3:1; ссылки #2565ad на белом 5,9:1, #7fb2ea на тёмном 7,6:1; кнопки «верно» — белый на нефрите ≥ 4,9:1.
 * Новые блоки — с префиксом x-. Одна колонка по центру на любой ширине. */

:root {
  --owl: #1f4e7f; --owl-lip: #14365a; --mask: #2c6aa8; --seal: #1f4e7f; --seal-lip: #14365a;
  --macaw: #2565ad; --macaw-lip: #1b4c84; --sel-bg: #e9f2fc; --sel-line: #a9c9ee;
  --jade: #287a56; --jade-lip: #1d5c40;
  --t-blue-bg: #eef5fd; --t-blue-line: #bcd5f2; --t-blue: #2a6fb8;
  --m-tint: #e6eef8; --m-tint-lip: #c5d6eb;
  --half-bg: #fff6dc; --half-ink: #865c00;
  --x-muted: #666; --x-mint: #2f7a4e;   /* мелкий текст новых блоков кейса на --polar и белом: --muted hanyu (#777) там 4,2–4,5:1, здесь 5:1 и выше */
}
@media (prefers-color-scheme: dark) {
  :root {
    --owl: #3a6ea5; --owl-lip: #28507b; --mask: #5687bd; --seal: #3a6ea5; --seal-lip: #28507b;
    --macaw: #7fb2ea; --macaw-lip: #4f7fb6; --sel-bg: #18273a; --sel-line: #2f5682;
    --jade: #2b7d59; --jade-lip: #1f5c41;
    --t-blue-bg: #16243a; --t-blue-line: #2d4a72; --t-blue: #8bb8ec;
    --m-tint: #1d2c3b; --m-tint-lip: #2b4058;
    --half-bg: #2e2612; --half-ink: #f0c35a;
    --x-muted: var(--muted); --x-mint: var(--t-mint);
  }
  .m-node.is-todo { color: #9cc4f0; }
}

/* ------------------------------------------------------------------ вопрос и варианты */

/* лист ответа */

/* ------------------------------------------------------------------ задачи */

/* ------------------------------------------------------------------ формулы */
.x-formula { margin: 6px 0 4px; padding: 14px 16px; border-radius: 14px; background: var(--m-tint); color: var(--owl); font: 900 22px/1.35 var(--font); letter-spacing: .2px; white-space: pre-line; overflow-wrap: anywhere; }

.x-tpl-title { margin: 4px 0 2px; color: var(--head); font: 800 17px/1.3 var(--font); }

.x-gap { display: grid; align-content: start; gap: 2px; padding: 8px 9px; border-radius: 10px; background: var(--card); }

я это движение по кривой.","slide":"Л2, сл. 4","crowd":"Б","crowd_wrong":false,"disputed":true,"dispute_note":"На экзамене жми Б, потому что это стандартный ответ экономики. Слайда про сдвиги кривой спроса нет, на Л2, сл. 4 только определение спроса. Риск низкий: за Б все три решателя, однокурсник и пометка на фото бланка.","also_in":[]},{"id":"v1-s12","variant":1,"n":12,"q":"Какой из следующих типов скидок используется для стимулирования больших объемов закупок?","options":{"А":"ступенчатые скидки","Б":"скидки за внесезонную закупку","В":"скидки за ускорение оплаты","Г":"скидки для \"верных\" покупателей"},"answer":"А","why":"Среди скидок за большой объем закупок на слайде названы некумулятивные, кумулятивные и ступенчатые.","trap":"Скидки за внесезонную закупку, за ускорение оплаты и для «верных» покупателей тоже есть в списке, они стимулируют другое.","slide":"Л5, сл. 18","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v1-s13","variant":1,"n":13,"q":"Компания «Яндекс. Такси» до 2017 года не взымала плату и комиссию с водителей автопарка, тем самым обеспечила минимальные цены на свои заказы на протяжении 7 лет с момента выхода на рынок. Компания придерживалась стратегии …","options":{"А":"Penetration pricing","Б":"Cost-plus pricing","В":"Competitor-based pricing","Г":"Value-based pricing"},"answer":"А","why":"Кейс Яндекс.Такси на слайде назван стратегией проникновения на рынок: низкие цены ради быстрого захвата доли.","trap":"Г Value-based тянет, потому что сервис удобный. Низкие цены на старте в лекции это проникновение.","slide":"Л5, сл. 48 (картинка), Л5, сл. 45 (картинка)","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v1-s14","variant":1,"n":14,"q":"Сервис «Самокат» известен самым быстрым временем доставки товаров к клиенту – не более 15 минут! Это конкурентное преимущество позволяет устанавливать высокую наценку на многие категории товаров, при этом компания умышленно завышает начальную стоимость и делает скидку. Такое ценообразование называется","options":{"А":"High-Low pricing","Б":"Psychological pricing","В":"Cost-plus pricing","Г":"Bundle pricing"},"answer":"А","why":"High-Low pricing на слайде: ценообразование высокой и низкой цены для максимальной прибыли. Самокат держит высокую наценку, завышает стартовую цену и дает скидку.","trap":"Б Psychological pricing: в формуле эффекта якоря цену тоже сначала завышают и дают скидку.","slide":"Л5, сл. 35 (картинка), Л3, сл. 32","crowd":"А","crowd_wrong":false,"disputed":true,"dispute_note":"На экзамене жми А, потому что схема «высокая наценка, потом скидка» совпадает с High-Low со слайда 35. Самоката на слайдах нет. Риск в Б: формула эффекта якоря (Л3, сл. 32) тоже про завышение и скидку. За А однокурсник, пометка на фото бланка и все три решателя.","also_in":[]},{"id":"v1-s15","variant":1,"n":15,"q":"Какой из следующих методов ценообразования основан на восприятии потребителями ценности товара?","options":{"А":"затратное ценообразование","Б":"ценообразование на основе ценности","В":"конкурентное ценообразование","Г":"ценообразование на основе спроса"},"answer":"Б","why":"Модель Value-Based Pricing базируется на восприятии ценности продукта покупателем.","trap":"Г «на основе спроса» тоже звучит про покупателя, хотя такой модели в лекции нет.","slide":"Л3, сл. 15","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v1-s16","variant":1,"n":16,"q":"Какой из следующих факторов влияет на выбор ценовой стратегии?","options":{"А":"стадия жизненного цикла товара","Б":"уровень конкуренции","В":"эластичность спроса","Г":"все вышеперечисленное"},"answer":"Г","why":"В лекции на выбор ценовой стратегии влияют эластичность спроса, реакция конкурентов и стадия рынка (новый или стагнирующий). Значит, верно «все вышеперечисленное».","trap":"Каждый фактор по отдельности выглядит верным, поэтому тянет выбрать первый.","slide":"Л5, сл. 27, Л5, сл. 33, Л1, сл. 64","crowd":"Г","c  цель преследует государство, применяя предельные значения возможного роста или падения рыночных цен?","options":{"А":"привлечение на рынок иностранных конкурентов","Б":"контроль цен отечественных производителей","В":"контроль цен иностранных производителей","Г":"защита отечественных производителей от иностранных конкурентов"},"answer":"Г","why":"Слайд: в целях защиты отечественных производителей от иностранных конкурентов государство может установить предельные значения роста или падения цен.","trap":"В про контроль цен иностранных производителей звучит логично. На фото бланка обведены и В, и Г.","slide":"Л1, сл. 79","crowd":"Г","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v3-s9"]}]},{"id":"v2","type":"test","title":"Вариант 2 · тест","variant":2,"icon":"test","sub":"20 вопросов · 0,5 балла за верный","done_rule":"шаг готов, когда последняя попытка по каждому вопросу верная","items":[{"id":"v2-s1","variant":2,"n":1,"q":"Исторически «рыночная цена» появилась, когда ….","options":{"А":"появились альтернативные деньги (криптовалюта)","Б":"был введен соляной налог","В":"появились серебряные и золотые монеты","Г":"появились электронные денежные переводы"},"answer":"Б","why":"На слайде «Когда появилось понятие «цена»?» слова «РЫНОЧНАЯ ЦЕНА» выделены капслоком только в пункте про соляной налог 1646 года.","trap":"В: монеты логично связать с денежным обменом и рыночной ценой. Так ответил однокурсник.","slide":"Л1, сл. 19","crowd":"В","crowd_wrong":true,"disputed":true,"dispute_note":"На экзамене жми Б, потому что вопрос цитирует «рыночную цену» так же, как вопросы про «интервал здравого смысла» и «нормальную цену», а на слайде эти слова выделены только в пункте про соляной налог. Риск в В: по логике рыночная цена появилась с деньгами, так ответили однокурсник и решатель Codex. Два решателя Claude за Б.","also_in":[]},{"id":"v2-s2","variant":2,"n":2,"q":"Что не лежит в основе закона спроса?","options":{"А":"эффект роста полезности","Б":"эффект дохода","В":"эффект замещения","Г":"ценовой барьер"},"answer":"А","why":"В основе закона спроса закон убывающей предельной полезности, эффект дохода, эффект замещения и ценовой барьер. Эффекта роста полезности там нет.","trap":"Г «ценовой барьер» звучит необычно, хотя он четвертый пункт слайда.","slide":"Л2, сл. 5","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v2-s3","variant":2,"n":3,"q":"… – это некоторое субъективное восприятие полезности и/или важности продукта, возникающее у конкретного покупателя в процессе выбора товара","options":{"А":"Ценность","Б":"Воспринимаемая ценность","В":"Воспринимаемая ценность для продавца","Г":"Восприятие"},"answer":"А","why":"Дословное определение ценности: субъективное восприятие полезности и/или важности продукта у конкретного покупателя в процессе выбора.","trap":"Слово «восприятие» внутри определения тянет к вариантам Б и Г.","slide":"Л2, сл. 13","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v2-s4","variant":2,"n":4,"q":"Выберите психологический фактор восприятия цены потребителем","options":{"А":"табу на беспричинное сравнение цен","Б":"обозначение цены имеет значение","В":"остановитесь на цифре 9","Г":"все варианты верны"},"answer":"Г","why":"Все три фактора есть в списке: «Остановитесь на цифре 9», «Табу на беспричинное сравнение цен», «Обозначение цены имеет значение».","trap":"Легко узнать один пункт и не дойти до «все варианты верны».","slide":"Л2, сл. 20, Л2, сл. 21","crowd":"Г","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v2-s5","variant":2,"n":5,"q":"Ценообразование относится к какому виду учета на фирме?","options":{"А":"бухгалтерскому","Б":"налоговому","В":"управленческому","Г":"финансовому"},"answer":"В","why":"У фирмы три вида учета, управленческий про эффективность (Л1 сл. 40). Direct Costing в широком смысле назван на сл. 58 способом организации управленческого учета, а Standard Costing (сл. 56) дает менед рсник и все три решателя.","also_in":[]},{"id":"v2-s14","variant":2,"n":14,"q":"Экосистемы характеризуются наличием множества разных сервисов внутри системы: банк, подписки, услуги, развлечения, доступ к партнерским сервисам, прочее. Комбинации выбора разных сервисов представлены в разных тарифах на подписку. Такая стратегия ценообразования относится к","options":{"А":"Penetration pricing","Б":"Bundle pricing","В":"Competitor-based pricing","Г":"Value-based pricing"},"answer":"Б","why":"Подписка Яндекс Плюс с набором сервисов разобрана на слайде как стратегия Bundle Pricing.","trap":"Г Value-based тянет, потому что тарифы различаются по набору выгод.","slide":"Л5, сл. 56 (картинка), Л5, сл. 35 (картинка)","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v2-s15","variant":2,"n":15,"q":"Какой из следующих факторов может привести к снижению цен?","options":{"А":"увеличение спроса","Б":"увеличение предложения","В":"увеличение затрат","Г":"увеличение налогов"},"answer":"Б","why":"В формуле динамической цены цена растет, когда спрос больше предложения. Рост предложения цену снижает.","trap":"А: легко перепутать стороны рынка. По формуле рост спроса цену поднимает.","slide":"Л3, сл. 24","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v2-s16","variant":2,"n":16,"q":"Что такое ценовая дискриминация?","options":{"А":"установление разных цен для разных сегментов рынка","Б":"предоставление скидок постоянным клиентам","В":"установление высоких цен на новый товар","Г":"использование конкурентных цен"},"answer":"А","why":"Ценовая дискриминация на слайде: разные льготы и цены для разных групп покупателей (кинотеатр СинемаСтар).","trap":"Б: скидки постоянным клиентам похожи на один из ее видов, определение шире.","slide":"Л5, сл. 53 (картинка)","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v2-s17","variant":2,"n":17,"q":"Какая система оценки затрат у фирмы существ е значения роста или падения цен.","trap":"В про контроль цен иностранных производителей звучит логично. На фото бланка обведены и В, и Г.","slide":"Л1, сл. 79","crowd":"Г","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v1-s20"]},{"id":"v3-s10","variant":3,"n":10,"q":"Какой из следующих факторов не влияет на спрос?","options":{"А":"уровень доходов потребителей","Б":"цены на сопутствующие товары","В":"производственные затраты","Г":"потребительские предпочтения"},"answer":"В","why":"Спрос задают желание и готовность покупателя. Затраты на производство в лекции связаны с законом предложения.","trap":"Б: цены на сопутствующие товары кажутся чужими для спроса, хотя влияют на него.","slide":"Л2, сл. 4, Л2, сл. 7","crowd":"В","crowd_wrong":false,"disputed":true,"dispute_note":"На экзамене жми В, потому что затраты производителя относятся к предложению. Списка факторов спроса на слайдах нет. Риск низкий: за В все три решателя и однокурсник.","also_in":[]},{"id":"v3-s11","variant":3,"n":11,"q":"Что такое \"цена на уровне безубыточности\"?","options":{"А":"цена, при которой компания получает максимальную прибыль","Б":"цена, при которой доходы равны затратам","В":"цена, при которой спрос превышает предложение","Г":"цена, при которой предложение превышает спрос"},"answer":"Б","why":"В точке безубыточности выручка покрывает все затраты, у фирмы нет ни убытка, ни прибыли.","trap":"Варианты про спрос и предложение звучат по-экономически.","slide":"Л3, сл. 63","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v3-s12","variant":3,"n":12,"q":"Какой из следующих методов анализа используется для оценки экономической приемлемости изменений цен?","options":{"А":"анализ безубыточности","Б":"SWOT-анализ","В":"PEST-анализ","Г":"факторный анализ"},"answer":"А","why":"Точку безубыточности используют для оценки рисков при изменении цены и для решений о снижении или повышении цен.","trap":"SWOT и PEST знакомы по другим курсам и звучат солидно.","slide":"Л3, сл. 63","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v3-s13","variant":3,"n":13,"q":"Компания «Эльдорадо» популярна среди потребителей постоянными акционными предложениями и скидками, которые проявляются в виде цен типа «4999,00 рублей», «39990,00 рублей», 5499,99 рублей». Такой подход к ценообразованию на товары называется","options":{"А":"High-Low pricing","Б":"Psychological pricing","В":"Competitor-based pricing","Г":"Bundle pricing"},"answer":"Б","why":"Цены вида 4999 и 39990 это психологическое ценообразование: ценовая концовка 9 (Л3 сл. 30) и разбиение диапазона на уровни, где 999 это не 1000 (Л3 сл. 31). Ценники Пятерочки с плашкой «Акция!» и ценами вида 49,90 и 129,99 на Л5 сл. 51 тоже разобраны как психологическая стратегия.","trap":"А High-Low тянет из-за слов про постоянные акционные предложения и скидки.","slide":"Л3, сл. 29, Л3, сл. 30, Л3, сл. 31, Л5, сл. 51 (картинка), Л5, сл. 35 (картинка)","crowd":"Б","crowd_wrong":false,"disputed":true,"dispute_note":"На экзамене жми Б, потому что цены вида 4999, 39990 и 5499,99 это ценовая концовка 9 (Л3 сл. 30-31), а ценники Пятерочки с плашкой «Акция!» и ценами вида 49,90 и 129,99 на Л5 сл. 51 разобраны как психологическая стратегия. Риск в А: постоянные акционные предложения и скидки в условии тянут к High-Low (Л5 сл. 35: «ЦО высокой и низкой цены для max прибыли»). За Б однокурсник и все три решателя.","also_in":[]},{"id":"v3-s14","variant":3,"n":14,"q":"В современных жилых домах жильцы пользуются разнотарифными счетчиками электроэнергии, которые позволяют управлять итоговой стоимостью услуг в зависимости от времени потребления: утро – тариф 1, дневное время – тариф 2, вечер и ночь – тариф 3. Данный подход к установлению цены на электроэнергию относится к стратегии","options":{"А":"Dynamic pricing","Б":"Bundle pricing","В":"Premium pricing","Г":"High-Low pricing"},"answer":"А","why":"Динамическое ценообразование: цена меняется в зависимости от спроса и времени. Тариф по времени суток как раз такой.","trap":"Г: разные тарифы похожи на High-Low, то дороже, то дешевле.","slide":"Л3, сл. 23","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v3-s15","variant":3,"n":15,"q":"Какой из следующих методов может использоваться для определения цены нового товара?","options":{"А":"анализ затрат","Б":"опросы потребителей","В":"анализ конкурентов","Г":"все вышеперечисленное"},"answer":"Г","why":"В лекции цену ставят от затрат (Cost-Plus), по опросам о готовности платить и по ценам конкурентов. Подходят все три метода.","trap":"Если помнить одну модель, тянет выбрать один метод.","slide":"Л3, сл. 5, Л3, сл. 16, Л3, сл. 18","crowd":"Г","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v3-s16","variant":3,"n":16,"q":"Какой из следующих методов ценообразования предполагает установление цен на основе затрат плюс наценка?","options":{"А":"затратный метод","Б":"метод ценообразования на основе ценности","В":"конкурентный метод","Г":"метод ценообразования на основе спроса"},"answer":"А","why":"Затраты плюс наценка это модель Cost-Plus Pricing, затратный метод.","trap":"В: конкурентный метод тоже добавляет корректировку, только к цене конкурента.","slide":"Л3, сл. 5","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v3-s17","variant":3,"n":17,"q":"Определите вид затрат у фирмы А. 1000 рублей за подписку «Консультант-Плюс»","options":{"А":"прямые","Б":"косвенные","В":"постоянные","Г":"переменные"},"answer":"В","why":"В мини-игре «Угадай куда относится?» звезда стоит у «Постоянные». Подписка есть и в списке постоянных затрат.","trap":"Подписку легко счесть косвенным расходом, как услуги из списка косвенных. Ключ мини-игры: постоянные.","slide":"Л1, сл. 49 (картинка), Л1, сл. 42","crowd":"В","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v1-s6"]},{"id":"v3-s18","variant":3,"n":18,"q":"Выберите неверное утверждение"," e_note":"","also_in":[]},{"id":"v4-s3","variant":4,"n":3,"q":"… – это получение прибыли от продажи продукта","options":{"А":"Ценность","Б":"Воспринимаемая ценность","В":"Воспринимаемая ценность для продавца","Г":"Восприятие"},"answer":"В","why":"Дословное определение: воспринимаемая ценность для продавца это получение прибыли от продажи продукта.","trap":"Ценность и воспринимаемая ценность для покупателя стоят на том же слайде.","slide":"Л2, сл. 13","crowd":"В","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v4-s4","variant":4,"n":4,"q":"Себестоимость — это …","options":{"А":"сумма затрат, которые необходимо понести для производства или предоставления товаров или услуг","Б":"ключевой показатель в управлении бизнесом","В":"основа для принятия обоснованных решений о ценообразовании","Г":"все ответы верны"},"answer":"Г","why":"Себестоимость на слайде определена всеми тремя формулировками: сумма затрат, ключевой показатель в управлении и основа для решений о ценообразовании.","trap":"А выглядит как классическое определение. Его выбрал однокурсник.","slide":"Л1, сл. 36","crowd":"А","crowd_wrong":true,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v4-s5","variant":4,"n":5,"q":"Определите вид затрат у фирмы А. 125 граммов муки (38 рублей) в выпеченном круассане","options":{"А":"прямые","Б":"косвенные","В":"постоянные","Г":"переменные"},"answer":"Г","why":"В мини-игре звезда стоит у «Переменные»: расход муки растет вместе с числом круассанов.","trap":"А: сырье есть и в списке прямых расходов, поэтому тянет ответить «прямые». Ключ мини-игры: переменные.","slide":"Л1, сл. 47 (картинка), Л1, сл. 41","crowd":"Г","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v4-s6","variant":4,"n":6,"q":"Когда нужно применять Direct Costing?","options":{"А":"для удобства расчета «точки безубыточности» фирмы","Б":"когда невозможно варьировать объем производства","В":"когда невозможно применять корреляционный анализ цены и затрат","Г":"когда ассортимент продуктов очень маленький"},"answer":"А","why":"Среди случаев, когда нужен Direct Costing, на слайде есть удобство расчета точки безубыточности.","trap":"Б, В, Г переделаны из других пунктов того же слайда со смыслом наоборот.","slide":"Л1, сл. 60","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v5-s17"]},{"id":"v4-s7","variant":4,"n":7,"q":"На одном из этапов определение психологического ценового коридора по ван Вестендорпу произошло пересечение кривых «слишком дорого» и «слишком дешево». Это означает, что","options":{"А":"у вас нерепрезентативная выборка в опросе","Б":"у вас не одна, а две, совсем разные, целевые аудитории","В":"у вас слишком широкий диапазон возможных цен","Г":"респонденты не верно поняли вопрос и дали не точные ответы"},"answer":"Б","why":"Слайд о точке A: если кривые пересекаются, значит, у вас две совсем разные целевые аудитории.","trap":"А «нерепрезентативная выборка» звучит как типичная ошибка опроса.","slide":"Л2, сл. 25","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v5-s18"]},{"id":"v4-s8","variant":4,"n":8,"q":"Назовите несуществующее последствие государственного регулирования цен","options":{"А":"перераспределение добавленной стоимости и общественной выгоды","Б":"дисбаланс на рынке","В":"установление рыночного равновесия","Г":"Потеря стимулов для развития"},"answer":"В","why":"Последствия регулирования на слайдах: перераспределение добавленной стоимости, новые дисбалансы, потеря стимулов для развития. Рыночного равновесия среди них нет.","trap":"Кажется, что регулирование как раз выравнивает рынок, поэтому В похоже на правду.","slide":"Л1, сл. 66, Л1, сл. 67","crowd":"В","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v5-s19"]},{"id":"v4-s9","variant":4,"n":9,"q":"Если фирма работает по индивидуальному договору, то есть не публикует цены заранее в свободном доступе, ни на ценниках, ни другим способом, то деятельность регламентируется статьей","options":{"А":"425 и 426 ГК РФ","Б":"421 и 424 ГК РФ","В":"410 и 414 ГК РФ","Г":"432 и 433 ГК РФ"},"answer":"Б","why":"Индивидуальный договор регулируют ст. 421 ГК РФ о свободе заключения договора и ст. 424 ГК РФ.","trap":"Номера статей похожи. Подсказка однокурсника: обе статьи кончаются на 1 и 4.","slide":"Л1, сл. 87","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v5-s20"]},{"id":"v4-s10","variant":4,"n":10,"q":"Что такое эластичность спроса?","options":{"А":"способность потребителей изменять свои предпочтения","Б":"изменение объема спроса в ответ на изменение цены","В":"процесс увеличения производства","Г":"степень влияния рекламы на спрос"},"answer":"Б","why":"Эластичность на слайде: показатель чувствительности потребителя к цене, соотношение процентных изменений продаж и цен.","trap":"А «изменять предпочтения» звучит близко к чувствительности.","slide":"Л2, сл. 8","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v4-s11","variant":4,"n":11,"q":"Какой из следующих факторов влияет на ценовую эластичность спроса?","options":{"А":"наличие заменителей","Б":"уровень дохода","В":"время","Г":"все вышеперечисленное"},"answer":"Г","why":"Заменители и время прямо названы факторами эластичности, доход влияет через долю расходов в бюджете. Значит, все три.","trap":"Уровня дохода нет в списке дословно, поэтому тянет выбрать А или В.","slide":"Л2, сл. 9, Л2, сл. 10","crowd":"Г","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v4-s12","variant":4,"n":12,"q":"Какой из следующих типов ценообразования предполагает использование цен на аналогичные товары?","options":{"А":"ценообразование на основе затрат","Б":"ценообразование на основе спроса","В":"конкурентное ценообразование","Г":"ценообразование на основе ценности"},"answer":"В","why":"Конкурентное ценообразование: цена с учетом цен конкурентов, оно актуально, когда рынок насыщен похожими товарами.","trap":"Г: Value-based тоже берет цену альтернативы как базу.","slide":"Л3, сл. 18","crowd":"В","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":[]},{"id":"v4-s13","variant":4,"n":13,"q":"Компания «Fix Price» с момента появления придерживается принципа фиксированных цен, не зависимо от рыночных факторов в текущий момент (например, «все по 50 рублей»). Такой подход к ценообразованию на товары называется","options":{"А":"High-Low pricing","Б":"Psychological pricing","В":"Cost-plus pricing","Г":"Bundle pricing"},"answer":"Б","why":"Единая цена «все по 50 рублей» работает на восприятие простоты и дешевизны. Из вариантов это ближе всего к Psychological pricing.","trap":"В Cost-plus тянет из-за слов «независимо от рыночных факторов»: затратный метод тоже не учитывает спрос.","slide":"Л5, сл. 55 (картинка), Л3, сл. 29, Л3, сл. 76","crowd":"Б","crowd_wrong":false,"disputed":true,"dispute_note":"На экзамене жми Б, потому что «все по 50 рублей» это одна простая цена ради ощущения дешевизны, а Psychological на Л3 сл. 29 актуально для розницы и товаров широкого потребления, когда важно повлиять на восприятие цены. Fix Price на Л3 сл. 76 стоит среди примеров эконом-сегмента (недорогие товары повседневного спроса), а на Л5 сл. 55 назван хищническим ценообразованием, такого варианта нет. Исключение слабое: в таком же наборе вариантов Теремъ это Cost-plus, Самокат это High-Low, но Bundle тоже никем не занят. За Б однокурсник и два решателя, один решатель выбрал В.","also_in":[]},{"id":"v4-s14","variant":4,"n":14,"q":"Компания «12 storees» после ухода с рынков многих зарубежных люксовых брендов предприняла попытку занять новую нишу, подняв цены при прежнем качестве товаров и выбрав отдельные бутики для размещения своих точек продаж. Такая стратегия ценообразования характеризуется как","options":{"А":"High-Low pricing","Б":"Psychological pricing","В":"Competitor-based pricing","Г":"Premium pricing"},"answer":"Г","why":"Пример неудачной цены на слайде: Lime догоняет 12storeez, переход из ма к Value-Based. Риск в Г (так ответил решатель Codex): премиальный бренд и люксовая доставка похожи на Premium pricing, Л3 сл. 70-71 описывают премиум близкими к условию словами (уникальные характеристики, дополнительная ценность, эксклюзивность, индивидуальный подход), а Л5 сл. 76 говорит, что Premium Pricing подчеркивает эксклюзивность и уникальность. За А однокурсник и два решателя.","also_in":[]},{"id":"v5-s15","variant":5,"n":15,"q":"Какой из следующих факторов может снизить ценовую эластичность спроса?","options":{"А":"наличие заменителей","Б":"увеличение дохода","В":"увеличение времени","Г":"все вышеперечисленное"},"answer":"Б","why":"Спрос эластичнее при большем числе заменителей и, как правило, при более долгом времени на решение. Если расходы на товар малы по сравнению с доходами, чувствительность ниже, значит рост дохода ее снижает.","trap":"Г: похожий вопрос варианта 4 (что влияет на эластичность) решается «все вышеперечисленное». Так ответил однокурсник.","slide":"Л2, сл. 9, Л2, сл. 10","crowd":"Г","crowd_wrong":true,"disputed":true,"dispute_note":"На экзамене жми Б, потому что по Л2 сл. 9 заменители делают спрос эластичнее, значит А и «все вышеперечисленное» отпадают; по сл. 10 п. 4 рост дохода снижает чувствительность к цене. Риск в В: на сл. 9 п. 4 для товаров длительного использования с ростом времени спрос менее эластичен, и «может снизить» подходит к В тоже. Риск в Г: составитель мог иметь в виду все три по аналогии с вопросом варианта 4 о влиянии на эластичность, где верно «все вышеперечисленное». Все три решателя за Б, однокурсник за Г.","also_in":[]},{"id":"v5-s16","variant":5,"n":16,"q":"Что такое ценовая война?","options":{"А":"установление цен ниже себестоимости","Б":"установление цен ниже рыночного уровня*","В":"установление цен выше рыночного уровня","Г":"установление цен на уровне конкурентов"},"answer":"Б","why":"В лекции ценовая война это борьба за клиентов ценами ниже рынка: мелкие фирмы заманивают низкими ценами, Внуковские авиалинии начали демпинговую войну.","trap":"А «ниже себестоимости» похоже на демпинг, это лишь крайний случай.","slide":"Л5, сл. 23, Л5, сл. 71 (картинка)","crowd":"Б","crowd_wrong":false,"disputed":true,"dispute_note":"На экзамене жми Б, потому что у Б в бланке напечатана звездочка и его выбрали все три решателя и однокурсник. Точного определения ценовой войны на слайдах нет.","also_in":[]},{"id":"v5-s17","variant":5,"n":17,"q":"Когда нужно применять Direct Costing?","options":{"А":"для удобства расчета «точки безубыточности» фирмы","Б":"когда невозможно варьировать объем производства","В":"когда невозможно применять корреляционный анализ цены и затрат","Г":"когда ассортимент продуктов очень маленький"},"answer":"А","why":"Среди случаев, когда нужен Direct Costing, на слайде есть удобство расчета точки безубыточности.","trap":"Б, В, Г переделаны из других пунктов того же слайда со смыслом наоборот.","slide":"Л1, сл. 60","crowd":"А","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v4-s6"]},{"id":"v5-s18","variant":5,"n":18,"q":"На одном из этапов определение психологического ценового коридора по ван Вестендорпу произошло пересечение кривых «слишком дорого» и «слишком дешево». Это означает, что","options":{"А":"у вас нерепрезентативная выборка в опросе","Б":"у вас не одна, а две, совсем разные, целевые аудитории","В":"у вас слишком широкий диапазон возможных цен","Г":"респонденты не верно поняли вопрос и дали не точные ответы"},"answer":"Б","why":"Слайд о точке A: если кривые пересекаются, значит, у вас две совсем разные целевые аудитории.","trap":"А «нерепрезентативная выборка» звучит как типичная ошибка опроса.","slide":"Л2, сл. 25","crowd":"Б","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v4-s7"]},{"id":"v5-s19","variant":5,"n":19,"q":"Назовите несуществующее последствие государственного регулирования цен","options":{"А":"перераспределение добавленной стоимости и общественной выгоды","Б":"дисбаланс на рынке","В":"установление рыночного ls":[],"answer":"БАГВ","why":"Логика выживаемости фирмы на слайде: цена, объем продаж, объем производства, издержки на единицу, прибыльность продаж. Объема продаж среди вариантов нет, остается Б, А, Г, В; на Л5 сл. 85 это же задание дано как пример, без ответа.","slide":"Л1, сл. 27, Л5, сл. 85","crowd":"БАГВ","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v2-o1","v3-o5","v4-o4","v5-o3"]},{"id":"v1-o3","variant":1,"n":3,"q":"Распределите верные расчетные формулы цены: 1. на основе нормативов рентабельности; 2. на основе наценок; 3. с ориентацией на целевую рентабельность инвестиций; 4. на основе торговых скидок и надбавок","items":{"А":"P=UC ×(1+PTC_UC)","Б":"P_P=P_S ×(1 -M_SP)","В":"Цена=Прямые затраты+((Прямые затраты+Целевая масса прибыли))/(Плановые продажи, шт)","Г":"Цена=Удельные полные издержки+  ((Целевая рентабельность х Сумма инвестиций))/(Плановые продажи, шт)"},"answer_mode":"mapping","mapping_labels":["1. на основе нормативов рентабельности","2. на основе наценок","3. с ориентацией на целевую рентабельность инвестиций","4. на основе торговых скидок и надбавок"],"answer":"АВГБ","why":"По слайдам: 1 нормативы рентабельности это формула с UC и PTC (А); 2 наценки, модель расчета №1, это прямые затраты и целевая масса прибыли на план продаж (В); 3 целевая рентабельность инвестиций это формула с суммой инвестиций (Г); 4 торговые скидки это формула с PP, PS и MSP (Б).","slide":"Л3, сл. 45, Л3, сл. 46, Л3, сл. 48, Л3, сл. 50","crowd":"АВГБ","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v2-o2","v3-o1","v4-o5","v5-o4"]},{"id":"v1-o4","variant":1,"n":4,"q":"Расположите инструменты государственного регулирования по силе воздействия (от наиболее сильного к наименее слабому)","items":{"А":"ввозная таможенная пошлина","Б":"плавающие налоговые ставки","В":"установление предельного норматива рентабельности фирм","Г":"установление норм амортизации"},"answer_mode":"sequence","mapping_labels":[],"answer":"ВАБГ","why":"Прямого ранжирования по силе на слайдах нет, порядок выведен. Норматив рентабельности относится к прямому регулированию (сл. 76), нормы амортизации к косвенному (сл. 82), а список на сл. 69 (налоговые ставки, пошлины, прямое и косвенное регулирование со звездочкой), если читать его от мягкого к жесткому, дает В, А, Б, Г.","slide":"Л1, сл. 69, Л1, сл. 76, Л1, сл. 80, Л1, сл. 82","crowd":"АБВГ","crowd_wrong":true,"disputed":true,"dispute_note":"На экзамене пиши ВАБГ, потому что порядок подсказывает только сл. 69: список там идет налоговые ставки, пошлины, прямое и косвенное регулирование со звездочкой, и от мягкого к жесткому это дает В, А, Б. Прямого ранжирования по силе на слайдах нет, это почти 50 на 50: ВАБГ и АБВГ различаются только местом В. Против: на сл. 80 норматив рентабельности назван слабо распространенным, но это про распространенность, силу воздействия слайд не оценивает. Однокурсник поставил АБВГ во всех вариантах и верно решил три последовательности, которые слайды решают. Все три решателя дали ВАБГ с низкой уверенностью. При ключе ВАБГ ответ АБВГ даст 0 по строгому правилу, и наоборот; если ключ отличается от ВАБГ одной перестановкой соседних букв, ответ ВАБГ даст 0,5.","also_in":["v2-o3","v3-o2","v4-o1","v5-o5"]},{"id":"v1-o5","variant":1,"n":5,"q":"Расположите наиболее удачные ценовые стратегии в зависимости от фазы жизненного цикла продукта: 1. выход на рынок; 2. рост продаж; 3. плато; 4. ликвидация","items":{"А":"Value-based pricing","Б":"Penetration pricing","В":"High-Low pricing","Г":"Competitor-based pricing"},"answer_mode":"mapping","mapping_labels":["1. выход на рынок","2. рост продаж","3. плато","4. ликвидация"],"answer":"БАГВ","why":"Выход на рынок: Penetration, новый продукт по низкой цене (Lexus, Л5 сл. 37). Остальное вывод из условий моделей: рост продаж Value-based (за уникальные свойства готовы платить больше, Л3 сл. 14), плато Competitor-based (рынок насыщен похожими товарами, Л3 сл. 18), ликвидация High-Low (цены высокой и низкой, Л5 сл. 35; распродажи на слайде не названы).","slide":"Л5, сл. 37 (картинка), Л5, сл. 45 (картинка), Л3, сл. 14, Л3, сл. 18, Л5, сл. 35 (картинка)","crowd":"БАГВ","crowd_wrong":false,"disputed":true,"dispute_note":"На экзамене пиши БАГВ, потому что это ответ с наибольшим ожидаемым баллом. На слайдах есть только первый шаг (проникновение для нового продукта), остальное вывод из условий моделей на Л3, сл. 14 и 18. БАГВ дали все три решателя и однокурсник в вариантах 1, 2 и 3. БГАВ однокурсника в вариантах 4 и 5 отличается одной перестановкой соседних, так что при таком ключе БАГВ все равно даст 0,5. В варианте 4 в тексте бланка после БГАВ стоит еще одна «В» без пояснения, она отброшена. На фото бланка варианта 1 рукой БВАГ: при таком ключе БАГВ даст 0, но эту версию не поддерживает никто, кроме автора пометки.","also_in":["v2-o4","v3-o3","v4-o2","v5-o1"]},{"id":"v2-o1","variant":2,"n":1,"q":"Сформируйте логику выживаемости фирмы","items":{"А":"Объем производства","Б":"Цена","В":"Прибыльность продаж","Г":"Издержки на единицу"},"answer_mode":"sequence","mapping_labels":[],"answer":"БАГВ","why":"Логика выживаемости фирмы на слайде: цена, объем продаж, объем производства, издержки на единицу, прибыльность продаж. Объема продаж среди вариантов нет, остается Б, А, Г, В; на Л5 сл. 85 это же задание дано как пример, без ответа.","slide":"Л1, сл. 27, Л5, сл. 85","crowd":"БАГВ","crowd_wrong":false,"disputed":false,"dispute_note":"","also_in":["v1-o2","v3-o5","v4-o4","v5-o3"]},{"id":"v2-o2","variant":2,"n":2,"q":"Распределите верные расчетные формулы цены: 1. на основе нормативов рентабельности; 2. на основе наценок; 3. с ориентацией на целевую рентабельность инвестиций; 4. на основе торговых скидок и надбавок","items":{"А":"P=UC ×(1+PTC_UC)","Б":"P_P=P_S ×(1 -M_SP)","В":"Цена=Прямые затраты+((Прямые затраты+Целевая масса прибыли))/(Плановые продажи, шт)","Г":"Цена=Удельные полные издержки+  ((Целевая рентабельность х Сумма инвестиций))/(Плановые продажи, шт)"},"answer_mode":"mapping","mapping_l ,"legend":"P: цена. UC: удельные полные издержки, unit cost. PTC_UC: норматив рентабельности к издержкам, profit to cost, процент прибыли к себестоимости единицы. Метод из СССР до 1967 года.","example":"Пример слайда: UC = 600 руб., PTC_UC = 20%: P = 600 × 1,20 = 720 руб. Вариант 1, задача 3: через год UC = 720, цена 720 × 1,20 = 864 руб.","trap":"Норматив к издержкам, поэтому умножаем на (1 + PTC_UC). Деление 200 / (1 − 0,25) = 266,67 это модель №2 для рентабельности продаж: так однокурсник ошибся в «ЭкоБлокноте», верно 200 × 1,25 = 250.","slide":"Л3, сл. 45","used_in":["v1-p1","v1-p3","v2-p3","tr-1","tr-7"]},{"id":"f-model1","name":"Расчет цен на основе наценок, модель расчета №1","formula":"Цена = Прямые затраты + (Накладные + Целевая масса прибыли) / Плановые продажи, шт.\nP = VC + (FC + П) / Q","given":"прямые затраты на единицу, накладные расходы за год, желаемая прибыль за год, годовой план продаж в штуках","legend":"VC: прямые затраты на единицу. FC: накладные расходы за год. П: целевая масса прибыли за год. Q: плановые продажи, шт. На слайде в числителе написано «Прямые затраты», в примере там стоят накладные 140 000: это опечатка слайда.","example":"800 + (140 000 + 260 000) / 1 000 = 800 + 400 = 1 200 руб. (пример слайда).","trap":"В скобки идут только накладные и прибыль за год, прямые на единицу прибавляются отдельно. Если прямые затраты даны на весь выпуск, сначала раздели их на Q (вариант 5, задача 1: 120 320 или 400).","slide":"Л3, сл. 46; эта модель в образце задачи на Л5, сл. 85","used_in":["v2-p2","v4-p1","v5-p1","pool-1","tr-5","tr-6","tr-11"]},{"id":"f-uc","name":"Полная себестоимость единицы (удельные полные издержки)","formula":"UC = VC + FC / Q","given":"переменные (прямые) затраты на единицу, постоянные (накладные, маркетинг) затраты за год, объём","legend":"UC (в пуле C): все затраты на единицу, включая расходы на реализацию. VC: прямые переменные на единицу. FC: постоянные за год. Q: объём, шт.","example":"Пул, задача 1: 3 600 + 9 600 000 / 8 000 = 3 600 + 1 200 = 4 800 руб. «ЭкоБуст»: 400 + 200 + 500 000 / 5 000 = 700 руб.","trap":"Маркетинг и сбыт тоже входят в полную себестоимость: без 100 руб. маркетинга у «ЭкоБуста» UC 600 вместо 700, цена 1 100 вместо 1 200.","slide":"Л3, сл. 6 (полная себестоимость включает расходы на реализацию); Л1, сл. 38 (С = Переменные × Объём + Постоянные); деление на Q: вывод","used_in":["v3-p3","pool-1","tr-4","tr-11","tr-19"]},{"id":"f-model2","name":"Расчет цен на основе наценок, модель расчета №2 (цена под целевую маржу)","formula":"Цена = Полные издержки на единицу / (1 − Целевая рентабельность продаж)\nP = C / (1 − m)","given":"полные издержки на единицу и целевая рентабельность продаж (маржа, доля прибыли в цене)","legend":"C (UC): полные издержки на единицу; в задаче ABC это переменные затраты. m: целевая рентабельность продаж, доля прибыли в цене.","example":"Слайд: 800 / (1 − 0,35) = 1 230,77 (на слайде 1 230). Пул, задача 1: 4 800 / 0,80 = 6 000 руб.","trap":"Маржа считается от цены, поэтому делим на (1 − m). 4 800 × 1,20 = 5 760 даёт наценку 20%, маржа при ней 16,67%. На Л3, сл. 8 написано «Цена = Себестоимость × (1 + Процент маржи)»: в тесте узнавай эту запись, в задачах считай как пул, делением.","slide":"Л3, сл. 47; пул 2026, задачи 1, 6, 8","used_in":["pool-1","pool-6","pool-8","tr-11","tr-18"]},{"id":"f-margin","name":"Наценка и маржа","formula":"Наценка n = (P − C) / C × 100%\nМаржа m = (P − C) / P × 100%","given":"цена и себестоимость единицы","legend":"P: цена. C: себестоимость (полная или переменная, как в условии). Наценка к себестоимости, маржа к цене. Наценку удобно ставить для цены, маржу для анализа прибыльности (Л3, сл. 9).","example":"P = 5 600, C = 4 800: наценка 800 / 4 800 = 16,67%, маржа 800 / 5 600 = 14,29%.","trap":"Наценка делится на себестоимость, маржа на цену. Маржа всегда меньше наценки и не бывает больше 100%; наценка бывает и 200%, и 500% (Л3, сл. 10).","slide":"Л3, сл. 7–10","used_in":["v3-p3","pool-1","pool-2","pool-3","pool-4","pool-5","pool-6","pool-8","tr-11","tr-12","tr-13","tr-14","tr-15","tr-16","tr-18","tr-19"]},{"id":"f-roi","name":"Расчет цен с ориентацией на целевую рентабельность инвестиций","formula":"Цена = Удельные полные издержки + (Целевая рентабельность × Сумма инвестиций) / Плановые продажи, шт.\nP = UC + ROI × I / Q","given":"удельные полные издержки, сумма инвестиций, целевая рентабельность инвестиций, план продаж в штуках","legend":"UC: удельные полные издержки. ROI: целевая рентабельность инвестиций, доля. I: сумма инвестиций. Q: плановые продажи, шт. Обратно: фактическая ROI = (P − UC) × Q / I.","example":"Слайд: 900 + 16 000 000 × 0,34 / 10 000 = 900 + 544 = 1 444 руб.","trap":"ROI умножай на сумму инвестиций и дели на план продаж: 0,25 × 5 000 000 / 50 = 25 000 сверху на мероприятие. Годовые расходы на маркетинг раздели на Q и прибавь к UC.","slide":"Л3, сл. 48","used_in":["v2-p1","v3-p3","v4-p2","v5-p2","pool-2","tr-3","tr-4","tr-12"]},{"id":"f-trade1","name":"Расчет цен на основе торговых скидок и надбавок, ситуация 1","formula":"P_S = P_P / (1 − M_SP)","given":"цена, которую хочет поставщик, и торговая скидка продавца; конечная цена не ограничена","legend":"P_S: цена конечной продажи, отпускная цена продавца (на слайде 10 000). P_P: цена поставки, её хочет поставщик (8 000). M_SP: торговая скидка, доля цены конечной продажи. Расшифровка «markup on selling price» из файла однокурсника, на слайде её нет.","example":"Слайд: 8 000 / (1 − 0,20) = 10 000 руб.","trap":"Скидка считается от конечной цены, поэтому делим: 8 000 × 1,20 = 9 600 даёт продавцу только 16,67%. Ситуацию выбирай по тому, что задано: цена поставщика (ситуация 1) или конечная цена (ситуация 2).","slide":"Л3, сл. 49–50","used_in":["v5-p3","tr-9"]},{"id":"f-trade2","name":"Расчет цен на основе торговых скидок и надбавок, ситуация 2","formula":"P_P = P_S × (1 − M_SP)","given":"конечная (розничная) цена, которую задаёт поставщик, и желаемая торговая скидка продавца","legend":"P_P: цена поставки, выше которой продавец товар не возьмёт. P_S: цена конечной продажи. M_SP: торговая скидка, доля цены конечной продажи. Скидка всегда от 0 до 100% (Л3, сл. 51).","example":"Слайд: 12 000 × (1 − 0,20) = 9 600 руб.; «Комп»: 22 500 × 0,75 = 16 875 руб.","trap":"P_S это конечная цена, P_P цена поставки: у однокурсника на разных страницах они переставлены. «Поставщик хотел бы получить …» в условии часто лишнее число из примера слайда.","slide":"Л3, сл. 49–50","used_in":["v3-p1","v3-p2","v5-p3","pool-6","tr-8","tr-10","tr-16"]},{"id":"f-chain","name":"Цепочка торговых скидок (обратный расчет конечной цены)","formula":"P_M = P_final × (1 − d_R) × (1 − d_D)\nP_final мин = C / ((1 − m) × (1 − d_R) × (1 − d_D))","given":"конечная цена, скидки розницы и дистрибьютора, себестоимость и нужная маржа производителя","legend":"P_final: конечная цена. d_R: скидка розницы от конечной цены. d_D: скидка дистрибьютора от его цены продажи рознице. P_M: цена производителя. C: себестоимость. m: маржа производителя.","example":"Пул, задача 6: 12 990 × 0,72 × 0,84 = 7 856,35 руб.; минимум 6 100 / (0,75 × 0,72 × 0,84) = 13 447,97 руб.","trap":"Скидки перемножаются, складывать 28% + 16% = 44% нельзя: 0,72 × 0,84 = 0,6048, посредники забирают 39,52%. Каждая скидка от цены своего звена.","slide":"Л3, сл. 49–50 (ситуация 2 два раза подряд); формула цепочки: вывод по пулу 2026, задача 6","used_in":["pool-6","tr-16"]},{"id":"f-discount","name":"Цена со скидкой (тактика скидок)","formula":"P = P₀ × (1 − d)","given":"исходная цена и процент скидки","legend":"P₀: исходная (начальная, рекомендованная) цена. d: скидка, доля. В рублях на слайде: Цена = A − d, якорь минус скидка.","example":"1 000 × (1 − 0,15) = 850 руб.; 15 000 × 0,75 = 11 250 руб.","trap":"Скидку бери от той цены, к которой она относится: в «ЭкоБлокноте» 10% от итоговой цены 300 (выйдет 270), от расчётных 250 нельзя.","slide":"Л3, сл. 32 (якорь A − d); Л5, сл. 18 (виды тактических скидок); формула в процентах: вывод","used_in":["v1-p2","v2-p3","v3-p2","tr-2","tr-7"]},{"id":"f-qty","name":"Количество под нужную выручку","formula":"TR = P × Q, отсюда Q = TR / P, вверх до целого","given":"цена единицы и нужная выручка «не менее»","legend":"TR: выручка. P: цена. Q: количество, шт.","example":"450 000 / 22 500 = 20 шт.; 1 000 000 / 45 000 = 22,2, значит 23 шт.","trap":"Штуки только целые, а «не менее» значит округлять вверх: 18,75 даёт 19, 18 штук нужную выручку не дадут. Так же с ТБУ: 14 124,75 даёт 14 125.","slide":"Л1, сл. 59 (Выручка = P × Q); округление вверх: вывод, так в пуле 2026, задача 7","used_in":["v5-p3","pool-7","tr-9","tr-10","tr-17"]},{"id":"f-comp","name":"Цена от прямого конкурента (Competition-Based Pricing, формулы 1 и 2)","formula":"Цена = Цена конкурента ± Δ\nЦена = Цена конкурента ± k, по смыслу P_конк × (1 ± k)","given":"цена ближайшего конкурента в своём сегменте и поправка: в рублях (Δ) или в процентах (k)","legend":"Цена конкурента: «определяется ближайший конкурент в одном сегменте» (Л3, сл. 19–20). Δ: «корректировка (например, процентное различие вверх или вниз)», на слайде плюс за превосходство по качеству или сервису. −k: «процент, на который цена будет ниже (например, 0.05 для снижения на 5%)»; +k: «надбавка в процентах за уникальные характеристики, сервис или бренд». Та же запись на сл. 26: «Цена = Pконкур × (1 + β)», β: «надбавка в процентах». В задаче 4 пула надбавку берут к средневзвешенной цене рынка (сл. 21).","example":"Слайд 19: 100 + 25 = 125 руб. Слайд 26: 1 500 × (1 + 0,10) = 1 650 руб. Кейс: Л 120 руб., Δ = −11 руб., 120 − 11 = 109 руб.","trap":"На сл. 20 в примере сложено 50 + 0,25 = 50,25: узнавай эту запись в тесте; по смыслу надбавка 25% даёт 50 × 1,25 = 62,50 руб. (вывод). Конкурента бери из своего сегмента: в кейсе К (80 руб.) эконом, Л (120 руб.) масс-маркет.","slide":"Л3, сл. 19–20, 26","used_in":["pool-4","tr-14","tr-19"]},{"id":"f-range","name":"Диапазонная стратегия (между мин. и макс. ценами конкурентов)","formula":"Цена = Цена мин + (Цена макс − Цена мин) × α\nP = P_min + (P_max − P_min) × α","given":"минимальная и максимальная цены прямых конкурентов и уровень позиционирования α","legend":"P_min, P_max: границы диапазона цен конкурентов сегмента (не обязательно самая низкая и самая высокая на рынке). α: от 0 до 1, при α = 0,5 середина.","example":"Слайд: 54 + (58 − 54) × 0,2 = 54,80 руб. Пул, задача 2: 1 690 + 400 × 0,62 = 1 938 руб.","trap":"α умножается на ширину диапазона и прибавляется к минимуму. Границы бери названные релевантными: в задаче 4 пула это 4 550 и 5 300 (4 200 вне диапазона). Диапазон строй внутри своего сегмента: в кейсе К (эконом) и Л (масс-маркет) из разных сегментов, поэтому там цена от Л по сл. 19.","slide":"Л3, сл. 22","used_in":["pool-2","pool-4","tr-12","tr-14"]},{"id":"f-market","name":"Средневзвешенная цена по рынку и цена с премией","formula":"Слайд: Цена = Σ Цена конкурентаᵢ / n\nС долями рынка: P̄ = Σ Pᵢ × доляᵢ\nP_prem = P̄ × (1 + k)","given":"цены конкурентов, их доли рынка и премия (надбавка) в %","legend":"Pᵢ: цена i-го конкурента. n: число конкурентов. доляᵢ: его доля рынка, сумма долей 100%. k: премия за уникальность, сервис или бренд; со знаком минус это цена ниже конкурента (undercutting).","example":"Слайд 21: (50 + 52 + 58 + 62 + 65) / 5 = 57,40 руб. Пул, задача 4: 4 200 × 0,15 + 4 550 × 0,25 + 4 900 × 0,35 + 5 300 × 0,25 = 4 807,50 руб.; × 1,06 = 5 095,95 руб.","trap":"На сл. 21 формула называется «Средневзвешенная цена по рынку», но записана как простое среднее: в тесте узнавай эту запись. Если доли даны, взвешивай по долям: простое среднее даст 4 737,50. Премия в процентах умножает цену. На сл. 20 в примере сложено 50 + 0,25 = 50,25, по смыслу формулы 50 × 1,25 = 62,50 (вывод).","slide":"Л3, сл. 20–21; взвешивание по долям: вывод по пулу 2026, задача 4","used_in":["pool-4","tr-14"]},{"id":"f-psy","name":"Психологическая цена (ценовая концовка 9)","formula":"Цена = N − 0,01\nили наибольшая целая цена на 9 не выше потолка","given":"расчётная цена или граница: потолок (WTP, регламент) или минимум (нужная маржа)","legend":"N: «образцовая цена конкурента» (Л3, сл. 30); расчётную цену как N берут в пуле, задача 2 (вывод). Ценовые уровни: 999 воспринимается ниже 1 000 (Л3, сл. 31).","example":"На сл. 30 пример: 100 − 0,01 = 99 руб., итог записан в целых рублях. Пул: 1 938 − 0,01 = 1 937,99 руб.; потолок 5 095,95 даёт 5 089; потолок 3 600 даёт 3 599; минимум 13 447,97 даёт 13 449.","trap":"Сначала пойми, граница сверху или снизу. Потолок (WTP, регламент): ближайшая цена на 9 ниже, 5 099 больше 5 095,95, поэтому 5 089. Минимум (маржа): ближайшая на 9 выше, 13 449. В тесте запись N − 0,01 может идти с целым итогом, как на сл. 30.","slide":"Л3, сл. 30–31; правило «целая цена на 9»: из условий пула 2026, задачи 4–6","used_in":["pool-2","pool-4","pool-5","pool-6","tr-12","tr-14","tr-15","tr-16","tr-19"]},{"id":"f-dyn","name":"Динамическое ценообразование: спрос и предложение, затем факторы","formula":"P₁ = P_base × (1 + α × (D − S) / S)\nP₂ = P₁ × (1 + Σ wᵢ × fᵢ)","given":"базовая цена, спрос и предложение, коэффициент чувствительности, веса и оценки факторов","legend":"P_base: базовая цена. α: чувствительность к спросу. D, S: спрос и предложение в момент t. wᵢ: вес фактора. fᵢ: оценка фактора, минус снижает цену.","example":"Пул, задача 5: 3 000 × (1 + 0,5 × 170 / 650) = 3 392,31; Σ = 0,06 − 0,06 + 0,14 = 0,14; 3 392,31 × 1,14 = 3 867,23 руб.","trap":"(D − S) делится на предложение S. Отрицательную оценку вычитай. Потолок и окончание на 9 применяй в самом конце.","slide":"Л3, сл. 24 и 27; цепочка P₁, затем P₂ = P₁ × (1 + Σ wᵢfᵢ): пул 2026, задача 5 (на сл. 27 факторы умножают P_base)","used_in":["pool-5","tr-15"]},{"id":"f-vbp","name":"Ценообразование на основе ценности (Value-Based Pricing)","formula":"B = Экономия времени × Стоимость часа\nAV = B × Доля влияния продукта\nDV = Плюсы − Минусы относительно альтернативы\nVBP = Цена альтернативы + DV\nP = min(VBP; WTP)","given":"сэкономленные часы и цена часа, доля влияния, цена лучшей альтернативы, плюсы и минусы отличий, WTP","legend":"B: монетизированная выгода. AV: атрибутируемая ценность. DV: дифференцированная ценность. VBP: цена на основе ценности. WTP: готовность платить. CPV = AV − P: ценность, что остаётся клиенту. Цена альтернативы это цена безразличия (Л2, сл. 18). Дословно на Л3, сл. 15: «CPV=Общая выгода для клиента−Стоимость для клиента», «DV=Ценность продукта−Ценность лучшей альтернативы». Записи DV через плюсы и минусы и CPV = AV − P из пула, задача 3.","example":"Слайд: 799 + 100 = 899 у.е. Пул, задача 3: 1 080 000 + (540 000 + 260 000 − 140 000) = 1 740 000; WTP 1 620 000, цена 1 620 000 руб. в год.","trap":"Минусы (миграция, обучение) вычитай из DV. WTP ограничивает сверху: бери меньшее из VBP и WTP.","slide":"Л3, сл. 15–17; Л2, сл. 18","used_in":["pool-3","tr-13"]},{"id":"f-bep1","name":"Точка безубыточности одного продукта (простой бизнес)","formula":"Q_ТБУ = FC / (P − VC), вверх до целого\nТбу = ПоЗ / М, М = (В − С) / В","given":"постоянные затраты за период, цена и переменные затраты на единицу","legend":"FC (ПоЗ): постоянные затраты. P: цена. VC: переменные затраты на единицу. P − VC: маржинальная прибыль на единицу (Л3, сл. 65). «Простой бизнес = однопродуктовый бизнес» (Л3, сл. 64): формула в штуках это алгоритм сл. 65–66 для одного продукта с долей 100% (вывод). М: маржинальность. На Л1, сл. 59: Маржинальность (М) = (В − С) / В, Точка безубыточности (Тбу) = ПоЗ / М; В: выручка, С: себестоимость, ПоЗ: постоянные затраты.","example":"Кейс, бумага: 50 000 / (109 − 42) = 746,27, вверх 747 пачек в месяц; с начальником цеха 150 000 / 67 = 2 238,81, вверх 2 239. Л1, сл. 59, Direct Costing: М = (1 500 − 700) / 1 500 = 0,53; Тбу = 100 / 0,53 = 189.","trap":"На Л1, сл. 59 итог подписан «ед.», но ПоЗ / М даёт выручку в рублях (вывод): без округления М это 100 / (800 / 1 500) = 187,50 руб., то есть 12,5 шт. по 15 руб. В штуках дели постоянные на маржинальную прибыль единицы: 100 / (15 − 7) = 12,5. Дробную ТБУ округляй вверх.","slide":"Л3, сл. 63–66; Л1, сл. 59","used_in":["tr-19"]},{"id":"f-bep","name":"Точка безубыточности сложного бизнеса (портфель продуктов)","formula":"CMᵢ = Pᵢ − VCᵢ\nWACM = Σ CMᵢ × доляᵢ\nQ_BE = FC / WACM\nQᵢ = Q_BE × доляᵢ","given":"цены и переменные затраты продуктов, доли в продажах в штуках, постоянные затраты","legend":"CMᵢ: маржинальная прибыль на единицу. WACM: средневзвешенная маржинальная прибыль на составную единицу. FC: постоянные затраты. Q_BE: ТБУ в составных единицах.","example":"Пул, задача 7: WACM = 800 × 0,5 + 1 200 × 0,3 + 1 800 × 0,2 = 1 120; 13 440 000 / 1 120 = 12 000 шт.","trap":"В числителе постоянные затраты FC (в записи пула опечатка VC). Дробную ТБУ округляй вверх. Выручку в ТБУ считай по каждому продукту по его цене.","slide":"Л3, сл. 64–66","used_in":["pool-7","tr-17"]},{"id":"f-abc","name":"ABC-анализ по вкладу в маржинальную прибыль","formula":"Вкладᵢ = (Pᵢ − VCᵢ) × Qᵢ\nДоляᵢ = Вкладᵢ / Σ Вклад\nНакопленная доля: A до ~80%, B до 95%, C остальное","given":"цены, переменные затраты и продажи в штуках по каждому продукту","legend":"Ранжируй по убыванию вклада и копи доли. Группа A около 80%, B от 80 до 95%, C от 95 до 100% (Л3, сл. 62).","example":"Пул, задача 8: общий вклад 4 700 000; накопленные доли 42,55 / 65,53 / 78,94 / 87,45 / 93,83 / 100%: A, B, C в группе A; D, E в B; F в C.","trap":"Сначала отсортируй по вкладу, потом копи доли. Если позиция перескакивает границу, бери классификацию, ближайшую к 80% (так в эталоне пула).","slide":"Л3, сл. 55–62 (на слайдах по выручке; по маржинальной прибыли: пул 2026, задача 8)","used_in":["pool-8","tr-18"]},{"id":"f-elast","name":"Коэффициент ценовой эластичности спроса","formula":"E = ((ΔQ_d / Q_d) × 100%) / ((ΔP / P) × 100%)\n|E| > 1: спрос эластичен по цене; |E| \u003c 1: неэластичен; |E| = 1: единичная эластичность","given":"цена и продажи до и после изменения цены","legend":"E: коэффициент ценовой эластичности спроса, на слайде E с индексами p (цена) и d (спрос). ΔQ_d / Q_d: относительное изменение продаж. ΔP / P: относительное изменение цены. На слайде: «Коэффициент ценовой эластичности спроса в самом общем виде определяется соотношением процентных изменений продаж и цен». Для кейса: «В масс-маркете высокая эластичность спроса по цене» (Л3, сл. 82).","example":"Тренировка 20: цена с 80 до 72 руб., (72 − 80) / 80 = −10%; продажи с 1 500 до 1 950 шт., 450 / 1 500 = 30%; E = 30% / (−10%) = −3, |E| = 3 больше 1, спрос эластичен.","trap":"Базу бери исходную, до изменения: на слайде она не уточнена (вывод). От новых значений вышло бы −11,11% и 23,08%, E = −2,08. Знак E обычно минус: цена вниз, продажи вверх; эластичность определяют по модулю.","slide":"Л2, сл. 8; эластичность в масс-маркете: Л3, сл. 82","used_in":["tr-20"]},{"id":"f-express","name":"Экспресс-метод: цена, максимизирующая прибыль","formula":"Цена = (Переменные затраты на единицу + Максимальная цена, по которой продашь хотя бы одну единицу) / 2\nP = (VC + P_F) / 2","given":"переменные затраты на единицу и максимальная цена, по которой можно продать хотя бы одну единицу (точка F)","legend":"На слайде: «нужно найти среднее арифметическое между двумя величинами»: «Переменными затратами на единицу продукции» и «Максимальной ценой, по которой вы сможете продать хотя бы одну единицу продукции». VC: переменные затраты на единицу. P_F: цена точки F, вопрос со сл. 31: «А по какой цене я смогу продать хотя бы одну, всего лишь одну единицу?». Точка E на сл. 32: «Максимальная стоимость, которую ставят ваши конкуренты, находящиеся в зоне видимости клиента»; на графике сл. 29 F правее E.","example":"Тренировка 21: (400 + 3 000) / 2 = 1 700 руб. Кейс, бумага: цены F в условии нет; если вместо F взять М (это точка E): (42 + 250) / 2 = 146 руб., только нижняя оценка.","trap":"Метод берёт переменные затраты на единицу, без постоянных: у бумаги 42 руб., себестоимость 47 руб. сюда не идёт. Если вместо F взять максимальную цену конкурентов (точка E), цена выйдет ниже: F правее E.","slide":"Л2, сл. 29, 31–33","used_in":["tr-21"]}],"sub":"22 карточки · вспомни и переверни","done_rule":"шаг готов, когда по каждой карточке последний ответ «помню»"},{"id":"problems","type":"problems","icon":"problem","title":"Задачи","items":[{"id":"v1-p1","source":"Прошлый год, вариант 1, задача 1","level":"прошлый год","text":"Фирма производит электронные устройства. Удельные полные издержки производства одного устройства составляют 1200 рублей. Компания установила норматив рентабельности к издержкам на уровне 25%. Какую цену должна установить компания на устройства, чтобы покрыть издержки и получить запланированную прибыль?","formula_id":"f-ptc","asks":[{"label":"Цена устройства","value":1500,"unit":"руб.","tol":0.5}],"steps":["Дан норматив рентабельности к издержкам, формула Л3, сл. 45: P = UC × (1 + PTC_UC).","P = 1 200 × (1 + 0,25) = 1 200 × 1,25 = 1 500 руб."],"answer_text":"1 500 руб. за устройство.","trap":"Норматив к издержкам: умножаем на 1,25. Деление 1 200 / (1 − 0,25) = 1 600 это модель №2 для рентабельности продаж, за другую формулу 1 балл."},{"id":"v1-p2","source":"Прошлый год, вариант 1, задача 2","level":"прошлый год","text":"В компании по производству электроники планируется запустить новый продукт. Ожидается, что его начальная цена продажи составит 1000 рублей. Однако, из-за различных факторов, таких как сезонные распродажи и акции, компания ожидает, что скидка, которую они предоставят, составит 15%. Необходимо рассчитать конечную цену продукта с учетом ожидаемой скидки.","formula_id":"f-discount","asks":[{"label":"Конечная цена со скидкой","value":850,"unit":"руб.","tol":0.5}],"steps":["Скидка 15% от начальной цены: P = P₀ × (1 − d). Так же устроена ситуация 2 на Л3, сл. 50; отдельной формулы скидки в процентах в лекциях нет (вывод).","P = 1 000 × (1 − 0,15) = 1 000 × 0,85 = 850 руб."],"answer_text":"850 руб.","trap":"Скидка уменьшает цену: 1 000 × 1,15 = 1 150 это наценка."},{"id":"v1-p3","source":"Прошлый год, вариант 1, задача 3","level":"прошлый год","text":"На заводе «Гринкард» по производству деталей для автомобилей до 1967 года использовалась система планирования цен, основанная на расчете себестоимости и нормативной прибыли. Удельные полные издержки (UC) на производство одной детали равняются 600 рублей, а норматив рентабельности к издержкам (PTCuc) - 20%. Необходимо рассчитать, какая цена будет установлена на 1 деталь с учетом удельных издержек и нормативной прибыли, а также узнать, если через год удельные издержки изменятся и составят 720 рублей, а нормативная рентабельность останется на том же уровне, какую цену нужно будет установить на 1 деталь в следующем году.","formula_id":"f-ptc","asks":[{"label":"Цена детали сейчас","value":720,"unit":"руб.","tol":0.5},{"label":"Цена детали через год","value":864,"unit":"руб.","tol":0.5}],"steps":["Формула Л3, сл. 45: P = UC × (1 + PTC_UC). Числа первого года это пример со слайда.","Сейчас: 600 × 1,20 = 720 руб.","Через год UC = 720: 720 × 1,20 = 864 руб."],"answer_text":"Сейчас 720 руб., через год 864 руб.","trap":"Через год 720 это новые издержки UC. С ценой первого года они совпали случайно, норматив 20% тот же."},{"id":"v2-p1","source":"Прошлый год, вариант 2, задача 1","level":"прошлый год","text":"Компания \"PrazdnikOn\" планирует организовать проведение праздничных мероприятий инновационного формата. Для этого компания инвестировала 5000000 рублей в приобретение необходимого оборудования. Плановые продажи компании - 50 шт. Целевая рентабельность 25%. Для проведение одного мероприятия издержки составляют 50000. Рассчитайте минимальную цену, которую необходимо установить за проведение мероприятия, методом расчета цены с ориентацией на целевую рентабельность инвестиций.","formula_id":"f-roi","asks":[{"label":"Минимальная цена мероприятия","value":75000,"unit":"руб.","tol":1}],"steps":["Метод назван в условии: целевая рентабельность инвестиций, Л3, сл. 48: P = UC + ROI × I / Q.","Прибыль на мероприятие: 0,25 × 5 000 000 / 50 = 1 250 000 / 50 = 25 000 руб.","P = 50 000 + 25 000 = 75 000 руб."],"answer_text":"75 000 руб. за мероприятие.","trap":"ROI умножай на сумму инвестиций и дели на план продаж (50 мероприятий)."},{"id":"v2-p2","source":"Прошлый год, вариант 2, задача 2","level":"прошлый год","text":"Компания «Динь» занимается производством маркерных досок предназначенных для университетов и школ. Прямые издержки на воспроизводство маркерной доски составляют 2000 руб., в расчете на год на него отнесено 100 000 руб. накладных расходов фирмы. Перед менеджерами была поставлена задача: получить прибыль в размере 180 000 руб. при годовом плане продаж в 400 шт. Какая должна быть установлена цена?","formula_id":"f-model1","asks":[{"label":"Цена доски","value":2700,"unit":"руб.","tol":0.5}],"steps":["Прямые затраты на доску, накладные и прибыль за год, план продаж: модель расчета №1, Л3, сл. 46.","(100 000 + 180 000) / 400 = 280 000 / 400 = 700 руб. на доску.","P = 2 000 + 700 = 2 700 руб."],"answer_text":"2 700 руб.","trap":"Прямые 2 000 уже на одну доску: в скобки их не добавляй, там только накладные и прибыль за год."},{"id":"v2-p3","source":"Прошлый год, вариант 2, задача 3","level":"прошлый год","text":"Компания \"ЭкоБлокнот\" занимается производством и продажей экологичных блокнотов, изготовленных из переработанной бумаги. Полные издержки на производство одного блокнота: 200 руб. Компания использует норматив рентабельности к издержкам в размере 25%. Руководство компании хочет, чтобы розничная цена блокнота была не ниже 300 руб., чтобы сохранить конкурентоспособность на рынке. Определите цену.\nРассчитайте новую цену, если \"ЭкоБлокнот\" предлагает скидку 10% на оптовые заказы от 100 блокнотов.","formula_id":"f-ptc","asks":[{"label":"Цена по нормативу рентабельности","value":250,"unit":"руб.","tol":0.5},{"label":"Итоговая розничная цена","value":300,"unit":"руб.","tol":0.5},{"label":"Цена блокнота со скидкой 10%","value":270,"unit":"руб.","tol":0.5},{"label":"Сумма за 100 блокнотов со скидкой","value":27000,"unit":"руб.","tol":1}],"steps":["В условии норматив рентабельности к издержкам: P = UC × (1 + PTC_UC), Л3, сл. 45.","P = 200 × 1,25 = 250 руб.","Руководство хочет розничную цену не ниже 300 руб.: 250 \u003c 300, итоговая цена 300 руб.","Скидка 10% на заказ от 100 штук: 300 × (1 − 0,10) = 270 руб. за блокнот.","За 100 блокнотов: 270 × 100 = 27 000 руб."],"answer_text":"Цена 300 руб. (расчётная 250 ниже порога). Оптом от 100 штук 270 руб. за блокнот, 27 000 руб. за 100.","trap":"Порядок шагов: цена по нормативу 250, потом нижняя граница руководства 300, потом скидка 10% на опт от 100 штук. Скидку бери от цены продажи 300: 300 × 0,9 = 270 руб. Расчётные 250 только промежуточный шаг, по ним блокнот не продают, поэтому 250 × 0,9 = 225 неверно. Порог «не ниже 300» относится к розничной цене, оптовая цена со скидкой может быть ниже.","ambiguity":"У однокурсника два решения: 200 × 1,25 = 250 (стр. 19 и 52) и 200 / (1 − 0,25) = 266,67 (стр. 41). Берём 250: в условии «норматив рентабельности к издержкам», это PTC_UC с Л3, сл. 45. Деление на (1 − 0,25) это модель №2 для рентабельности продаж (Л3, сл. 47): итог 300 тот же, но формула другая."},{"id":"v3-p1","source":"Прошлый год, вариант 3, задача 1","level":"прошлый год","text":"Компании «Всё для дома» был предложен продукт «лампы накаливания», которые производит компания с конечно розничной ценой равной 150 рублей за штуку. Поставщик предлагает приобрести партию за 150 000 руб. за 1000 ламп. При этом поставщик хотел бы получить 80 000 руб. Торговая скидка фирмы А 20%. Цена поставки продукт В должна быть не выше 120 000 руб. Поставщик желает задать цену конечных продаж и продавцу надо определить цену поставки, по которой он согласится товар взять, чтобы добиться получения желаемой величины торговой скидки.","formula_id":"f-trade2","asks":[{"label":"Цена поставки за 1 лампу","value":120,"unit":"руб.","tol":0.5},{"label":"Цена поставки за партию 1 000 ламп","value":120000,"unit":"руб.","tol":1}],"steps":["Конечную цену задаёт поставщик, продавец ищет цену поставки: ситуация 2, Л3, сл. 50: P_P = P_S × (1 − M_SP).","За лампу: 150 × (1 − 0,20) = 120 руб.","За партию: 120 × 1 000 = 120 000 руб. (то же 150 000 × 0,8)."],"answer_text":"Цена поставки не выше 120 руб. за лампу, 120 000 руб. за партию 1 000 штук.","trap":"80 000, «фирма А» и «продукт В» перенесены из примера слайда, в расчёт не идут. P_S это конечная цена 150, P_P цена поставки 120: у однокурсника в определениях они переставлены, расчёт верный.","ambiguity":"Условие склеено с примером слайда. Предложение поставщика 150 000 за партию равно розничной стоимости 1 000 ламп: при нём скидка магазина 0%. Ответ совпадает с фразой из условия «не выше 120 000 руб.»."},{"id":"v3-p2","source":"Прошлый год, вариант 3, задача 2","level":"прошлый год","text":"Компания \"Dresscode\" занимается продажей женской одежды. Поставщик предлагает им коллекцию платьев, с установленной рекомендованной ценой в 15 000 рублей. Компания планирует продавать эти платья со скидкой 25%. Рассчитайте цену продажи после скидки.","formula_id":"f-discount","asks":[{"label":"Цена продажи после скидки","value":11250,"unit":"руб.","tol":0.5}],"steps":["Скидка 25% от рекомендованной цены: P = P₀ × (1 − d).","P = 15 000 × (1 − 0,25) = 15 000 × 0,75 = 11 250 руб."],"answer_text":"11 250 руб.","trap":"Скидку считай от рекомендованной цены 15 000, это база.","ambiguity":"Если 25% читать как торговую скидку магазина, это ситуация 2 (Л3, сл. 50): цена поставки P_P = 15 000 × (1 − 0,25) = 11 250 руб. Число то же, ответ не меняется."},{"id":"v3-p3","source":"Прошлый год, вариант 3, задача 3","level":"прошлый год","text":"Стартап компания \"ЭкоБуст\" разрабатывает революционный экологичный гаджет, который превращает пищевые отходы в компост. Они уже стремятся запустить свой продукт на рынке и должны определить оптимальную цену продажи и рассчитать целевую прибыльность.\nДля этого дана информация:\nИнвестиции: 10 миллионов руб.\nЗапланированное производство: 5000 ед. в год.\nЦелевая прибыльность: 25% инвестиций.\nПолные производственные затраты:\nСтоимость материала на единицу: 400 руб.\nСтоимость труда за единицу: 200 руб.\nЗатраты на маркетинг и распределение: 500 000 руб. в год.","formula_id":"f-roi","asks":[{"label":"Удельные полные издержки","value":700,"unit":"руб.","tol":0.5},{"label":"Цена продажи","value":1200,"unit":"руб.","tol":0.5},{"label":"Целевая прибыль за год","value":2500000,"unit":"руб.","tol":1},{"label":"Доля прибыли в цене (рентабельность продаж)","value":41.67,"unit":"%","tol":0.05}],"steps":["Полные затраты на единицу: материал 400 + труд 200 + маркетинг 500 000 / 5 000 = 100. UC = 700 руб.","Цена по целевой рентабельности инвестиций, Л3, сл. 48: P = UC + ROI × I / Q.","0,25 × 10 000 000 / 5 000 = 2 500 000 / 5 000 = 500 руб. на единицу.","P = 700 + 500 = 1 200 руб.","Целевая прибыль: 25% × 10 000 000 = 2 500 000 руб. в год, 500 руб. на единицу.","Доля прибыли в цене: 500 / 1 200 = 41,67%."],"answer_text":"Цена 1 200 руб.; целевая прибыль 2 500 000 руб. в год (500 руб. на единицу, 41,67% цены).","trap":"Маркетинг и распределение входят в полную себестоимость (Л3, сл. 6). Без них UC = 600 и цена 1 100: так ошибся однокурсник в варианте 3.","ambiguity":"1) Маркетинг: в варианте 3 однокурсник взял UC = 600 и цену 1 100, в варианте 4 UC = 700 и 1 200. Берём 1 200: строка маркетинга стоит под «Полные производственные затраты», а полная себестоимость включает расходы на реализацию (Л3, сл. 6). 2) «Рассчитать целевую прибыльность»: 25% инвестиций уже даны, считаем их в рублях: 2 500 000 руб. в год. Если нужен процент от цены, это 41,67%. Ответ однокурсника 45% получен из неверной цены 1 100 по модели №2: 1 − 600 / 1 100 = 45,45%."},{"id":"v4-p1","source":"Прошлый год, вариант 4, задача 1","level":"прошлый год","text":"Компания «БиоМир» занимается производством биоразлагаемых бутылок. Себестоимость одной бутылки составляет 1500 руб (прямые издержки). За год на управление проектом и маркетинг выделено 200 000 руб., а также в планы компании входит получить чистую прибыль в разме
