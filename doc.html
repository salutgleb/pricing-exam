/* app.css — оболочка и компоненты hanyu 0.3 (интерфейс по замерам Duolingo, статистика — LiveSchool).
 *
 * Замеры (R4_duolingo_ux.md [doc] + кадры R4_frames, пересчёт к ширине 1280; кадры 360p, точность ±2 px):
 * ┌──────────────────────────────┬────────────────────────────────────────────────────────────┐
 * │ 3D-кнопка                    │ высота 50 (+губа 4), радиус 16, 15px/800 ПРОПИСНЫЕ, .8px    │
 * │                              │ трекинг; нажатие translateY(4); hover brightness(1.1)       │
 * │ ПРОВЕРИТЬ на вебе (кадр)     │ ≈336×54 вместе с губой; ПРОПУСТИТЬ — контурная, та же высота│
 * │ Плитка ответа / банка        │ рамка 2 + низ 4, радиус 12–16, поля 13×16, высота ≈49       │
 * │ Полоса прогресса             │ 16 px, дорожка #E5E5E5 / #37464F, блик 4–5 px сверху        │
 * │ Крестик закрытия             │ ≈24 px, цвет #AFAFAF                                        │
 * │ Заголовок задания            │ 24/32, 800 (cap ≈17 на кадре)                               │
 * │ Узел пути                    │ лицо ≈70×62, губа 8; шаг по вертикали ≈90, вбок 0,±44,±88   │
 * │ Баннер раздела               │ ≈100 с губой, поля 16, строка 1 — 13px ПРОПИСНЫЕ, строка 2 — 22 │
 * │ Пузырь «Начать»              │ текст ≈13–15px 800 ПРОПИСНЫЕ, рамка 2 #E5E5E5, хвостик вниз  │
 * │ Веб-раскладка                │ меню 256 + колонка ≤600 + отступ 48 + правая колонка 368    │
 * │ Карточки правой колонки      │ рамка 2 #E5E5E5, радиус 16, поля 16–24; полоса задания 20   │
 * │ Итог урока: карточки         │ ≈116×69 на кадре, зазор ≈27 → 3 карточки, рамка 2 цветом    │
 * │ LiveSchool, карточки цифр    │ фон-пастель + рамка 2 тоном, радиус 16, поля 28, цифра 44–52│
 * │ LiveSchool, таблетки         │ радиус 999, рамка 2, поля 12×32, тень 0 2 8 rgba(16,30,87,.3)│
 * └──────────────────────────────┴────────────────────────────────────────────────────────────┘
 */

:root {
  /* Цвет марки — бордо (Глеб, 17.10.2026: «не будем делать столь очевидный дизайн дуолинго, чуть чуть поменяем
     под китай», из сравнения трёх вариантов «выбираем этот»). Имя --owl осталось от замеров Duolingo: это «главный
     цвет» (кнопки, прогресс, «сделано»). «Верно» — нефрит --jade, «неверно» — малиновый --cardinal: при красной
     марке правильный и неправильный ответ не должны совпасть по цвету. */
  /* Синий Duolingo заменён золотом #C69A45 (Глеб, 17.10.2026: «цвет выбери этот вместо синих элементов #C69A45»):
     --macaw (выбор, динамики, ссылки), --sel-*, --t-blue-*, раздел .u-c2. Имена токенов прежние. */
  --snow: #fff; --polar: #f7f7f7; --swan: #e5e5e5; --hare: #afafaf; --wolf: #777; --eel: #4b4b4b; --ink: #3c3c3c;
  --owl: #741f1f; --owl-lip: #541515; --mask: #9a3a32; --macaw: #c69a45; --macaw-lip: #9e7a32;
  --jade: #2e8b62; --jade-lip: #22694a;
  --cardinal: #d6455d; --cardinal-lip: #b02f46; --fox: #ff9600; --fox-lip: #cd7900; --bee: #ffc800; --bee-lip: #e5a500;
  --gold: #faa919; --beetle: #ce82ff; --beetle-lip: #a568cc; --humpback: #a5802f; --seal: #741f1f; --seal-lip: #541515;
  --sel-bg: #f7eedb; --sel-line: #dfc187; --ok-bg: #e3f2e9; --ok-ink: #24704f; --bad-bg: #fde6ea; --bad-ink: #b02f46;
  --navy: #101e57; --navy-2: #4a5578;
  --page: var(--snow); --card: var(--snow); --line: var(--swan); --muted: var(--wolf); --text: var(--eel); --head: var(--ink);
  --lip: 4px; --r: 16px; --r-tile: 14px;
  --font: Nunito, "Nunito Fallback", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  --cjk: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --t-yellow-bg: #fffaeb; --t-yellow-line: #fde3a3; --t-yellow: #f4b03d;
  --t-lav-bg: #f5f3ff; --t-lav-line: #cbc6fb; --t-lav: #6f71ee;
  --t-peach-bg: #fef4ea; --t-peach-line: #f8cfa9; --t-peach: #f08733;
  --t-mint-bg: #eef7f1; --t-mint-line: #a9d8bb; --t-mint: #3f8f5f;
  --t-blue-bg: #fbf5e8; --t-blue-line: #ead5a8; --t-blue: #a97f2e;
  --t-rose-bg: #fff1f3; --t-rose-line: #ffc2cf; --t-rose: #e5486b;
  --grid: rgba(16, 30, 87, .045);
  --shadow: 0 2px 8px rgba(16, 30, 87, .08);
  /* Кривые cut-the-curve (motion.js EASE — те же значения):
   * --ease-out4  power4.out  вход после среза, waterfall вариантов, подъём листа ответа, полоса прогресса
   * --ease-in4   power4.in   выход экрана/задания до среза
   * --ease-expo  expo.out    толчок по Z из узла пути, удар «+XP» в счётчик
   * --ease-in3   power3.in   разгон nudge-кривой, уход по Z
   * --ease-back  back.out    отпускание объёмной кнопки, печать «好», выбор плитки */
  --ease-out4: cubic-bezier(.22, 1, .36, 1); --ease-in4: cubic-bezier(.64, 0, .78, 0);
  --ease-expo: cubic-bezier(.16, 1, .3, 1); --ease-in3: cubic-bezier(.5, 0, .75, 0); --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
:root.kaiti { --cjk: "Kaiti SC", "STKaiti", KaiTi, "Baoli SC", serif; }

    --grid: rgba(220, 230, 236, .035); --shadow: 0 2px 10px rgba(0, 0, 0, .35);

  }

/* ------------------------------------------------------------------ основа */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--page); color: var(--text);
  font: 600 17px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--macaw); text-decoration: none; }
h1, h2, h3, p { margin: 0; }
.zh { font-family: var(--cjk); font-weight: 400; letter-spacing: 0; }
.py { color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--macaw); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

/* ------------------------------------------------------------------ 3D-кнопки */

.btn {
  --face: var(--owl); --lipc: var(--owl-lip); --fg: #fff;
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; margin-bottom: var(--lip); border: 0; border-radius: var(--r);
  background: var(--face); color: var(--fg); box-shadow: 0 var(--lip) 0 var(--lipc);
  font: 800 15px/1 var(--font); letter-spacing: .8px; text-transform: uppercase; white-space: nowrap;
  transition: transform .08s ease-out, box-shadow .08s ease-out, filter .15s; touch-action: manipulation; user-select: none;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled), .btn.is-pressed { transform: translateY(var(--lip)); box-shadow: 0 0 0 var(--lipc); }
.btn:disabled { --face: var(--swan); --lipc: transparent; --fg: var(--hare); cursor: default; box-shadow: none; }
.btn.is-wide { width: 100%; }
.btn.is-small { min-height: 38px; padding: 0 14px; font-size: 13px; border-radius: 12px; --lip: 3px; }
.btn.is-blue { --face: var(--macaw); --lipc: var(--macaw-lip); }
.btn.is-red { --face: var(--cardinal); --lipc: var(--cardinal-lip); }
.btn.is-orange { --face: var(--fox); --lipc: var(--fox-lip); }
.btn.is-purple { --face: var(--beetle); --lipc: var(--beetle-lip); }
.btn.is-gold { --face: var(--bee); --lipc: var(--bee-lip); --fg: #5c3d00; }
.btn.is-seal { --face: var(--seal); --lipc: var(--seal-lip); }
.btn.is-ghost, .btn.is-outline {
  --face: var(--card); --lipc: var(--line); --fg: var(--macaw); border: 2px solid var(--line); box-shadow: 0 var(--lip) 0 var(--line);
}
.btn.is-ghost { --fg: var(--muted); }
.btn.is-outline:active:not(:disabled), .btn.is-ghost:active:not(:disabled) { box-shadow: 0 0 0 var(--line); }
.btn .ic { flex: none; }

/* таблетки LiveSchool: ссылки и вторичные действия вне урока */
.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 16px; border: 2px solid var(--line);
  border-radius: 999px; background: var(--card); color: var(--head); font: 800 14px/1.2 var(--font); white-space: nowrap;
}
.pill.is-navy { background: var(--navy); border-color: var(--navy); color: var(--page); box-shadow: 0 2px 8px rgba(16, 30, 87, .3); }
.pill.is-on { background: var(--sel-bg); border-color: var(--sel-line); color: var(--macaw); }
.pill .ic { width: 18px; height: 18px; }

/* ------------------------------------------------------------------ карточки, полоски, кольца */

.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 20px; }
.card + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title { color: var(--head); font: 800 20px/1.2 var(--font); }
.card-link { color: var(--macaw); font: 800 14px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; background: none; border: 0; padding: 6px 0; }

.tint { border-radius: var(--r); border: 2px solid var(--tl); background: var(--tb); padding: 24px 22px; color: var(--navy); }
.tint.yellow { --tb: var(--t-yellow-bg); --tl: var(--t-yellow-line); --tc: var(--t-yellow); }
.tint.lav { --tb: var(--t-lav-bg); --tl: var(--t-lav-line); --tc: var(--t-lav); }
.tint.peach { --tb: var(--t-peach-bg); --tl: var(--t-peach-line); --tc: var(--t-peach); }
.tint.mint { --tb: var(--t-mint-bg); --tl: var(--t-mint-line); --tc: var(--t-mint); }
.tint.blue { --tb: var(--t-blue-bg); --tl: var(--t-blue-line); --tc: var(--t-blue); }
.tint.rose { --tb: var(--t-rose-bg); --tl: var(--t-rose-line); --tc: var(--t-rose); }
.stat-num { color: var(--tc); font: 900 46px/1 var(--font); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.stat-label { color: var(--tc); font: 800 15px/1.3 var(--font); margin-top: 8px; }
.stat-sub { color: var(--navy-2); font: 600 14px/1.35 var(--font); margin-top: 10px; }

.bar { position: relative; height: 16px; border-radius: 999px; background: var(--swan); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--owl); transition: width .5s cubic-bezier(.22, 1, .36, 1); }
.bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .3); }
.bar > b { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 800 12px/1 var(--font); text-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
.bar.gold > i { background: var(--bee); }
.bar.gold > b { color: #8a5a00; text-shadow: none; }
.bar.blue > i { background: var(--macaw); }
.bar.thin { height: 10px; }
.bar.thin > i::after { display: none; }

.ring .ring-track { stroke: var(--swan); }
.ring .ring-fill { stroke: var(--fox); transition: stroke-dashoffset .8s cubic-bezier(.22, 1, .36, 1); }
.ring.green .ring-fill { stroke: var(--owl); }
.ring.gold .ring-fill { stroke: var(--bee); }

.steps { display: inline-flex; gap: 3px; vertical-align: middle; }
.steps i { width: 9px; height: 6px; border-radius: 3px; background: var(--swan); }
.steps i.on { background: var(--owl); }
.steps i.na { background: transparent; box-shadow: inset 0 0 0 1.5px var(--swan); }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font: 800 12px/1.4 var(--font); letter-spacing: .3px; background: var(--polar); color: var(--muted); white-space: nowrap; }
.chip.is-known { background: var(--ok-bg); color: var(--ok-ink); }
.chip.is-marked { background: var(--t-yellow-bg); color: #b9790c; box-shadow: inset 0 0 0 1.5px var(--t-yellow-line); }
.chip.is-learning { background: var(--sel-bg); color: var(--macaw-lip); }
.chip.is-new { background: var(--polar); color: var(--muted); }
.chip.is-ignored { background: transparent; color: var(--hare); box-shadow: inset 0 0 0 1.5px var(--swan); }

/* ------------------------------------------------------------------ оболочка */

.shell { min-height: 100vh; overflow-x: clip; }   /* карточка разбора, улетая, не раздвигает страницу вбок */
.main { position: relative; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
.side, .rail { display: none; }

.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  height: 60px; padding: 0 16px; padding-top: env(safe-area-inset-top); background: var(--page); border-bottom: 2px solid var(--line);
}
.top-stats { display: flex; align-items: center; gap: 4px; }
.stat-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-radius: 12px;
  background: none; font: 800 17px/1 var(--font); color: var(--hare); font-variant-numeric: tabular-nums;
}
.stat-btn:hover { background: var(--polar); }
.stat-btn .ic { width: 26px; height: 26px; }
.stat-btn.is-flame { color: var(--fox); }
.stat-btn.is-flame.off { color: var(--hare); }
.stat-btn.is-xp { color: var(--bee); }
.stat-btn.is-known { color: var(--macaw); }
.xp-ring { position: relative; display: grid; place-items: center; width: 30px; height: 30px; }
.xp-ring .ic { position: absolute; width: 16px; height: 16px; color: var(--bee); }

.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--head); font: 900 26px/1 var(--font); letter-spacing: -.5px; }
.logo-seal {
  display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--seal); color: #fff;
  box-shadow: 0 3px 0 var(--seal-lip); font: 400 24px/1 var(--cjk); transform: rotate(-4deg);
}
.top .logo-seal { width: 34px; height: 34px; font-size: 21px; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--page); border-top: 2px solid var(--line);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 4px; border: 2px solid transparent;
  border-radius: 14px; background: none; color: var(--hare); font: 800 11px/1.1 var(--font); letter-spacing: .2px;
}
.tab .ic { width: 28px; height: 28px; }
.tab.is-on { background: var(--sel-bg); border-color: var(--sel-line); color: var(--macaw); }
.tab:not(.is-on):hover { background: var(--polar); }

@media (min-width: 1000px) {
  .shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); }
  .shell.has-rail { grid-template-columns: 256px minmax(0, 1fr) 416px; }
  .top, .tabs { display: none; }
  .side {
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 24px 16px;
    border-right: 2px solid var(--line); overflow-y: auto;
  }
  .side .logo { padding: 8px 16px 30px; }
  .side-link {
    display: flex; align-items: center; gap: 18px; height: 54px; padding: 0 16px; border: 2px solid transparent; border-radius: 12px;
    background: none; color: var(--muted); font: 800 15px/1 var(--font); letter-spacing: .8px; text-transform: uppercase; text-align: left;
  }
  .side-link .ic { width: 32px; height: 32px; color: var(--hare); }
  .side-link:hover { background: var(--polar); }
  .side-link.is-on { background: var(--sel-bg); border-color: var(--sel-line); color: var(--macaw); }
  .side-link.is-on .ic { color: var(--macaw); }
  .main { width: 100%; max-width: 648px; padding: 24px 24px 64px; }
  .rail { display: block; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 24px 48px 24px 0; }
  .rail-stats { display: flex; justify-content: space-between; margin-bottom: 24px; padding: 0 4px; }
  /* Экран без правой колонки: иначе она уходит во второй ряд сетки под меню и при прокрутке наезжает на него
     (Глеб, 16.10: «если вниз проскроллить - интерфейс наезжает на менюшку слева»). */
  .shell:not(.has-rail) .rail { display: none; }
}

/* 1000–1199: на три колонки по замерам (256 + 600 + 48 + 368) места нет — меню сворачивается до иконок. */
@media (min-width: 1000px) and (max-width: 1199px) {
  .shell { grid-template-columns: 88px minmax(0, 1fr); }
  .shell.has-rail { grid-template-columns: 88px minmax(0, 1fr) 392px; }
  .side { padding: 24px 12px; align-items: center; }
  .side .logo { padding: 8px 0 30px; }
  .side .logo > span:not(.logo-seal), .side-link > span { display: none; }
  .side-link { justify-content: center; width: 56px; padding: 0; gap: 0; }
  .rail { padding: 24px 24px 24px 0; }
}

/* ------------------------------------------------------------------ тосты и листы */

.toasts { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 70; transform: translateX(-50%); display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px;
  background: var(--head); color: var(--page); font: 800 15px/1.3 var(--font); box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  pointer-events: auto; animation: toast-in .25s cubic-bezier(.22, 1, .36, 1);
}
.toast.out { opacity: 0; transform: translateY(8px); transition: .2s; }
.toast-act { border: 0; background: none; color: var(--sel-line); font: 800 14px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; padding: 6px 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }

.sheet { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0); transition: background .2s; }
.sheet.in { background: rgba(0, 0, 0, .45); }
.sheet.out { background: rgba(0, 0, 0, 0); }
.sheet-panel {
  position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 28px 20px calc(20px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0; background: var(--card); transform: translateY(100%); transition: transform .28s cubic-bezier(.22, 1, .36, 1);
}
.sheet.in .sheet-panel { transform: none; }
.sheet.out .sheet-panel { transform: translateY(100%); }
.sheet-x { position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; background: none; color: var(--hare); }
.sheet-x:hover { background: var(--polar); }
.sheet-title { color: var(--head); font: 800 24px/1.25 var(--font); padding-right: 40px; }
.sheet-text { margin-top: 10px; color: var(--muted); }
.sheet-actions { display: grid; gap: 12px; margin-top: 24px; }
@media (min-width: 700px) {
  .sheet { align-items: center; }
  .sheet-panel { border-radius: 24px; transform: translateY(24px) scale(.97); opacity: 0; transition: transform .25s cubic-bezier(.22, 1, .36, 1), opacity .2s; }
  .sheet.in .sheet-panel { transform: none; opacity: 1; }
}

canvas.confetti { position: fixed; inset: 0; z-index: 95; width: 100vw; height: 100vh; pointer-events: none; }

/* ------------------------------------------------------------------ общие блоки страниц */

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 0 20px; }
.page-title { color: var(--head); font: 800 28px/1.15 var(--font); letter-spacing: -.2px; }
.page-sub { color: var(--muted); font: 600 15px/1.4 var(--font); margin-top: 4px; }
.section-title { color: var(--head); font: 800 22px/1.2 var(--font); margin: 32px 0 14px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.grid-back { position: relative; }
.grid-back::before {
  content: ""; position: absolute; inset: -16px -16px auto; height: 360px; pointer-events: none; z-index: -1;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---- views.css ---- */
/* views.css — экраны: путь (баннеры, змейка узлов, герой «Дальше»), карточки колонки, «Сегодня»,
 * «Практика», подборки, разбор, грамматика, иероглифы, «Я». */

.u-c0 { --uc: var(--owl); --ul: var(--owl-lip); --ut: #f1dcdc; }   /* первый раздел — цвет марки (бордо, 17.10) */
.u-c1 { --uc: #ce82ff; --ul: #a568cc; --ut: #f3e3ff; }
.u-c2 { --uc: #c69a45; --ul: #9e7a32; --ut: #f7eedb; }   /* бывший синий → золото #C69A45 (Глеб, 17.10) */
.u-c3 { --uc: #ff9600; --ul: #cd7900; --ut: #ffe9cc; }
.u-c4 { --uc: #ff5f99; --ul: #d9447a; --ut: #ffe1ec; }
.u-c5 { --uc: #00c4a0; --ul: #009c80; --ut: #ccf5ec; }
.btn.is-white { --face: #fff; --lipc: rgba(0, 0, 0, .16); --fg: var(--uc, var(--macaw)); }
.btn.is-white:active:not(:disabled) { box-shadow: 0 0 0 transparent; }

/* ------------------------------------------------------------------ путь */

.hero {
  position: relative; display: grid; gap: 14px; margin: 4px 0 8px; padding: 20px 20px 22px; border-radius: 18px; background: var(--uc); color: #fff;
  box-shadow: 0 4px 0 var(--ul); overflow: hidden;
}
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, .1); pointer-events: none; }
.hero-line { font: 800 13px/1 var(--font); letter-spacing: .8px; text-transform: uppercase; opacity: .85; }
.hero-title { margin-top: 6px; font: 800 24px/1.2 var(--font); }
.hero-sub { margin-top: 4px; font: 600 15px/1.3 var(--font); opacity: .9; }
.fan { position: relative; height: 104px; margin: 4px 0 2px; }
.fan-card {
  position: absolute; left: 50%; bottom: 0; display: grid; place-items: center; width: 70px; height: 88px; margin-left: -35px; border-radius: 14px;
  background: #fff; color: var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, .14); transform-origin: 50% 120%;
  transform: translateX(calc(var(--i) * 60px)) rotate(calc(var(--i) * 6deg)) translateY(calc(var(--i) * var(--i) * 3px));
}
@media (max-width: 380px) { .fan-card { transform: translateX(calc(var(--i) * 54px)) rotate(calc(var(--i) * 6deg)) translateY(calc(var(--i) * var(--i) * 3px)); } }
.fan-card .zh { font-size: 34px; line-height: 1; white-space: nowrap; }
.fan-card.l2 .zh { font-size: 25px; }
.fan-card.l3 .zh { font-size: 18px; }
.fan-card.l4 .zh { font-size: 14px; }
.hero-go { margin-top: 2px; }

.unit { margin-top: 28px; }
.unit-banner {
  position: sticky; top: 72px; z-index: 6; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px;
  min-height: 88px; padding: 14px 14px 14px 18px; border-radius: 16px; background: var(--uc); color: #fff; box-shadow: 0 4px 0 var(--ul);
}
.unit-line { font: 800 13px/1.2 var(--font); letter-spacing: .8px; text-transform: uppercase; opacity: .88; }
.unit-title { margin-top: 4px; font: 800 21px/1.2 var(--font); overflow-wrap: anywhere; }
.unit-note { margin-top: 4px; font: 600 14px/1.3 var(--font); }
.unit-banner.is-empty { background: var(--polar); color: var(--muted); box-shadow: 0 4px 0 var(--line); }
.unit-banner.is-empty .guide { color: var(--muted); border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
.guides { display: flex; gap: 8px; }
.guide {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 2px solid rgba(0, 0, 0, .14); border-radius: 14px;
  color: #fff; font: 800 14px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; box-shadow: 0 3px 0 rgba(0, 0, 0, .14);
}
.guide:hover { background: rgba(255, 255, 255, .1); }
.guide:active { transform: translateY(3px); box-shadow: none; }
.guide.is-icon { padding: 0 10px; }
.unit-toggle { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(0, 0, 0, .1); color: inherit; transition: transform .25s var(--ease-out4); }
.unit-toggle.is-open { transform: rotate(180deg); }
@media (max-width: 440px) { .guide span { display: none; } .guide { padding: 0 10px; } }
@media (min-width: 1000px) { .unit-banner { top: 16px; } }

.path-nodes { position: relative; margin: 56px 0 8px; }
.node-slot { position: absolute; left: calc(50% + var(--x)); display: grid; place-items: center; width: 108px; height: 96px; margin-left: -54px; }
.node-ring-wrap { position: absolute; inset: -4px 0 auto 0; display: grid; place-items: center; pointer-events: none; }
.node-ring-wrap .ring { width: 108px; height: 108px; }
.ring.node-ring .ring-track { stroke: var(--swan); stroke: color-mix(in srgb, var(--uc) 22%, transparent); }
.ring.node-ring .ring-fill { stroke: var(--uc); }
.node {
  position: relative; z-index: 1; display: grid; place-items: center; width: 76px; height: 68px; margin-bottom: 8px; padding: 0; border: 0;
  border-radius: 50%; background: var(--uc); color: #fff; box-shadow: 0 8px 0 var(--ul); transition: transform .1s, box-shadow .1s, filter .15s;
}
.node:hover { filter: brightness(1.06); }
.node:active { transform: translateY(8px); box-shadow: 0 0 0 var(--ul); }
.node .ic { filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .12)); }
.node.is-fresh { background: var(--swan); color: var(--hare); box-shadow: 0 8px 0 #b7b7b7; }
.node.is-fresh .ic { filter: none; }
.node.is-gold { background: var(--bee); box-shadow: 0 8px 0 var(--bee-lip); color: #fff; }
@media (prefers-color-scheme: dark) { .node.is-fresh { box-shadow: 0 8px 0 #24323a; } }
.start-bubble {
  position: absolute; z-index: 2; top: -40px; left: 50%; padding: 9px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card);
  color: var(--uc); font: 800 15px/1 var(--font); letter-spacing: .8px; text-transform: uppercase; white-space: nowrap;
  transform: translateX(-50%); animation: cue 1.15s var(--ease-out4) infinite alternate; pointer-events: none;
}
.start-bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -6px; background: var(--card);
  border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg);
}
@keyframes cue { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -6px); } }
.node-pop {
  position: absolute; z-index: 8; top: 92px; left: 50%; width: 288px; margin-left: -144px; padding: 16px; border-radius: 16px; background: var(--uc); color: #fff;
  box-shadow: 0 4px 0 var(--ul), 0 10px 24px rgba(0, 0, 0, .12);
}
.node-pop::before { content: ""; position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; background: var(--uc); transform: rotate(45deg); border-radius: 3px; }
.node-pop-title { font: 800 19px/1.2 var(--font); }
.node-pop-sub { margin: 4px 0 14px; font: 600 15px/1.3 var(--font); opacity: .9; }
.unit-mark { position: absolute; top: 34%; left: calc(50% + var(--side) * 168px); margin-left: -60px; color: var(--uc); font-size: 120px; line-height: 1; opacity: .1; pointer-events: none; user-select: none; }
@media (max-width: 420px) { .unit-mark { left: calc(50% + var(--side) * 128px); font-size: 96px; } }

/* ------------------------------------------------------------------ карточки колонки */

.goal-body { display: flex; align-items: center; gap: 18px; }
.goal-ring { position: relative; display: grid; place-items: center; flex: none; }
.goal-ring > span { position: absolute; color: var(--bee); }
.goal-num { color: var(--head); font: 600 17px/1.2 var(--font); }
.goal-num b { font: 900 30px/1 var(--font); }
.goal-body .muted { margin-top: 6px; font-size: 15px; }
.streak-top { display: flex; align-items: center; gap: 14px; }
.streak-flame { color: var(--fox); }
.streak-flame.off { color: var(--hare); }
.streak-num { color: var(--head); font: 600 17px/1.2 var(--font); }
.streak-num b { font: 900 28px/1 var(--font); color: var(--fox); }
.streak-top .muted { margin-top: 4px; font-size: 15px; }
.streak-bank { display: flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--macaw); font: 800 14px/1 var(--font); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 16px 0 0; padding: 0; list-style: none; }
.week-day { display: grid; justify-items: center; gap: 6px; color: var(--muted); font: 800 12px/1 var(--font); text-transform: uppercase; }
.week-day i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--polar); border: 2px solid var(--line); color: #fff; }
.week-day.is-qd i { background: var(--fox); border-color: var(--fox-lip); }
.week-day.is-frozen i { background: #a6dcfb; border-color: var(--macaw); }
.week-day.is-today i { border-color: var(--fox); border-style: dashed; }
.week-day.is-today.is-qd i { border-style: solid; }
.week-day.is-today span { color: var(--fox); }
.quests { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.quest { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; }
.quest-ic { display: grid; place-items: center; color: var(--bee); }
.quest-ic.is-flame, .quest-ic.is-path { color: var(--fox); }
.quest-ic.is-brush, .quest-ic.is-cards { color: var(--beetle); }
.quest-ic.is-headphones, .quest-ic.is-tone, .quest-ic.is-repeat { color: var(--macaw); }
.quest-ic.is-target { color: var(--cardinal); }
.quest-title { margin-bottom: 8px; color: var(--head); font: 800 16px/1.25 var(--font); }
.quest .bar { height: 20px; }
.quest-done { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--owl); color: #fff; }
.week-total { color: var(--head); font: 600 17px/1 var(--font); }
.week-total b { font: 900 30px/1 var(--font); }
.week-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 96px; margin: 14px 0 10px; }
.week-bar { display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: 6px; height: 100%; }
.week-bar i { align-self: end; width: 100%; max-width: 28px; min-height: 4px; border-radius: 8px 8px 4px 4px; background: var(--bee); }
.week-bar.is-future i { background: var(--swan); }
.week-bar.is-today i { background: var(--fox); }
.week-bar span { color: var(--muted); font: 800 12px/1 var(--font); text-transform: uppercase; }
.week-card .muted { font-size: 14px; }

.boot-fail { display: grid; justify-items: center; gap: 12px; padding: 80px 24px; text-align: center; }
.small { font-size: 14px; }
.center { text-align: center; }
.back-link { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 8px; color: var(--muted); font: 800 14px/1 var(--font); letter-spacing: .5px; text-transform: uppercase; }
.back-link:hover { color: var(--macaw); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* ------------------------------------------------------------------ «Сегодня» */

.next-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; padding: 18px 18px 18px 20px; border-radius: 18px;
  background: var(--uc); color: #fff; box-shadow: 0 4px 0 var(--ul); }
.next-title { margin-top: 6px; font: 800 20px/1.2 var(--font); }
.next-card .btn { flex: none; }
.today-grid { display: grid; gap: 16px; }
.today-grid .card + .card { margin-top: 0; }
.today-page > .card, .today-page > section { margin-top: 16px; }
.stat-row, .me-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.stat-tile { display: block; color: var(--navy); }
.stat-tile .stat-num { font-size: 40px; }
.anki-due { margin-top: 2px; color: var(--head); font: 600 17px/1.3 var(--font); }
.anki-due b { color: var(--macaw); font: 900 34px/1 var(--font); }
.hw-when { color: var(--head); font: 600 17px/1.3 var(--font); }
.hw-left { color: var(--fox); font: 900 26px/1.1 var(--font); }
.read-title { color: var(--muted); font: 800 15px/1.3 var(--font); }
.read-lines { display: grid; gap: 4px; margin: 10px 0; padding-left: 22px; color: var(--muted); }
.read-line { padding: 4px 6px; border: 0; border-radius: 8px; background: none; color: var(--head); font: 400 20px/1.5 var(--cjk); text-align: left; }
.read-line:hover { background: var(--polar); }
@media (min-width: 600px) { .today-grid { grid-template-columns: 1fr 1fr; } }

/* ------------------------------------------------------------------ «Практика» */

.practice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.practice-tile { display: block; padding: 18px 16px 16px; color: var(--navy); transition: transform .12s var(--ease-out4); }
.practice-tile:hover { transform: translateY(-2px); }
.practice-tile:active { transform: translateY(1px); }
.practice-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.practice-tile .stat-num { font-size: 34px; font-family: var(--font), var(--cjk); }
.practice-ic { color: var(--tc); opacity: .9; }
.practice-tile:last-child:nth-child(odd) { grid-column: 1 / -1; }   /* одна в последнем ряду — во всю ширину */
.deck-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.deck-card { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 12px; padding: 14px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; color: var(--head); background: var(--card); }
.deck-card:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.deck-hz { grid-row: span 2; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--uc); color: #fff; font: 400 22px/1 var(--cjk); box-shadow: 0 3px 0 var(--ul); }
.deck-text { display: grid; min-width: 0; }
.deck-text b { font: 800 16px/1.2 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-text span { color: var(--muted); font: 600 13px/1.3 var(--font); }
.deck-card .bar { grid-column: 2; }
.deck-card .bar > i { background: var(--uc); }
.grammar-link { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; color: var(--head); }
.grammar-link span { display: grid; }
.grammar-link-ic { color: var(--beetle); }
.deck-head { margin: 8px 0 16px; }
.deck-modes { display: grid; gap: 10px; }
.triage-link { margin-top: 14px; }

.word-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
.word-row { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-top: 2px solid var(--line);
  background: var(--card); cursor: pointer; touch-action: pan-y; transition: transform .2s var(--ease-out4), background .15s; }
.word-row:first-child { border-top: 0; }
.word-row:hover { background: var(--polar); }
.word-row.to-known { background: var(--ok-bg); }
.word-row.to-ignore { background: var(--bad-bg); }
.word-hz { min-width: 52px; color: var(--head); font: 400 26px/1.15 var(--cjk); }
.word-main { display: grid; min-width: 0; }
.word-py { color: var(--macaw); font: 800 14px/1.3 var(--font); }
.word-ru { color: var(--text); font: 600 15px/1.3 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.word-side { display: grid; justify-items: end; gap: 6px; }
.word-steps { display: inline-flex; align-items: center; gap: 6px; }
.word-steps small { color: var(--muted); font: 800 11px/1 var(--font); text-transform: uppercase; letter-spacing: .4px; }
.word-sheet { display: grid; justify-items: center; gap: 8px; text-align: center; }
.word-sheet-top { display: flex; align-items: center; gap: 10px; }
.word-sheet-py { color: var(--macaw); font: 800 20px/1 var(--font); }
.word-sheet-hz { color: var(--head); font-size: 72px; line-height: 1.15; }
.word-sheet-ru { color: var(--head); font: 800 18px/1.35 var(--font); }
.word-sheet .intro-ex { text-align: left; }
.word-sheet-steps { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.sheet-actions.is-row { grid-template-columns: 1fr 1fr 1fr; width: 100%; }
.sheet-actions.is-row .btn { padding: 0 8px; }

/* ------------------------------------------------------------------ разбор свайпом */

.triage-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.swipe-stack { position: relative; height: 340px; margin: 8px 0 18px; }
.swipe-card {
  --depth: 0; position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 24px; border: 2px solid var(--line);
  border-bottom-width: 5px; border-radius: 24px; background: var(--card); text-align: center; touch-action: none; user-select: none; cursor: grab;
  transform: translateY(calc(var(--depth) * 10px)) scale(calc(1 - var(--depth) * .04)); transition: transform .25s var(--ease-out4);
}
.swipe-card.is-drag { transition: none; cursor: grabbing; }
.swipe-hz { color: var(--head); font-size: 84px; line-height: 1.1; }
.swipe-py { color: var(--macaw); font: 800 22px/1 var(--font); }
.swipe-ru { max-width: 300px; color: var(--head); font: 800 18px/1.35 var(--font); }
.swipe-topic { color: var(--muted); font: 600 13px/1 var(--font); }
.swipe-stamp { position: absolute; top: 22px; padding: 6px 12px; border: 3px solid; border-radius: 10px; font: 900 18px/1 var(--font); letter-spacing: 1px; text-transform: uppercase; opacity: 0; transition: opacity .12s; }
.swipe-stamp.is-known { left: 20px; color: var(--jade); transform: rotate(-12deg); }
.swipe-stamp.is-ignore { right: 20px; color: var(--cardinal); transform: rotate(12deg); }
.swipe-card.lean-known .swipe-stamp.is-known, .swipe-card.lean-ignore .swipe-stamp.is-ignore { opacity: 1; }
.swipe-card.lean-known { border-color: var(--jade); }
.swipe-card.lean-ignore { border-color: var(--cardinal); }
.swipe-empty { display: grid; place-content: center; justify-items: center; gap: 14px; height: 100%; color: var(--owl); text-align: center; }
.swipe-empty p { max-width: 280px; color: var(--head); font: 800 17px/1.4 var(--font); }
.swipe-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.swipe-actions .btn { padding: 0 10px; }
.check-box { display: grid; gap: 8px; }
.kbd-hint { margin-top: 10px; }
@media (hover: none) { .kbd-hint { display: none; } }
.check-step { color: var(--beetle-lip); font: 800 13px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.check-actions { margin-top: 12px; }

/* ------------------------------------------------------------------ грамматика */

.search-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 0 14px; border: 2px solid var(--line); border-radius: 14px; color: var(--hare); background: var(--polar); }
.search { flex: 1; min-width: 0; height: 48px; border: 0; background: none; color: var(--head); font: 600 16px/1 var(--font), var(--cjk); outline: none; }
.rule-group { margin-bottom: 18px; }
.rule-group-title { margin: 0 0 8px; color: var(--muted); font: 800 13px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.rule-card { padding: 0; overflow: hidden; }
.rule-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-top: 2px solid var(--line); color: var(--hare); }
.rule-row:first-child { border-top: 0; }
.rule-row:hover { background: var(--polar); }
.rule-text { display: grid; gap: 4px; min-width: 0; }
.rule-text b { color: var(--head); font: 800 16px/1.3 var(--font); }
.rule-pattern { color: var(--fox-lip); font: 400 15px/1.3 var(--cjk), var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grammar-article .page-title { margin-top: 6px; }
.formula-card { margin-top: 16px; }
.card-kicker { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; color: var(--muted); font: 800 13px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.formula-gloss { margin-top: 14px; color: var(--head); font: 600 17px/1.45 var(--font); }
.examples { display: grid; gap: 10px; margin: 0 0 20px; padding: 0; list-style: none; }
.example { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; }
.example .speak { width: 40px; height: 40px; border-radius: 12px; }
.example-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ok-bg); color: var(--ok-ink); }
.example.is-bad { border-color: var(--bad-bg); background: var(--bad-bg); }
.example.is-bad .example-mark { background: #fff; color: var(--bad-ink); }
.example.is-bad .example-zh { text-decoration: line-through; text-decoration-color: var(--cardinal); text-decoration-thickness: 2px; }
.example-zh { color: var(--head); font: 400 22px/1.45 var(--cjk); }
.example-zh .hit { padding: 0 2px; border-radius: 4px; background: var(--t-peach-bg); color: var(--fox-lip); box-shadow: inset 0 -2px 0 var(--fox); }
.example-py { color: var(--muted); font: 600 14px/1.35 var(--font); }
.example-ru { color: var(--text); font: 600 15px/1.4 var(--font); }
.example-note { margin-top: 4px; color: var(--bad-ink); font: 800 14px/1.35 var(--font); }
.pitfalls { margin: 0 0 20px; }
.pitfalls .card-kicker { color: var(--t-peach); }
.pitfalls p:last-child { color: var(--navy); font: 600 16px/1.45 var(--font); }

/* ------------------------------------------------------------------ иероглифы */

.filters { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.char-cell { display: grid; justify-items: center; gap: 6px; padding: 10px 4px 8px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; color: var(--head); background: var(--card); }
.char-cell:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.char-glyph { font: 400 30px/1 var(--cjk); }
.cell-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; width: 40px; }
.cell-bar i { height: 5px; border-radius: 3px; background: var(--swan); }
.cell-bar i.on { background: var(--owl); }
.char-cell.lv4 { border-color: var(--bee); }
.char-cell.lv4 .cell-bar i.on { background: var(--bee); }
.char-head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; margin: 8px 0 16px; }
.char-anim { display: grid; place-items: center; width: 200px; height: 200px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; color: var(--head);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 50% 50%; background-position: center; }
.char-big { font: 400 140px/1 var(--cjk); }
.char-py { color: var(--macaw); font: 800 24px/1 var(--font); }
.char-ru { margin-top: 6px; color: var(--head); font: 800 17px/1.35 var(--font); }
.char-actions { display: flex; gap: 8px; margin-top: 14px; }
.char-write { display: flex; justify-content: center; margin: 16px 0; }
.char-write .hw-root { --hw-accent: var(--macaw); --hw-ink: var(--head); --hw-line: var(--line); --hw-surface: var(--card); font-family: var(--font); }
@media (max-width: 440px) { .char-head { grid-template-columns: 1fr; justify-items: center; text-align: center; } .char-actions { justify-content: center; } }

/* ------------------------------------------------------------------ «Я» */

.me-stats { margin-bottom: 16px; }
.me-page > .card, .me-page > section { margin-top: 16px; }
.status-bar { display: flex; height: 18px; border-radius: 999px; overflow: hidden; background: var(--swan); }
.status-bar i, .legend i { display: block; }
.is-verified { background: var(--jade); }
.legend .is-marked, .status-bar .is-marked { background: var(--bee); }
.legend .is-learning, .status-bar .is-learning { background: var(--macaw); }
.legend .is-new, .status-bar .is-new { background: var(--swan); }
.legend .is-ignored, .status-bar .is-ignored { background: var(--hare); }
.legend { display: grid; gap: 6px; margin: 14px 0 10px; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; color: var(--text); font: 600 15px/1.2 var(--font); }
.legend li i { width: 14px; height: 14px; border-radius: 4px; }
.legend b { color: var(--head); font-weight: 900; }
.coverage-pct { color: var(--beetle-lip); font: 900 26px/1 var(--font); }
.coverage-rows { display: grid; gap: 16px; }
.coverage-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; color: var(--head); font: 800 15px/1.2 var(--font); }
.coverage-top .muted { font: 600 13px/1.2 var(--font); text-align: right; }
.cal-head, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-head span { color: var(--muted); font: 800 12px/1 var(--font); text-align: center; text-transform: uppercase; }
.cal { margin-top: 8px; }
.cal-day { display: grid; place-items: center; aspect-ratio: 1; border-radius: 50%; background: var(--polar); color: var(--hare); font: 800 13px/1 var(--font); font-style: normal; }
.cal-day.is-qd { background: var(--fox); color: #fff; }
.cal-day.is-frozen { background: #a6dcfb; color: #fff; }
.cal-day.is-future { background: none; color: var(--swan); }
.cal-day.is-today { box-shadow: inset 0 0 0 2px var(--fox); }
.records { display: grid; gap: 4px; margin: 12px 0 0; padding: 0; list-style: none; }
.records li { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 2px solid var(--line); color: var(--text); }
.records li:first-child { border-top: 0; }
.credits .records li { grid-template-columns: 1fr; gap: 2px; }   /* в «Источниках» нет значка: название и источник столбиком */
.records b { color: var(--head); font-weight: 900; }
.rec-ic { color: var(--fox); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; }
.badge { display: grid; justify-items: center; gap: 4px; text-align: center; }
.badge-ring { position: relative; display: grid; place-items: center; }
.badge-ic { position: absolute; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--polar); color: var(--hare); }
.badge.is-done .badge-ic { background: var(--bee); color: #fff; box-shadow: 0 3px 0 var(--bee-lip); }
.badge b { color: var(--head); font: 800 14px/1.2 var(--font); }
.badge span:last-child { color: var(--muted); font: 600 12px/1.3 var(--font); }
.settings { display: grid; gap: 4px; }
.setting-label { margin: 14px 0 8px; color: var(--muted); font: 800 13px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.segmented { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.segmented button { display: grid; gap: 2px; padding: 10px 4px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; background: var(--card); color: var(--head); }
.segmented button b { font: 900 16px/1 var(--font); }
.segmented button small { color: var(--muted); font: 600 12px/1.2 var(--font); }
.segmented button.is-on { background: var(--sel-bg); border-color: var(--sel-line); color: var(--macaw); }
.setting { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 2px solid var(--line); cursor: pointer; }
.setting span { display: grid; }
.setting b { color: var(--head); font: 800 16px/1.3 var(--font); }
.setting small { color: var(--muted); font: 600 13px/1.3 var(--font); }
.setting input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--swan); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, .15); transition: transform .2s var(--ease-out4); }
.setting input:checked + .switch { background: var(--owl); }
.setting input:checked + .switch::after { transform: translateX(20px); }
.setting input:focus-visible + .switch { outline: 3px solid var(--macaw); outline-offset: 2px; }
.settings .btn { margin-top: 16px; }

.node.is-story { background: var(--beetle); box-shadow: 0 8px 0 var(--beetle-lip); }
.story-lines { display: grid; gap: 10px; margin: 16px 0 0; padding: 0; list-style: none; }
.story-lines li { padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; }
.story-zh { color: var(--head); font: 400 22px/1.45 var(--cjk); }
.story-py { color: var(--muted); font: 600 14px/1.3 var(--font); }
.story-ru { color: var(--text); font: 600 15px/1.35 var(--font); }

/* ---- lesson.css ---- */
/* lesson.css — урок: верхняя полоса, задания, нижняя панель «Проверить» и лист ответа, экраны конца.
 * Размеры — по замерам Duolingo (таблица в app.css). Ширина колонки задания 600, полосы и панели 1000. */

.lesson-layer { position: fixed; inset: 0; z-index: 50; background: var(--page); overflow-y: auto; overscroll-behavior: contain; }
.lesson { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; min-height: 100dvh; }
.lesson.is-loading { place-items: center; }
.lesson-load .logo-seal { width: 64px; height: 64px; font-size: 40px; border-radius: 16px; }

/* ------------------------------------------------------------------ верх */

.ls-top { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 16px; width: 100%; max-width: 1080px; margin: 0 auto; padding: 20px 16px 8px; }
.ls-close { display: grid; place-items: center; width: 40px; height: 40px; margin-left: -8px; border: 0; border-radius: 12px; background: none; color: var(--hare); }
.ls-close:hover { background: var(--polar); }
.lesson-bar > i { transition: width .45s var(--ease-out4); }
.lesson-bar.is-hot > i { background: linear-gradient(90deg, var(--owl), var(--mask)); box-shadow: 0 0 12px color-mix(in srgb, var(--mask) 55%, transparent); }
.ls-combo { display: inline-flex; align-items: center; gap: 2px; color: var(--fox); font: 900 18px/1 var(--font); font-variant-numeric: tabular-nums; }
.ls-rush { display: flex; align-items: center; gap: 12px; }
.ls-lives { display: inline-flex; gap: 4px; }
.ls-lives i { width: 12px; height: 12px; border-radius: 50%; background: var(--swan); }
.ls-lives i.on { background: var(--cardinal); }
.ls-clock { min-width: 44px; color: var(--head); font: 900 18px/1 var(--font); font-variant-numeric: tabular-nums; }
.ls-clock.is-low { color: var(--cardinal); }

/* ------------------------------------------------------------------ сцена */

.ls-stage { display: flex; justify-content: center; padding: 20px 16px 28px; overflow-x: clip; }
.ls-card { width: 100%; max-width: 600px; }
.ls-retry { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; color: var(--fox); font: 800 14px/1.2 var(--font); letter-spacing: .4px; text-transform: uppercase; }
.ls-retry.is-weak { color: var(--beetle-lip); }
.ex-head { margin: 0 0 24px; color: var(--head); font: 800 24px/32px var(--font); }
.ex-label { margin: 0 0 16px; color: var(--beetle-lip); font: 800 15px/1 var(--font); letter-spacing: .8px; text-transform: uppercase; }

.bubble-row { display: flex; align-items: center; gap: 16px; margin: 0 0 28px; }
.bubble { position: relative; padding: 12px 20px; border: 2px solid var(--line); border-radius: 16px; background: var(--card); }
.bubble-row .speak + .bubble::before, .bubble-row .speak + .bubble::after {
  content: ""; position: absolute; left: -11px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%) rotate(45deg); background: var(--card);
  border-left: 2px solid var(--line); border-bottom: 2px solid var(--line);
}
.bubble-row .speak + .bubble::after { display: none; }
.bubble.is-ru { padding: 14px 20px; }
.ex-hz { display: block; color: var(--head); font-size: 54px; line-height: 1.15; }
.ex-py { margin: 0 0 2px; font-size: 16px; }
.no-pinyin .ex-py, .no-pinyin .choice-py { display: none; }
.ex-ru { color: var(--head); font: 600 19px/1.4 var(--font); }

.speak {
  --face: var(--macaw); --lipc: var(--macaw-lip); position: relative; display: grid; place-items: center; flex: none; width: 48px; height: 48px;
  border: 0; border-radius: 14px; background: var(--face); color: #fff; box-shadow: 0 4px 0 var(--lipc); margin-bottom: 4px;
  transition: transform .08s, box-shadow .08s;
}
.speak:active { transform: translateY(4px); box-shadow: 0 0 0 var(--lipc); }
.speak.is-big { width: 112px; height: 112px; border-radius: 22px; box-shadow: 0 6px 0 var(--lipc); }
.speak.is-big:active { transform: translateY(6px); box-shadow: none; }
.speak.is-slow.is-big { width: 72px; height: 72px; border-radius: 18px; }
.listen-row { display: flex; align-items: flex-end; justify-content: center; gap: 18px; margin: 4px 0 32px; }

/* варианты: плитка с номером клавиши слева (веб Duolingo) */
.choices { display: grid; gap: 10px; }
.choices.is-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.choice {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 12px 16px; margin: 0;
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: var(--card); color: var(--text);
  font: 600 17px/1.3 var(--font); text-align: left; transition: background .15s, border-color .15s, color .15s, transform .08s;
}
.choice:hover:not(:disabled) { background: var(--polar); }
.choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.choice-key {
  display: grid; place-items: center; flex: none; width: 30px; height: 30px; border: 2px solid var(--line); border-radius: 8px;
  color: var(--hare); font: 800 15px/1 var(--font);
}
.choice-label { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.choices.is-grid .choice { flex-direction: column; justify-content: center; min-height: 128px; padding: 18px 12px; text-align: center; }
.choices.is-grid .choice-key { position: absolute; top: 10px; left: 10px; width: 26px; height: 26px; font-size: 13px; }
.choices.is-grid .choice-label { justify-items: center; }
.choice-hz { color: var(--head); font-size: 34px; line-height: 1.2; }
.choice-py { color: var(--muted); font: 600 14px/1.2 var(--font); }
.choice-sent { color: var(--head); font-size: 22px; line-height: 1.35; }
.choice-tone { color: var(--head); font: 800 24px/1.2 var(--font); letter-spacing: .3px; }
.choice.is-sel { background: var(--sel-bg); border-color: var(--sel-line); color: var(--macaw); }
.choice.is-sel .choice-key { border-color: var(--sel-line); color: var(--macaw); }
.choice.is-sel .choice-hz, .choice.is-sel .choice-sent, .choice.is-sel .choice-tone { color: var(--macaw); }
.choice.is-ok { background: var(--ok-bg); border-color: var(--jade); color: var(--ok-ink); }
.choice.is-ok .choice-key { border-color: var(--jade); color: var(--ok-ink); }
.choice.is-ok .choice-hz, .choice.is-ok .choice-sent, .choice.is-ok .choice-tone { color: var(--ok-ink); }
.choice.is-bad { background: var(--bad-bg); border-color: var(--cardinal); color: var(--bad-ink); }
.choice.is-bad .choice-key { border-color: var(--cardinal); color: var(--bad-ink); }
.choice.is-bad .choice-hz, .choice.is-bad .choice-sent, .choice.is-bad .choice-tone { color: var(--bad-ink); }
.choice:disabled { cursor: default; }

/* знакомство со словом */
.intro-card { display: grid; justify-items: center; gap: 8px; padding: 28px 20px 24px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; text-align: center; }
.intro-top { display: flex; align-items: center; gap: 12px; }
.intro-py { color: var(--macaw); font: 800 22px/1 var(--font); }
.intro-hz { color: var(--head); font-size: 88px; line-height: 1.1; }
.intro-ru { color: var(--head); font: 800 20px/1.35 var(--font); }
.intro-ex { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--polar); text-align: left; }
.intro-ex .speak { width: 40px; height: 40px; border-radius: 12px; }
.intro-ex-zh { color: var(--head); font-size: 22px; }
.intro-ex .py { font-size: 14px; }
.intro-ex-ru { color: var(--text); font-size: 15px; }
.know-link { display: block; margin: 18px auto 0; padding: 8px 12px; border: 0; background: none; color: var(--macaw); font: 800 14px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.know-link:disabled { color: var(--ok-ink); }

/* семья слова */
.family { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-top: 10px; }
.family-label { color: var(--muted); font: 800 12px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; }
.family-list { display: flex; flex-wrap: wrap; gap: 6px; }
.family-word { padding: 3px 8px; border-radius: 8px; background: rgba(127, 127, 127, .1); color: var(--head); font: 400 18px/1.3 var(--cjk); }
.family-word .hit { color: var(--fox); }
.family-item { position: relative; display: inline-block; }
button.family-word { border: 0; cursor: pointer; transition: background .12s; }
button.family-word:hover, button.family-word[aria-expanded="true"] { background: var(--sel-bg); }
button.family-word:focus-visible { outline: 2px solid var(--macaw); outline-offset: 2px; }
.fam-card {
  position: absolute; z-index: 40; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  width: max-content; min-width: 168px; max-width: 240px; padding: 12px 14px 12px; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--r);
  box-shadow: var(--shadow); animation: fam-pop .16s var(--ease-out4);
}
@keyframes fam-pop { from { opacity: 0; transform: translate(-50%, -4px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .fam-card { animation: none; } }
.fam-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.fam-card-hz { color: var(--head); font: 400 30px/1.2 var(--cjk); }
.fam-card-hz .hit { color: var(--fox); }
.fam-card-say { width: 36px; height: 36px; border-radius: 12px; margin-bottom: 0; }
.fam-card-py { margin: 2px 0 0; color: var(--macaw); font: 800 15px/1.3 var(--font); }
.fam-card-ru { margin: 4px 0 0; color: var(--text); font: 700 15px/1.35 var(--font); }
.fam-card-more { margin-top: 8px; padding: 0; border: 0; background: none; color: var(--macaw);
  font: 800 12px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; cursor: pointer; }

/* сборка из плиток: линейки ответа и банк с призраками */
.answer-wrap { position: relative; min-height: 132px; margin: 4px 0 28px; }
.answer-wrap .rule { position: absolute; left: 0; right: 0; height: 2px; background: var(--line); }
.answer-wrap .rule:nth-of-type(1) { top: 64px; }
.answer-wrap .rule:nth-of-type(2) { top: 130px; }
.answer-line { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px 8px; min-height: 132px; padding: 8px 0; row-gap: 14px; }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.tile-slot { display: inline-block; flex: none; border-radius: 14px; background: var(--swan); }
.tile, .answer-line .tile { flex: none; white-space: nowrap; }
.tile {
  display: inline-grid; place-items: center; min-width: 48px; padding: 9px 14px 8px; border: 2px solid var(--line); border-bottom-width: 4px;
  border-radius: 14px; background: var(--card); color: var(--head); font-size: 22px; line-height: 1.25; transition: transform .08s;
}
.tile:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.answer-line.is-ok .tile { color: var(--ok-ink); }
.answer-line.is-bad .tile { color: var(--bad-ink); }

/* пары */
.pairs-head { display: flex; align-items: baseline; justify-content: space-between; }
.pairs-time { color: var(--muted); font: 800 16px/1 var(--font); font-variant-numeric: tabular-nums; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pairs-col { display: grid; gap: 10px; align-content: start; }
.pair { justify-content: center; min-height: 64px; text-align: center; }
.pair .choice-hz { font-size: 26px; }
.pair.is-r .choice-label { font-size: 16px; }
.pair.is-gone { opacity: .35; background: var(--card); border-color: var(--line); color: var(--hare); }
.pair.is-gone .choice-hz { color: var(--hare); }

/* грамматика и «в чём разница» */
.grammar-prompt { margin: 0 0 24px; }
.ex-rule { margin: 0 0 10px; color: var(--muted); font: 800 15px/1.3 var(--font); }
.formula { display: grid; gap: 8px; }
.formula-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.formula-plus { color: var(--hare); font: 800 16px/1 var(--font); }
.formula-tile { padding: 6px 12px; border-radius: 10px; border: 2px solid; font: 800 15px/1.3 var(--font); }
.formula-tile.is-han { border-color: var(--fox); color: var(--fox-lip); background: var(--t-peach-bg); font: 400 20px/1.25 var(--cjk); }
.formula-tile.is-mix { border-color: var(--beetle); color: var(--beetle-lip); background: var(--t-lav-bg); }
.formula-tile.is-slot { border-color: var(--line); color: var(--muted); border-style: dashed; }
.contrast-prompt { margin: 0 0 26px; }
.contrast-zh { color: var(--head); font: 400 28px/1.6 var(--cjk); }
.blank { display: inline-block; min-width: 2.2em; margin: 0 4px; padding: 0 6px; border-bottom: 3px solid var(--macaw); color: var(--macaw); text-align: center; }
.blank.is-filled { border-bottom-style: solid; }

/* письмо по памяти: hanyu-write.js в наших цветах */
.write-prompt { margin: -8px 0 16px; text-align: center; }
.write-ru { color: var(--head); font: 800 20px/1.3 var(--font); }
.write-py { margin-top: 2px; color: var(--macaw); font: 800 17px/1 var(--font); }
.write-stage { display: flex; justify-content: center; }
.write-stage .hw-root {
  --hw-ink: var(--head); --hw-muted: var(--muted); --hw-line: var(--line); --hw-surface: var(--card); --hw-accent: var(--macaw);
  --hw-on-accent: #fff; --hw-py: var(--macaw); --hw-good: var(--jade); --hw-hard: var(--fox); --hw-bad: var(--cardinal); --hw-chip: var(--card);
  font-family: var(--font);
}
.write-stage .hw-stage { border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px; }
.write-stage .hw-btn { min-height: 44px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; font: 800 14px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; color: var(--macaw); }
.write-stage .hw-btn.is-main { background: var(--owl); border-color: var(--owl-lip); color: #fff; }

/* ------------------------------------------------------------------ низ: «Проверить» и лист ответа */

/* Низ липнет к краю экрана: на телефоне задание и лист ответа вместе бывают выше экрана, и «Дальше» уходило вниз
   (до 57 px на 390×844, проверка модуля механик 16.10). */
.ls-foot { position: sticky; bottom: 0; z-index: 5; background: var(--page); border-top: 2px solid var(--line); overflow: hidden; }
.ls-sheet { position: absolute; inset: 0; transform: translateY(100%); }
.ls-foot.is-open { border-top-color: transparent; }
.ls-foot.is-open .ls-sheet { transform: none; }
.ls-foot.is-ok .ls-sheet { background: var(--ok-bg); }
.ls-foot.is-ok .ls-actions .btn:not(.is-outline) { --face: var(--jade); --lipc: var(--jade-lip); }   /* «Дальше» после верного — нефрит */
.ls-foot.is-bad .ls-sheet { background: var(--bad-bg); }
.ls-foot-in { position: relative; display: grid; gap: 16px; width: 100%; max-width: 1000px; margin: 0 auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.ls-actions { display: flex; gap: 12px; }
.ls-actions .btn { flex: 1; }
.ls-actions .btn.is-outline { flex: 0 1 auto; }
.ls-verdict:empty { display: none; }
.v-head { display: flex; align-items: center; gap: 12px; }
.v-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--ok-ink); }
.ls-foot.is-bad .v-icon { color: var(--bad-ink); }
.v-title { color: var(--ok-ink); font: 800 24px/1.2 var(--font); }
.ls-foot.is-bad .v-title { color: var(--bad-ink); }
.v-answer { margin-top: 8px; color: var(--ok-ink); }
.v-answer.is-bad { color: var(--bad-ink); }
.v-zh { font: 400 22px/1.35 var(--cjk); }
.v-zh .hit { padding: 0 2px; border-radius: 4px; background: rgba(255, 150, 0, .18); }
.v-py { font: 600 15px/1.35 var(--font); opacity: .85; }
.v-ru { font: 600 17px/1.35 var(--font); }
.v-note { margin-top: 8px; color: var(--text); font: 600 15px/1.4 var(--font); }
.ls-foot .family { margin-top: 8px; }

@media (min-width: 760px) {
  .ls-top { padding: 32px 40px 8px; }
  .ls-stage { padding-top: 36px; }
  .ex-head { font-size: 26px; }
  .ls-foot-in { grid-template-columns: 1fr auto; align-items: center; min-height: 140px; padding: 24px 40px; }
  .ls-actions { justify-content: space-between; grid-column: 1 / -1; grid-row: 1; }
  .ls-foot.is-open .ls-actions { grid-column: 2; }
  .ls-foot.is-open .ls-verdict { grid-column: 1; grid-row: 1; }
  .ls-actions .btn { flex: 0 0 auto; min-width: 150px; width: min(336px, 34%); }
  .bank { margin-top: 56px; }
  .end-title { font-size: 40px; }
  .stat-card { width: 124px; }
  .stat-card-body { padding: 22px 6px; }
  .stat-card-body b { font-size: 22px; }
  .ls-foot:not(.is-open) .ls-actions .btn:only-child, .ls-foot:not(.is-open) .ls-actions .btn.is-outline[hidden] + .btn { margin-left: auto; }
}

/* ------------------------------------------------------------------ конец урока */

.lesson.is-end { grid-template-rows: 1fr; }
.end { display: grid; grid-template-rows: 1fr auto; min-height: 100vh; min-height: 100dvh; }
.end-body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 16px 24px; text-align: center; }
.end-seal {
  display: grid; place-items: center; width: 128px; height: 128px; margin-bottom: 18px; border-radius: 26px; background: var(--seal); color: #fff;
  box-shadow: inset 0 0 0 6px var(--seal), inset 0 0 0 9px rgba(255, 255, 255, .9), 0 8px 0 var(--seal-lip); transform: rotate(-6deg);
  font: 400 84px/1 "Kaiti SC", "STKaiti", KaiTi, var(--cjk);
}
.end-seal.is-perfect { background: var(--fox); box-shadow: inset 0 0 0 6px var(--fox), inset 0 0 0 9px rgba(255, 255, 255, .9), 0 8px 0 var(--fox-lip); }
.end-title { color: #f5a800; font: 900 32px/1.15 var(--font); }
.end-title.is-perfect { color: var(--fox); }
.end-sub { max-width: 420px; color: var(--muted); font: 600 17px/1.45 var(--font); }
.end-stats { display: flex; justify-content: center; gap: 14px; margin-top: 28px; }
.stat-card { --c: var(--bee); width: 108px; border: 2px solid var(--c); border-radius: 16px; background: var(--c); overflow: hidden; }
.stat-card.is-gold { --c: var(--bee); }
.stat-card.is-green { --c: var(--jade); }
.stat-card.is-blue { --c: var(--macaw); }
.stat-card-label { padding: 6px 4px 5px; color: #fff; font: 900 12px/1 var(--font); letter-spacing: .8px; text-transform: uppercase; }
.stat-card.is-gold .stat-card-label { color: #7a5200; }
.stat-card-body { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 6px; border-radius: 13px 13px 14px 14px; background: var(--card); color: var(--c); }
.stat-card-body b { font: 900 20px/1 var(--font); font-variant-numeric: tabular-nums; }
.end-foot { border-top: 2px solid var(--line); }
.end-foot-in { display: flex; justify-content: flex-end; width: 100%; max-width: 1000px; margin: 0 auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.end-foot .btn { width: 100%; }
@media (min-width: 760px) { .end-foot-in { padding: 24px 40px; min-height: 140px; align-items: center; } .end-foot .btn { width: min(336px, 34%); min-width: 150px; } }

.streak-art { color: var(--fox); filter: drop-shadow(0 6px 0 rgba(205, 121, 0, .25)); }
.streak-big { display: grid; gap: 4px; color: var(--fox); }
.streak-big-num { display: block; font: 900 96px/1 var(--font); font-variant-numeric: tabular-nums; }
.streak-big span { font: 800 22px/1.2 var(--font); }
.end .week { max-width: 340px; width: 100%; margin: 18px 0 6px; }
.quests-art { color: var(--bee); }
.end-quests { width: 100%; max-width: 420px; margin-top: 16px; text-align: left; }

.xp-fly {
  position: fixed; z-index: 99; left: 0; top: 0; padding: 6px 12px; border-radius: 999px; background: var(--bee); color: #6b4700;
  font: 900 16px/1 var(--font); box-shadow: 0 3px 0 var(--bee-lip); pointer-events: none; white-space: nowrap;
}

/* ---- dz.css ---- */
/* dz.css — страницы ДЗ в виде платформы hanyu (одобренный мок 17.10.2026): бордо, Nunito, объёмные кнопки и плитки.
 * Поверх app.css, views.css и lesson.css платформы: здесь только раскладка страниц и новые блоки (префикс m-). */

:root { --m-top: 64px; --m-tint: #f6e7e7; --m-tint-lip: #e6caca; }
@media (prefers-color-scheme: dark) { :root { --m-tint: #3a2324; --m-tint-lip: #563233; } }

body { background: var(--page); }
ruby { ruby-position: over; }
rt { color: var(--muted); font: 700 .42em/1 var(--font); letter-spacing: 0; }
.no-py rt, .no-py .m-py-line { display: none; }

/* ------------------------------------------------------------------ верхняя полоса */

.m-top {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: var(--m-top); padding: 0 16px;
  background: var(--page); border-bottom: 2px solid var(--line);
}
.m-top .logo-seal { flex: none; width: 36px; height: 36px; font-size: 22px; }
.m-top-text { flex: 1; min-width: 0; }
.m-top-title { overflow: hidden; color: var(--head); font: 800 17px/1.2 var(--font); white-space: nowrap; text-overflow: ellipsis; }
.m-top-sub { margin-top: 2px; color: var(--muted); font: 800 11px/1.2 var(--font); letter-spacing: .7px; text-transform: uppercase; white-space: nowrap; }
.m-top-actions { display: flex; gap: 8px; }
.m-iconbtn {
  display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 3px; border: 2px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--muted); box-shadow: 0 3px 0 var(--line); font: 400 19px/1 var(--cjk);
}
.m-iconbtn:active { transform: translateY(3px); box-shadow: none; }
.m-iconbtn.is-on { border-color: var(--m-tint-lip); background: var(--m-tint); color: var(--owl); box-shadow: 0 3px 0 var(--m-tint-lip); }
.m-clock {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; margin-bottom: 3px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--fox-lip); box-shadow: 0 3px 0 var(--line); font: 800 14px/1 var(--font); white-space: nowrap;
}
.m-clock.is-calm { color: var(--muted); }
@media (max-width: 400px) { .m-clock .ic { display: none; } .m-clock { padding: 0 10px; } }

/* ------------------------------------------------------------------ раскладка */

.m-layout { display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }
.m-main, .m-rail { display: contents; }
@media (min-width: 1000px) {
  .m-layout { display: grid; grid-template-columns: minmax(0, 600px) 340px; justify-content: center; align-items: start; gap: 40px; max-width: 1060px; padding-top: 24px; }
  .m-main, .m-rail { display: block; }
  .m-rail { position: sticky; top: calc(var(--m-top) + 24px); }
  .m-rail > * + * { margin-top: 16px; }
}
.m-o1 { order: 1; } .m-o2 { order: 2; } .m-o3 { order: 3; } .m-o4 { order: 4; } .m-o5 { order: 5; } .m-o6 { order: 6; }

.m-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 30px 0 12px; }
.m-h-title { color: var(--head); font: 800 22px/1.2 var(--font); }
.m-h-meta { color: var(--muted); font: 700 14px/1.2 var(--font); white-space: nowrap; }
.m-rail .m-h { margin-top: 0; }

/* ------------------------------------------------------------------ герой ДЗ */

.m-hero { margin: 0; }
.m-hero-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; }
.m-hero .hero-title { font-size: 23px; }
.m-hero-ring { position: relative; display: grid; place-items: center; width: 78px; height: 78px; text-align: center; }
.m-hero-ring .ring { position: absolute; inset: 0; width: 78px; height: 78px; }
.m-hero-ring .ring .ring-track { stroke: rgba(255, 255, 255, .22); }
.m-hero-ring .ring .ring-fill { stroke: #fff; }
.m-hero-ring b { font: 900 19px/1 var(--font); }
.m-hero-ring small { display: block; margin-top: 2px; font: 800 10px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; opacity: .85; }
.m-hchips { display: flex; flex-wrap: wrap; gap: 8px; }
.m-hchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(255, 255, 255, .15); font: 800 13px/1 var(--font); }
.m-hchip .ic { width: 16px; height: 16px; }
.m-hero .zh { font-weight: 400; }

/* ------------------------------------------------------------------ «Что сдаём» */

.m-deliver { padding: 18px 18px 14px; }
.m-drow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: start; gap: 12px; padding: 12px 0; border-top: 2px solid var(--line); }
.m-drow:first-of-type { border-top: 0; }
.m-dot { display: grid; place-items: center; width: 28px; height: 28px; border: 2px solid var(--line); border-radius: 50%; color: transparent; }
.m-dot.is-done { border-color: var(--jade); background: var(--jade); color: #fff; box-shadow: 0 2px 0 var(--jade-lip); }
.m-drow-text { color: var(--head); font: 700 16px/1.4 var(--font); }
.m-drow-text rt { font-size: 9px; }
.m-drow-sub { margin-top: 3px; color: var(--muted); font: 600 13px/1.35 var(--font); }
.m-tag { padding: 5px 8px; border-radius: 8px; background: var(--polar); color: var(--muted); font: 800 11px/1 var(--font); letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; }
.m-tag.is-opt { background: var(--t-yellow-bg); color: #b9790c; }
.m-tag.is-ok { background: var(--ok-bg); color: var(--ok-ink); }
.m-rule { display: flex; gap: 10px; margin-top: 6px; padding: 12px 14px; border-radius: 12px; background: var(--polar); color: var(--muted); font: 600 14px/1.4 var(--font); }
.m-rule .ic { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--owl); }

/* ------------------------------------------------------------------ шаги */

.m-steps { display: grid; gap: 4px; }
.m-step {
  position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 10px 10px 10px 2px;
  border: 0; border-radius: 18px; background: none; color: inherit; text-align: left;
}
.m-step:hover { background: var(--polar); }
.m-step::before {
  content: ""; position: absolute; left: 36px; top: 70px; bottom: -16px; width: 4px; border-radius: 2px;
  background: repeating-linear-gradient(to bottom, var(--line) 0 8px, transparent 8px 14px);
}
.m-step:last-child::before { display: none; }
.m-step.is-done::before { background: var(--jade); }
.m-node {
  position: relative; display: grid; place-items: center; width: 64px; height: 58px; margin: 0 0 6px 6px; border-radius: 50%;
  background: var(--owl); color: #fff; box-shadow: 0 6px 0 var(--owl-lip);
}
.m-node.is-todo { background: var(--m-tint); color: var(--owl); box-shadow: 0 6px 0 var(--m-tint-lip); }
.m-node.is-done { background: var(--jade); color: #fff; box-shadow: 0 6px 0 var(--jade-lip); }
.m-node.is-opt { background: var(--card); color: var(--hare); box-shadow: 0 6px 0 var(--line); outline: 2px dashed var(--hare); outline-offset: -2px; }
.m-node.is-now::after {
  content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--owl) 30%, transparent);
  animation: m-pulse 1.6s var(--ease-out4) infinite;
}
@keyframes m-pulse { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.12); opacity: 0; } }
.btn.is-jade { --face: var(--jade); --lipc: var(--jade-lip); }
.m-step-title, .m-step-meta { display: block; }
.m-step-title { color: var(--head); font: 800 18px/1.25 var(--font); }
.m-step-title rt { font-size: 9px; }
.m-step-meta { margin-top: 3px; color: var(--muted); font: 700 14px/1.3 var(--font); }
.m-step-prog { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.m-step-prog .bar { flex: 1; max-width: 180px; }
.m-step-prog small { color: var(--muted); font: 800 12px/1 var(--font); font-variant-numeric: tabular-nums; }
.m-go {
  padding: 9px 11px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--owl); box-shadow: 0 3px 0 var(--line);
  font: 800 13px/1 var(--font); letter-spacing: .7px; text-transform: uppercase; white-space: nowrap;
}
.m-step.is-done .m-go { color: var(--jade); }
.m-step.is-now .m-go { border-color: var(--owl); background: var(--owl); color: #fff; box-shadow: 0 3px 0 var(--owl-lip); }
.m-order { display: flex; gap: 10px; margin-top: 10px; padding: 12px 14px; border: 2px solid var(--t-yellow-line); border-radius: 14px; background: var(--t-yellow-bg); color: var(--text); font: 600 14px/1.45 var(--font); }
.m-order .ic { flex: none; width: 20px; height: 20px; color: #c98a0e; }

/* ------------------------------------------------------------------ слова */

.m-hscroll { display: flex; gap: 12px; margin: 0 -16px; padding: 4px 16px 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.m-hscroll::-webkit-scrollbar { display: none; }
.m-word {
  position: relative; flex: none; display: grid; justify-items: center; align-content: start; gap: 4px; width: 118px; padding: 14px 8px 12px;
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; background: var(--card); color: inherit; text-align: center; scroll-snap-align: start;
}
.m-word:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
.m-word-zh { color: var(--head); font: 400 32px/1.15 var(--cjk); white-space: nowrap; }
.m-word-py { color: var(--muted); font: 700 14px/1.2 var(--font); }
.m-word-ru { display: -webkit-box; overflow: hidden; color: var(--text); font: 600 13px/1.3 var(--font); -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.m-word .m-say { position: absolute; top: 8px; right: 8px; color: var(--macaw); }
.m-word .m-say .ic { width: 18px; height: 18px; }
.m-word.is-playing, .m-wtile.is-playing { border-color: var(--sel-line); background: var(--sel-bg); }
@media (min-width: 1000px) {
  .m-rail .m-hscroll { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
  .m-rail .m-word { width: calc(50% - 6px); }
}

/* ------------------------------------------------------------------ мелкие карточки */

.m-mini { display: grid; gap: 6px; padding: 16px 18px; }
.m-mini-title { display: flex; align-items: center; gap: 8px; color: var(--head); font: 800 17px/1.25 var(--font); }
.m-mini-title .ic { color: var(--t-lav); }
.m-mini p { color: var(--text); font: 600 14px/1.45 var(--font); }
details.m-fold { border: 2px solid var(--line); border-radius: 16px; background: var(--card); }
details.m-fold + details.m-fold { margin-top: 12px; }
details.m-fold > summary {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; color: var(--head);
  font: 800 16px/1.3 var(--font); list-style: none; cursor: pointer;
}
details.m-fold > summary::-webkit-details-marker { display: none; }
details.m-fold > summary .ic { flex: none; color: var(--hare); transition: transform .2s var(--ease-out4); }
details.m-fold[open] > summary .ic { transform: rotate(180deg); }
.m-fold-body { display: grid; gap: 10px; padding: 0 18px 16px; color: var(--text); font: 600 14px/1.5 var(--font); }

/* ------------------------------------------------------------------ плеер шага (по образцу урока платформы) */

.m-count { color: var(--muted); font: 800 15px/1 var(--font); font-variant-numeric: tabular-nums; }
.m-listen { display: flex; align-items: flex-end; justify-content: center; gap: 18px; margin: 8px 0 14px; }
.m-play { --face: var(--owl); --lipc: var(--owl-lip); }
