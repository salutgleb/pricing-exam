ение стоимости билетов в зависимости от спроса, сезонности и времени бронирования» (Л5, сл. 47); «Тактические скидки… 2) За внесезонную покупку» (Л5, сл. 18); динамическое ценообразование актуально, когда «Есть сезонный спрос или переменные условия» (Л3, сл. 23).","slide":"Раздатка; Л5, сл. 47 (Aviasales); Л3, сл. 23–25, 33; Л5, сл. 18","goal_fit":"У Aviasales (Л5, сл. 47) цель «Оптимизация доходов за счет максимальной загрузки рейсов и эффективного управления спросом», результат «Повышение прибыли в периоды повышенного спроса и управление загрузкой рейсов в низкий сезон». Доля рынка: из примера берётся загрузка низкого сезона; у бумаги так же ранние и внесезонные цены загружают весь план и приводят новых клиентов (вывод). Доход: прямо цель Aviasales. Прибыль: первая часть результата; динамическое ценообразование эффективно, когда «Необходимо максимизировать прибыль в краткосрочном периоде» (Л3, сл. 23).","timing_reach_offer":"Сроки: календарь цен на год по периодам. Охват: кто покупает в каждый период (школы и студии заранее, родители в августе, офисы в течение года). Ценовое предложение: «период и цена», все цены выше себестоимости.","risk":"Покупатели привыкают ждать низкую цену. Самая низкая цена календаря должна быть выше себестоимости."},{"key":"G-B-B","definition":"Модель, которая предполагает дифференциацию одного и того же продукта по принципу «хороший», «лучший», «самый лучший» в зависимости от включения дополнительных бонусов или сервиса в каждый тариф. Важно понимать, что «базовый» тариф должен удовлетворять основную потребность клиента (функцию), а дифференциация осуществляется по вторичным нуждам и функциям.","how_for_paper":"Та же пачка в трёх тарифах с разным сервисом. Good «Пачка»: 109 руб., магазин или маркетплейс. Better «Класс»: 119 руб. за пачку при заказе от 10 пачек с доставкой в школу или офис за 2 дня. Best «Абонемент»: 129 руб. за пачку, поставка каждый месяц по графику, этикетка с логотипом заказчика, замена брака. Базовый тариф закрывает функцию (бумага), верхние продают удобство.","slide":"Раздатка; близко к Л5, сл. 32: «Дифференциация дополнительных условий – дополнительный сервис (доставка, упаковка, хранение, отсрочка/рассрочка – более низкая, чем у конкурентов) при сохранении высоких цен на основной продукт»; три уровня цен у Avast на Л5, сл. 44: «Предлагают 3 уровня цен в зависимости от ценности, которую принесут клиентам»","goal_fit":"Доход: растёт средний чек. Прибыль: сервис требует расходов на доставку и печать этикеток, надбавка 10–20 руб. должна их покрыть (допущение).","timing_reach_offer":"Сроки: тарифы на 12 месяцев с запуска к учебному году, промежуточные итоги через 6 месяцев. Охват: школы, студии, офисы, копицентры; Good остаётся в рознице. Ценовое предложение: три тарифа с ценой и составом.","risk":"Доставки нет в ресурсном плане. Надбавка верхних тарифов должна её покрывать (допущение)."}],"goals":[{"key":"максимизация прибыли","kpi_examples":["к концу года прибыль 650 000 руб. в месяц вместо 620 000","к концу года маржа не ниже 60%: при себестоимости 47 руб. это цена от 118 руб.","с первого месяца прибыль на пачку 62 руб. и выше"],"price_logic":"Самая высокая из трёх цен: в примере с омывайкой прибыль максимальна при 490 руб. и одном покупателе. «Чем больше риск, тем больше прибыль и наоборот». Ориентир цены максимальной прибыли даёт экспресс-метод (Л2, сл. 33), но для него нужна цена F, по которой продашь хотя бы одну пачку: в условии её нет.","tactic_fit":"G-B-B (сервис в верхних тарифах), Flexible pricing с повышением цены в пик.","chain":["Цель: максимизация прибыли. Беру, если её задали в варианте: тактику оценивают «с учетом заданной цели» (Л5, сл. 83).","Тактика: Flexible pricing, ранний заказ дешевле, с пика спроса цена выше. Динамическое ценообразование эффективно, когда «Необходимо максимизировать прибыль в краткосрочном периоде» (Л3, сл. 23).","Цена: июнь и июль 115 руб., с августа 119 руб., в среднем за год 118,3 руб. Допускаю, что пик спроса перед 1 сентября. Все цены ниже Л (120 руб.), и это самая высокая цена из трёх целей: доля рынка 109 руб., доход в среднем 115 руб., прибыль около 118 руб.","Проверка: в июне и июле наценка 115 − 47 = 68 руб., маржа 59,1%; с августа 119 − 47 = 72 руб., маржа 72 / 119 = 60,5%.","Сроки и охват: 12 месяцев с июня; ранние цены для школ, студий и офисов, с августа одна цена для розницы и маркетплейсов.","KPI: с августа маржа не ниже 60% и прибыль не ниже 650 000 руб. в месяц (при полном плане 720 000 руб.); с первого месяца прибыль на пачку не ниже 68 руб."],"slide":"Л5, сл. 7, 13–16"},{"key":"максимизация дохода","kpi_examples":["через 6 месяцев выручка 1 150 000 руб. в месяц вместо 1 090 000","через 6 месяцев средняя цена пачки 115 руб. вместо 109","через 6 месяцев 40% пачек в тарифах Better и Best (допущение: поровну, по 20%; 0,6 × 109 + 0,2 × 119 + 0,2 × 129 = 115)"],"price_logic":"Средняя из трёх цен: в примере выручка максимальна при 250 руб. и двух покупателях.","tactic_fit":"G-B-B (рост среднего чека), Flexible pricing (повышение в пик спроса).","slide":"Л5, сл. 7, 13, 15"},{"key":"увеличение числа клиентов (доли рынка)","kpi_examples":["весь план 10 000 пачек в месяц продан к сентябрю","50 школ и студий с договором до 1 сентября","30% покупателей вернулись до декабря","5% продаж плотной бумаги А4 в городе к концу года (допущение о рынке)"],"price_logic":"Самая низкая из трёх цен: при 150 руб. купили все трое. Для сети «вместо «штук клиентов» можно было бы говорить про «долю рынка»».","tactic_fit":"Flexible pricing с ранними и внесезонными ценами (загрузка в низкий сезон, как у Aviasales, Л5, сл. 47), Big roll.","slide":"Л5, сл. 7, 12, 15"}],"template":[{"point":1,"title":"Продукт","what_to_write":"Буква, название, формат, объём в месяц. Можно добавить одну причину выбора.","example":"Продукт «г»: бумага плотная в упаковке, А4, 20 листов, 10 000 пачек в месяц.","numbers":"10 000 в месяц","lines":"1–2 строки","own_words":"Причину выбора скажи по-своему: простой состав, большой объём, низкие постоянные на пачку.","if_numbers_differ":"Бери продукт, у которого себестоимость заметно ниже цен конкурентов. Сначала прикинь все 4 за 3 минуты."},{"point":2,"title":"Ресурсный план и себестоимость","what_to_write":"Переменные на единицу по каждому ресурсу с расчётом. Строка, что не берёшь (картон, скобы) и почему. Постоянные в месяц. Строка про начальника цеха. Формула бизнеса с числами. Себестоимость единицы.","example":"Бумага 20 × 1 = 20; упаковка 1; этикетка 1 000 / 100 = 10; фасовщик 10; наладчик 100 / 100 = 1. Итого 42 руб. Постоянные: мастер 40 000, аренда 120 000 / 12 = 10 000, итого 50 000. С = 42 × 10 000 + 50 000 = 470 000. Себестоимость 47 руб.","numbers":"42; 50 000; 470 000; 47","lines":"таблица из 5 строк и 4–5 строк текста","own_words":"Таблица у всех одна, это нормально. Своё пиши в пояснениях: почему нет картона и скоб, почему нет начальника.","if_numbers_differ":"На единицу = цена упаковки / штук в упаковке × сколько штук в продукте. Наладчик = цена наладки / размер партии. Аренда = годовая / 12. Себестоимость = (VC × Q + FC) / Q."},{"point":3,"title":"Прямой конкурент, базовая цена, наценка","what_to_write":"Минимальная цена (себестоимость, ниже убыток). Сегменты игроков по цене. Прямой конкурент: буква, цена, почему он. Базовая цена формулой курса и девятка на конце. Наценка в рублях и %, маржа отдельно.","example":"Минимальная 47 руб. Прямой конкурент Л (120). P = 120 − 11 = 109 руб. (Л3, сл. 19). Наценка 62 руб. (132%), маржа 57%.","numbers":"47; 120; 11; 109; 62; 132%; 57%; ТБУ 747 пачек","lines":"7–9 строк","own_words":"Метод выбери сам: цена конкурента ± Δ в рублях (Л3, сл. 19) или ± k в процентах (сл. 20), цена безразличия (Л2, сл. 18). Диапазон с α (Л3, сл. 22) строй только между игроками своего сегмента. Главное: формула и числа. Строку про безубыточность можно опустить, если не хватает времени.","if_numbers_differ":"Цены игроков твоего товара по возрастанию: эконом, масс-маркет, премиум. Прямой конкурент из выбранного сегмента. Цена от него: P = P_конк − Δ (Л3, сл. 19) или P_конк × (1 − k) (сл. 20, по смыслу), потом целая цена на 9, как «Было 120, стало 99» (Л2, сл. 20). Диапазон (сл. 22) бери, только если в твоём сегменте два игрока и больше. Проверь, что цена выше себестоимости."},{"point":4,"title":"Сегмент и 9P","what_to_write":"Сегмент и почему он сходится с ценой. Три обязательные P по резюме (Л3, сл. 103), по строке на каждую с фактами продукта. Позиционирование одной фразой: для кого, что получает, чем лучше конкурента.","example":"Масс-маркет: цена между К и Л, ближе к Л. P: Product, Price, Promotion. Позиционирование: плотная бумага для школы, творчества и офиса, качество как у известных марок, цена ниже.","numbers":"109 против 120","lines":"6–8 строк","own_words":"Каналы, акции и формулу позиционирования придумай сам. На слайде 103 у каждого сегмента две равные тройки P: эконом Product + Price + Place или Product + Price + People; масс-маркет Product + Price + Place или Product + Price + Promotion; премиум Product + Promotion + People или Product + Promotion + Process. Выбери одну и скажи почему.","if_numbers_differ":"Сегмент определяет цена (Л3, сл. 69). Если цена получилась у нижнего игрока, это эконом, у среднего масс-маркет."},{"point":5,"title":"Цель и тактика","what_to_write":"Цель из трёх и почему. Тактика из трёх и как она ведёт к цели. Структура: сроки, охват, ценовое предложение. 2–3 KPI с числами и сроком. Проверка, что все цены тактики выше себестоимости.","example":"Цель: доля рынка. Flexible pricing: ранний заказ к 1 сентября, опора на гибкие цены Aviasales (Л5, сл. 47). Сроки: год с июня. Охват: школы, студии, родители, офисы; Ozon, Wildberries, канцтовары. Предложение: июнь 95, июль 99, с августа 109. KPI: 10 000 пачек в месяц к 1 сентября, 50 школ с договором к 1 сентября, 5% рынка города к концу года.","numbers":"95; 99; 109; 10 000; 50; 5%","lines":"10–12 строк","own_words":"Сроки, охват и цифры KPI это твои допущения, их можно менять. Шарко видит похожие тексты, поэтому собирай пункт из своих примеров.","if_numbers_differ":"Цель задаёт уровень цены: доля рынка ниже, доход в середине, прибыль выше (Л5, сл. 15). Самая низкая цена тактики выше себестоимости."}],"model_answer":[{"point":1,"title":"Продукт","text":"Выбираю продукт «г»: бумага плотная в упаковке, А4, 20 листов, 10 000 пачек в месяц. Состав простой, объём самый большой, поэтому постоянные затраты на пачку маленькие."},{"point":2,"title":"Ресурсный план и себестоимость","text":"Переменные затраты на 1 пачку:\n• бумага плотная: 20 листов × (5 000 / 5 000) = 20 руб.;\n• прозрачная упаковка: 5 000 / 5 000 = 1 руб.;\n• этикетка: 1 000 / 100 = 10 руб.;\n• фасовщик: 10 руб.;\n• наладчик: 100 руб. за наладку на 100 пачек = 1 руб. (100 наладок в месяц, 10 000 руб.).\nИтого переменные 42 руб. на пачку, 420 000 руб. в месяц. Картон и скобы пачке бумаги не нужны.\nПостоянные затраты в месяц: мастер линии 40 000 руб., аренда 120 000 / 12 = 10 000 руб. Итого 50 000 руб.\nНачальника цеха не включаю. Допускаю, что линия одна и ею руководит мастер линии из ресурсного плана.\nФормула бизнеса: С = 42 × 10 000 + 50 000 = 470 000 руб. в месяц.\nСебестоимость пачки: 470 000 / 10 000 = 47 руб."},{"point":3,"title":"Прямой конкурент, базовая цена, наценка","text":"Минимальная цена 47 руб.: при плане 10 000 пачек это точка безубыточности, дешевле убыток.\nПлотную бумагу продают К за 80 руб., Л за 120 руб. и М за 250 руб. По цене это эконом, масс-маркет и премиум.\nЦелюсь в масс-маркет. Прямой конкурент Л (120 руб.): «ближайший конкурент в одном сегменте» (Л3, сл. 19). Продукт тот же, бумага плотная, и цена масс-маркета; других продавцов плотной бумаги в масс-маркете нет.\nДопускаю, что бумага у всех похожая. Поэтому базовую цену считаю от прямого конкурента (Л3, сл. 19): Цена = Цена конкурента ± Δ.\nP = 120 − 11 = 109 руб.\nДопускаю, что компания новая и её марку покупатели пока не знают. Поэтому цена ниже Л: Δ = −11 руб., около 9% цены Л. Δ беру таким, чтобы цена кончалась на 9 (Л2, сл. 20: «Остановитесь на цифре 9»).\nНаценка: 109 − 47 = 62 руб., 62 / 47 = 132% к себестоимости. Маржа: 62 / 109 = 57% цены.\nБезубыточность при 109 руб.: 50 000 / (109 − 42) = 747 пачек в месяц."},{"point":4,"title":"Сегмент и 9P","text":"Сегмент: масс-маркет. Цена 109 руб. между К и Л и ближе к Л.\nОбязательные P: Product, Price, Promotion. На сл. 103 у масс-маркета две тройки, вторая с Place; беру Promotion: по допущению из п. 3 марку пока не знают.\nProduct: плотная бумага А4, 20 листов, по качеству на уровне Л. Ровная пачка в прозрачной упаковке, на этикетке плотность и назначение: рисование, печать, поделки.\nPrice: 109 руб., на 11 руб. дешевле Л. Цена конкурентная и при этом даёт наценку 62 руб. Спрос в масс-маркете эластичен, поэтому разница в цене заметно добавляет продажи. Разрыв умеренный, около 9%: войну цен с Л не начинаю (Л5, сл. 29).\nPromotion: карточки и реклама в поиске Ozon и Wildberries, акция к 1 сентября, накопительная скидка для школ и студий. Расходов на рекламу нет в ресурсном плане, условие их не даёт: покрываю их из наценки 62 руб.\nПозиционирование: плотная бумага для школы, творчества и офиса, качество как у известных марок, цена ниже."},{"point":5,"title":"Цель и тактика","text":"Цель: увеличение числа клиентов (доли рынка). По допущению из п. 3 компания новая: ей нужны постоянные покупатели и сбыт всего плана 10 000 пачек в месяц.\nТактика: Flexible pricing, цена зависит от срока заказа. Допускаю, что пик спроса на плотную бумагу перед 1 сентября. Поэтому ранний заказ дешевле, ближе к сезону цена выше.\nОпора в лекции: Aviasales, «Стратегия гибкого ценообразования» (Л5, сл. 47). Цель там «Оптимизация доходов за счет максимальной загрузки рейсов и эффективного управления спросом», результат «Повышение прибыли в периоды повышенного спроса и управление загрузкой рейсов в низкий сезон». Моя цель другая, доля рынка, поэтому из примера беру загрузку низкого сезона: ранние цены загружают весь план в месяцы до сезона.\nСроки: 12 месяцев с 1 июня, три периода: июнь, июль, с 1 августа.\nОхват: школы, художественные школы и студии (заказывают заранее), родители школьников (покупают в августе), офисы. Каналы: Ozon, Wildberries, канцтовары и гипермаркеты города.\nЦеновое предложение: «Закажи к учебному году заранее»: июнь 95 руб., июль 99 руб., с 1 августа базовая 109 руб. Школы и студии, заказавшие до 1 августа, берут по 99 руб. до конца года.\nСамая низкая цена 95 руб. выше себестоимости на 48 руб.\nKPI: к 1 сентября продаём весь план 10 000 пачек в месяц; к 1 сентября 50 школ и студий с договором; к концу года 5% продаж плотной бумаги А4 в городе."},{"point":"alt1","kind":"alternative","title":"Запасной сценарий 1: эконом","text":"Продукт тот же, сегмент эконом. Прямой конкурент К (80 руб.), «ближайший конкурент в одном сегменте» (Л3, сл. 19): тот же продукт, и в экономе плотную бумагу продаёт только он. В экономе «цена должна быть самой низкой на рынке» (Л3, сл. 77), поэтому по той же формуле Цена = Цена конкурента ± Δ: P = 80 − 1 = 79 руб. Наценка 79 − 47 = 32 руб. (68%), маржа 40,5%.\nОбязательные P: Product, Price, Place.\nProduct: плотная бумага А4, 20 листов, базовое качество, простая прозрачная упаковка.\nPrice: 79 руб., на 1 руб. ниже К, самая низкая цена на рынке; наценка 32 руб.\nPlace: маркетплейсы, магазины у дома, выпуск под собственной маркой сетей.\nПозиционирование: плотная бумага для школы, дома и офиса дешевле всех на полке, лежит в магазине у дома и на маркетплейсах. Рекламы почти нет, продают цена и наличие.\nЦель: доля рынка. Эконом живёт объёмом: «занятие доли рынка в своем ценовом сегменте, наращивание объемов продаж» (Л3, сл. 79), а цена и так самая низкая.\nТактика Flexible pricing. Сроки: 12 месяцев с 1 июня, два периода: июнь и июль, затем с 1 августа. Охват: магазины у дома, сети с собственной маркой, школы; Ozon и Wildberries. Ценовое предложение: при заказе в июне и июле 75 руб., с 1 августа 79 руб. Самая низкая цена 75 руб. выше себестоимости на 28 руб.\nKPI: к 1 сентября весь план 10 000 пачек в месяц; к концу года 300 точек продаж."},{"point":"alt2","kind":"alternative","title":"Запасной сценарий 2: доход и G-B-B","text":"Продукт, сегмент и базовая цена те же: масс-маркет, прямой конкурент Л, 109 руб. Цель: максимизация дохода через рост среднего чека. Тактика G-B-B, одна пачка в трёх тарифах:\nGood «Пачка»: 109 руб., магазин и маркетплейс.\nBetter «Класс»: 119 руб. за пачку, заказ от 10 пачек с доставкой в школу или офис за 2 дня.\nBest «Абонемент»: 129 руб. за пачку, поставка каждый месяц по графику, этикетка с логотипом заказчика, замена брака.\nДопускаю, что надбавка тарифов, 10 и 20 руб. к 109 руб., покрывает доставку и печать логотипа: в ресурсном плане этих расходов нет, условие их не даёт.\nБазовый тариф закрывает основную потребность, верхние продают удобство. Сроки: 12 месяцев с 1 августа, промежуточные итоги через 6 месяцев. Охват: школы, студии, офисы, копицентры города. KPI к 1 февраля: 40% пачек в тарифах Better и Best (допускаю поровну, по 20%), средняя цена пачки 115 руб., выручка 1 150 000 руб. в месяц вместо 1 090 000."}],"criteria":["Продукт один, объём в месяц указан.","Каждый ресурс посчитан на единицу: цена упаковки / штук в упаковке × сколько нужно.","Взяты только нужные ресурсы: у бумаги нет картона и скоб.","Аренда 10 000 руб. в месяц (120 000 / 12), наладчик 1 руб. на единицу.","Начальника цеха нет в затратах, причина в одну строку.","Формула бизнеса С = VC × Q + FC с числами и себестоимость единицы.","Минимальная цена названа: ниже неё убыток.","Прямой конкурент: тот же товар, ближайший конкурент в одном сегменте (Л3, сл. 19); буква и цена.","Базовая цена из формулы курса, выше себестоимости и в своём сегменте.","Наценка в рублях и в % к себестоимости, маржа в % к цене, не перепутаны.","Сегмент назван и сходится с ценой; три обязательные P по строке на каждую.","Позиционирование одной фразой: для кого, что получает, чем лучше конкурента.","Цель одна из трёх и объяснено, почему она.","Тактика одна из трёх и связана с целью.","Есть сроки, охват и ценовое предложение; все цены тактики выше себестоимости.","2–3 KPI с числами и сроком.","Текст написан своими словами, без копии чужого файла."],"typical_errors":[{"error":"Начальник цеха в постоянных затратах","fix":"Не включать, одна строка с причиной. Себестоимость бумаги 47 руб., с ним 57.","source":"PDF однокурсника, с. 1"},{"error":"Аренда 120 000 в месяц","fix":"120 000 за 12 месяцев, то есть 10 000 в месяц.","source":"Условие, п. 2.10"},{"error":"Наладчик 110 000 руб. (опечатка из чужого файла)","fix":"100 наладок × 100 руб. = 10 000 руб. в месяц.","source":"PDF однокурсника, с. 2"},{"error":"Себестоимость без постоянных затрат","fix":"Минимальная цена считается по полной себестоимости: (42 × 10 000 + 50 000) / 10 000 = 47 руб.","source":"Л1, сл. 37–38"},{"error":"Наценка и маржа перепутаны","fix":"Наценка к себестоимости: 62 / 47 = 132%. Маржа к цене: 62 / 109 = 57%.","source":"Л3, сл. 7–9"},{"error":"Сегмент не сходится с ценой","fix":"Сегмент задаёт цена: 109 руб. между К и Л это масс-маркет.","source":"Л3, сл. 69"},{"error":"Прямой конкурент из другого товара или сегмента","fix":"Тот же товар и ближайший конкурент в одном сегменте.","source":"Л3, сл. 19"},{"error":"Премиум без причин","fix":"Без реальной разницы с Л цена 249 руб. повторяет «неудачную цену».","source":"Л3, сл. 74"},{"error":"Люкс для бумаги","fix":"Люксового игрока в списке нет, товары люкса другие.","source":"Л3, сл. 91"},{"error":"Тактика не связана с целью","fix":"Цель задаёт уровень цены: доля рынка ниже, доход в середине, прибыль выше.","source":"Л5, сл. 15"},{"error":"Нет сроков, охвата, KPI","fix":"Условие прямо требует «сроки, охват, ценовое предложение»; KPI с числами и сроком.","source":"Условие, п. 5"},{"error":"Цена в тактике ниже себестоимости","fix":"Самая низкая цена тактики 95 руб. выше 47 руб.","source":"расчёт"},{"error":"Текст слово в слово из чужого файла","fix":"У Шарко 5 вариантов и одна тема, похожие тексты видно. Пиши своими словами.","source":"Л5, сл. 84 (5 вариантов); PDF однокурсника, с. 1; вывод"}],"rehearsal":{"minutes":40,"instructions":"Поставь таймер на 40 минут и пиши от руки на бумаге, как на экзамене. Условие открыто, образец закрыт. Ориентир: п. 1 за 2 минуты, п. 2 за 10, п. 3 за 8, п. 4 за 7, п. 5 за 10, 3 минуты на проверку по чек-листу. Потом перенеси ответ в поля и открой образец. Сверь по чек-листу. Второй прогон через день: тот же продукт, другой сегмент или другая тактика из запасных сценариев.","time_plan":[{"point":1,"min":2},{"point":2,"min":10},{"point":3,"min":8},{"point":4,"min":7},{"point":5,"min":10},{"point":"проверка","min":3}]}},{"id":"mistakes","type":"mistakes","title":"Ошибки","icon":"mistakes","sub":"где последняя попытка неверная"},{"id":"mock","type":"mock","title":"Пробник · вариант 6","icon":"mock","locked":true,"note":"Пишем вместе с Claude"}]}</script>
<script>/* ---- logic-core.js ---- */
/* logic-core.js — общие чистые функции приложения hanyu 0.3.
 *
 * Учебный день как в Anki и журнале: МСК минус 4 часа (HanyuJournal.ankiDay).
 * Случайность с зерном (mulberry32): одна и та же сессия и одни и те же задания
 * дня собираются одинаково при одном зерне, это проверяют тесты.
 * Работает и в браузере (window.HanyuApp.core), и в node (module.exports).
 */
(function (root) {
  'use strict';
  var NS = root.HanyuApp = root.HanyuApp || {};

  var DAY_MS = 864e5;
  var MSK_MS = 3 * 3600e3;
  var DAY_START_MS = 4 * 3600e3;
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа',
    'сентября', 'октября', 'ноября', 'декабря'];
  var MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август',
    'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var WEEKDAYS = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
  var WD_SHORT = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function ymd(date) {
    return date.getUTCFullYear() + '-' + pad(date.getUTCMonth() + 1) + '-' + pad(date.getUTCDate());
  }

  /* Учебный день момента времени (мс). */
  function dayKey(ms) { return ymd(new Date(ms + MSK_MS - DAY_START_MS)); }

  function tsMs(ts) {
    if (typeof ts === 'number') return isFinite(ts) ? ts : null;
    var t = Date.parse(ts);
    return isFinite(t) ? t : null;
  }

  function dayOfTs(ts) {
    var t = tsMs(ts);
    return t === null ? null : dayKey(t);
  }

  function isDay(day) { return typeof day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(day); }

  function parseDay(day) {
    return Date.UTC(Number(day.slice(0, 4)), Number(day.slice(5, 7)) - 1, Number(day.slice(8, 10)));
  }

  function addDays(day, n) { return ymd(new Date(parseDay(day) + n * DAY_MS)); }

  /* b − a в днях. */
  function diffDays(a, b) { return Math.round((parseDay(b) - parseDay(a)) / DAY_MS); }

  /* 0 — понедельник. */
  function weekday(day) { return (new Date(parseDay(day)).getUTCDay() + 6) % 7; }

  function mondayOf(day) { return addDays(day, -weekday(day)); }

  /* ISO с явным +03:00, как HanyuJournal.isoMsk. */
  function isoMsk(ms) {
    var t = new Date(ms + MSK_MS);
    return ymd(t) + 'T' + pad(t.getUTCHours()) + ':' + pad(t.getUTCMinutes()) + ':' +
      pad(t.getUTCSeconds()) + '+03:00';
  }

  /* «16 октября», «16 октября, пт». */
  function dayLabel(day, withWeekday) {
    if (!isDay(day)) return '';
    var text = Number(day.slice(8, 10)) + ' ' + MONTHS[Number(day.slice(5, 7)) - 1];
    return withWeekday ? text + ', ' + WD_SHORT[weekday(day)] : text;
  }

  function monthName(day) { return MONTHS_NOM[Number(day.slice(5, 7)) - 1]; }

  function weekdayName(day) { return WEEKDAYS[weekday(day)]; }

  // ------------------------------------------------------------------ случайность с зерном

  function seedOf(text) {
    var h = 2166136261 >>> 0, s = String(text);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  /* mulberry32: rand() → [0, 1). */
  function rng(seed) {
    var a = (typeof seed === 'number' ? seed : seedOf(seed)) >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randInt(rand, n) { return Math.floor(rand() * n); }

  /* Новая перемешанная копия (Фишер — Йетс). */

      return [h('h2.sheet-title', { text: 'Перенос прогресса' }),
        h('p.sheet-text', { text: 'Файлы в приложении на iPhone не скачиваются, поэтому прогресс переносится текстом: «Экспорт» кладёт его в буфер, на другом устройстве вставь его в поле ниже. Записи сливаются, свежая побеждает.' }),
        E.persistent() ? null : E.tip('Это окно не сохраняет прогресс между запусками. Перед закрытием сделай экспорт.', 'warn'),
        h('div.x-form', [exportBtn, input, importBtn, msg, reset])];

  // ------------------------------------------------------------------ верхняя полоса
  E.topbar = function (onChange) {
    var page = E.page;
    return h('header.m-top.x-top', [
      h('span.logo-seal.x-seal', { aria: { hidden: 'true' }, text: page.seal || '₽' }),
      h('div.m-top-text', [h('p.m-top-title', { text: page.title }), h('p.m-top-sub', { text: page.subtitle || page.teacher || '' })]),
      h('div.m-top-actions', [h('button.m-iconbtn.x-iconbtn', { type: 'button', title: 'Перенос прогресса', aria: { label: 'Перенос прогресса' },
        on: { click: function () { E.progressSheet(onChange); } } }, [icon('swap', 22)])])
    ]);
  };

  // ------------------------------------------------------------------ праздник в цветах страницы
  E.confetti = function (count) {
    if (ui.reducedMotion()) return;
    var colors = ['#1f4e7f', '#2565ad', '#e0b04a', '#2e8b62', '#7fb2ea', '#f08733'];
    var canvas = h('canvas.confetti', { aria: { hidden: 'true' } }), ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1, w = window.innerWidth, hh = window.innerHeight, parts = [];
    canvas.width = w * dpr; canvas.height = hh * dpr;
    document.body.appendChild(canvas);
    ctx.scale(dpr, dpr);
    for (var i = 0; i < (count || 90); i++) {
      parts.push({ x: w / 2 + (Math.random() - 0.5) * w * 0.3, y: hh * 0.35, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 13 - 4,
        r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, s: 6 + Math.random() * 6, c: colors[i % colors.length] });
    }
    var start = performance.now();
    (function frame(t) {
      var age = t - start;
      ctx.clearRect(0, 0, w, hh);
      parts.forEach(function (p) {
        p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - age / 2400);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (age < 2400) requestAnimationFrame(frame); else canvas.remove();
    })(start);
  };
})();

/* ---- exam-session.js ---- */
/* exam-session.js — слой урока hanyu для экзамена: каркас экрана (крестик, полоса, счётчик), низ с листом ответа,
 * сессия по карточкам (тест, последовательность, задача, формула; можно вперемешку) и экран итога.
 * Повтор: неверно отвеченные карточки (если retry) возвращаются в конец очереди до верного ответа. Первая попытка
 * пишется в прогресс как попытка, повтор — только как тренировка (см. exam-logic.js). */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic;
  var S = E.session = {};

  var layer = null, onClose = null;
  S.open = function (closeHandler) {
    if (layer) layer.remove();
    onClose = closeHandler || onClose;
    layer = h('div.lesson-layer.x-layer');
    document.body.appendChild(layer);
    document.documentElement.style.overflow = 'hidden';
    document.addEventListener('keydown', onKey, true);
    return layer;
  };
  S.close = function () {
    if (layer) layer.remove();
    layer = null;
    document.documentElement.style.overflow = '';
    document.removeEventListener('keydown', onKey, true);
    if (location.hash) S.setHash('');
    if (onClose) onClose();
  };
  S.isOpen = function () { return !!layer; };
  S.isEmpty = function () { return !!layer && !layer.firstChild; };
  S.setHash = function (hash) { try { history.replaceState(null, '', location.pathname + location.search + hash); } catch (e) { /* адрес не меняем: страница работает и так */ } };
  function onKey(e) { if (e.key === 'Escape' && !document.querySelector('.sheet')) S.close(); }

  /* Каркас экрана: верх (крестик, полоса value/max, счётчик), карточка, низ. */
  S.frame = function (value, max, counter, body, footEl) {
    if (!layer) S.open();
    var top = h('div.ls-top', [h('button.ls-close', { type: 'button', aria: { label: 'Закрыть' }, on: { click: S.close } }, [icon('close', 24)]),
      ui.bar(value, max, 'lesson-bar'), h('span.m-count', { text: counter || '' })]);
    ui.clear(layer);
    layer.appendChild(h('div.lesson', [top, h('div.ls-stage', [h('div.ls-card', body)]), footEl || S.foot([])]));
    layer.scrollTop = 0;
    settle();
  };
  S.foot = function (actions, mode, verdict) {
    return h('div.ls-foot' + (mode ? '.is-open.is-' + mode : ''), [h('div.ls-sheet'),
      h('div.ls-foot-in', [h('div.ls-verdict', verdict || []), h('div.ls-actions', actions)])]);
  };
  S.swapFoot = function (el) { var old = layer && layer.querySelector('.ls-foot'); if (old) old.replaceWith(el); settle(); };
  /* Второй тап по «Дальше» попадал в «Не знаю» следующего вопроса: 350 мс после смены карточки или листа кнопки внизу глухие. */
  var settleTimer = null;
  function settle() {
    if (!layer) return;
    layer.classList.add('is-settling');
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function () { if (layer) layer.classList.remove('is-settling'); }, 350);
  }
  S.vhead = function (ic, title) { return h('div.v-head', [h('span.v-icon', [icon(ic, 22)]), h('p.v-title', { text: title })]); };
  /* Пояснения на листе ответа: прокрутка внутри, кнопка «Дальше» всегда видна. */
  S.explain = function (kids) { return h('div.x-explain', kids); };
  S.section = function (title, text, ic) {
    if (!text) return null;
    return h('div.x-sec', [E.label(title, ic), typeof text === 'string' ? h('p.x-sec-text', { text: E.nb(text) }) : text]);
  };

  // ------------------------------------------------------------------ сессия

  var MAX_POINTS = { test: 0.5, order: 1, problem: 3, formula: 0 };

  /* cfg: {title, entries: [{kind, stepId, item}], retry: bool | (entry) → bool, label?(entry) → строка над вопросом} */
  S.run = function (cfg) {
    var entries = cfg.entries || [];
    if (!entries.length) { ui.toast('Здесь пока пусто'); return; }
    var retryOf = typeof cfg.retry === 'function' ? cfg.retry : function () { return !!cfg.retry; };
    var queue = entries.map(function (e, i) { return { e: e, retry: false, i: i }; });
    var pos = 0, settled = {}, firstOk = {}, scores = {}, started = Date.now();

    function settledCount() { return Object.keys(settled).length; }
    function show() {
      if (pos >= queue.length) return end();
      var card = queue[pos], kind = E.kinds[card.e.kind];
      if (!kind) { pos++; return show(); }
      try {
        kind.render(card.e, ctxFor(card));
      } catch (err) {
        ui.toast('Задание ' + card.e.item.id + ' пропущено: ошибка в данных', { ms: 5000 });
        if (window.console) console.error('exam: задание ' + card.e.item.id, err);
        settled[card.e.item.id] = true;
        pos++;
        show();
      }
    }
    function ctxFor(card) {
      var id = card.e.item.id, answered = false;
      return {
        retry: card.retry,
        label: cfg.label ? cfg.label(card.e) : '',
        frame: function (body, foot) {
          var head = card.retry ? [h('p.ls-retry', [icon('repeat', 18), h('span', { text: 'Повтор ошибки' })])] : [];
          S.frame(settledCount(), entries.length, card.retry ? 'повтор' : (card.i + 1) + '/' + entries.length, head.concat(body), foot);
        },
        result: function (r) {
          if (answered) return;
          answered = true;
          E.attempt(id, !!r.ok, !card.retry && !cfg.sameSession, { ans: r.ans, sc: r.score });   // «Ошибки сессии» — продолжение той же сессии
          if (!card.retry) { firstOk[id] = !!r.ok; scores[id] = r.score || 0; }
          if (r.ok || !retryOf(card.e)) settled[id] = true;
          else queue.push({ e: card.e, retry: true, i: card.i });
          var bar = layer && layer.querySelector('.lesson-bar > i');
          if (bar) bar.style.width = (100 * settledCount() / entries.length).toFixed(1) + '%';
        },
        next: function () { pos++; show(); }
      };
    }
    function end() {
      var firstRight = entries.filter(function (e) { return firstOk[e.item.id]; }).length;
      var wrong = entries.filter(function (e) { return firstOk[e.item.id] === false; });
      var pts = 0, max = 0;
      entries.forEach(function (e) { pts += scores[e.item.id] || 0; max += MAX_POINTS[e.kind] || 0; });
      var known = entries.filter(function (e) { return L.isKnown(E.rec(e.item.id)); }).length;
      var perfect = firstRight === entries.length;
      var mins = Math.max(1, Math.round((Date.now() - started) / 60000));
      var cards = [stat('green', cfg.firstLabel || 'Верно сразу', 'check', firstRight + '/' + entries.length)];
      if (max > 0) cards.push(stat('gold', 'Баллы', 'trophy', L.points(pts) + '/' + L.points(max)));
      cards.push(stat('blue', 'Знаю', 'star', known + '/' + entries.length));
      var actions = [ui.button(cfg.doneLabel || 'К шагам', { onClick: S.close })];
      if (wrong.length) {
        actions.unshift(ui.button('Ошибки сессии · ' + wrong.length, { variant: 'outline', onClick: function () {
          S.run(Object.assign({}, cfg, { title: 'Ошибки сессии', entries: wrong, sameSession: true }));
        } }));
      }
      ui.clear(layer);
      layer.appendChild(h('div.lesson.is-end', [h('div.end', [
        h('div.end-body', [h('div.end-seal.x-end-seal' + (perfect ? '.is-perfect' : ''), [h('span', { text: perfect ? '★' : (E.page.seal || '₽') })]),
          h('h2.end-title.x-end-title' + (perfect ? '.is-perfect' : ''), { text: perfect ? 'Без ошибок!' : 'Сессия пройдена' }),
          h('p.end-sub', { text: cfg.title + ' · ' + E.count(mins, 'минута', 'минуты', 'минут') +
            (wrong.length ? ' · ошибки остались в шаге «Ошибки», пока не ответишь верно с первой попытки' : '') }),
          h('div.end-stats', cards)]),
        h('div.end-foot.x-end-foot', [h('div.end-foot-in', actions)])
      ])]));
      layer.scrollTop = 0;
      if (perfect) E.confetti(90);
    }
    show();
  };

  function stat(cls, labelText, ic, value) {
    return h('div.stat-card.is-' + cls, [h('p.stat-card-label', { text: labelText }), h('div.stat-card-body', [icon(ic, 22), h('b', { text: value })])]);
  }
  S.stat = stat;

  // ------------------------------------------------------------------ экран-вступление шага (режимы и счётчики)

  /* o: {step, label, head, stats: [chip], modes: [{icon, title, sub, count, disabled, onClick}], tips: [node], start: {label, onClick}} */
  S.intro = function (o) {
    var st = o.step ? E.stats(o.step) : { solved: 0, total: 0 };
    var modes = (o.modes || []).map(function (m) {
      var b = h('button.x-mode' + (m.disabled ? '.is-off' : ''), { type: 'button', disabled: !!m.disabled }, [
        h('span.x-mode-ic', [icon(m.icon || 'arrow', 24)]),
        h('span.x-mode-text', [h('span.x-mode-title', { text: m.title }), m.sub ? h('span.x-mode-sub', { text: m.sub }) : null]),
        m.count !== undefined ? h('span.x-mode-count', { text: String(m.count) }) : icon('chevron', 20)
      ]);
      if (!m.disabled) b.addEventListener('click', m.onClick);
      return b;
    });
    S.frame(st.solved, st.total || 1, st.total ? st.solved + '/' + st.total : '', [
      h('p.ex-label', { text: o.label }), h('h2.ex-head', { text: o.head }),
      o.stats && o.stats.length ? h('div.x-chips', o.stats) : null,
      modes.length ? h('div.x-modes', modes) : null
    ].concat(o.body || [], o.tips || []), S.foot(o.start ? [ui.button(o.start.label, { onClick: o.start.onClick, disabled: !!o.start.disabled })] : []));
  };

  /* Чипы «решено / знаю / ошибок» для вступления шага. */
  S.statChips = function (st) {
    return [E.chip('решено ' + st.solved + ' из ' + st.total, st.done ? 'ok' : null, 'check'),
      E.chip('знаю ' + st.known, st.known ? 'blue' : null, 'star'),
      st.mistakes ? E.chip(E.count(st.mistakes, 'ошибка', 'ошибки', 'ошибок'), 'bad', 'mistakes') : null];
  };
})();

/* ---- exam-test.js ---- */
/* exam-test.js — тест с одним ответом. Шаг {type: 'test', variant, items: [{id, n, q, options, answer, why, trap, slide,
 * crowd, crowd_wrong, disputed, dispute_note, also_in}]}: вступление с режимами (этот вариант, все вперемешку,
 * только ошибки, только спорные) и карточка вопроса как в уроке hanyu: 4 варианта, «Проверить», лист ответа. */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;

  function label(entry) {
    var v = E.variantOf(entry);
    return (v ? 'Вариант ' + v + ' · ' : '') + 'вопрос\u00a0' + (entry.item.n || '');
  }
  function twinsText(item) {
    var ids = (E.twins[item.id] || []).filter(function (id) { return id !== item.id; });
    if (!ids.length) return '';
    var where = ids.map(function (id) {
      var hit = L.allEntries(E.spec).filter(function (e) { return e.item.id === id; })[0];
      return hit ? 'вариант ' + (E.variantOf(hit) || '?') + ', № ' + (hit.item.n || '?') : id;
    });
    return 'Этот же вопрос: ' + where.join('; ') + '. Ответ засчитывается и там.';
  }
  E.twinsText = twinsText;

  /* Пометки после ответа: слайд, чужой ключ, спорный. */
  E.flags = function (item) {
    var chips = [];
    if (item.slide) chips.push(E.chip(item.slide, null, 'book'));
    if (item.crowd_wrong) chips.push(E.chip('чужой ключ тут ошибался' + (item.crowd ? ': ' + item.crowd : ''), 'warn', 'crowd'));
    else if (item.crowd) chips.push(E.chip('чужой ключ согласен', 'ok', 'crowd'));
    if (item.disputed) chips.push(E.chip('спорный', 'lav', 'ask'));
    return chips.length ? h('div.x-chips.x-flags', chips) : null;
  };

  E.kinds.test = {
    render: function (entry, ctx) {
      var it = entry.item, letters = Object.keys(it.options || {}), picked = null, done = false;
      var check = ui.button('Проверить', { disabled: true, onClick: function () { verdict(picked); } });
      var dunno = ui.button('Не знаю', { variant: 'outline', onClick: function () { verdict(null); } });
      var buttons = letters.map(function (k) {
        var b = h('button.choice.x-choice', { type: 'button', data: { k: k } }, [h('span.choice-key', { text: k }),
          h('span.choice-label', [h('span.x-choice-text', { text: E.nb(it.options[k]) })])]);
        b.addEventListener('click', function () {
          if (done) return;
          picked = k;
          buttons.forEach(function (x) { x.classList.toggle('is-sel', x === b); });
          check.disabled = false;
        });
        return b;
      });
      ctx.frame([h('p.ex-label', { text: ctx.label || label(entry) }), h('h2.x-q', { text: E.nb(it.q) }), h('div.choices.x-choices', buttons)],
        S.foot([dunno, check]));

      function verdict(k) {
        if (done) return;
        done = true;
        var ok = k === it.answer;
        buttons.forEach(function (b) {
          var key = b.dataset.k;
          b.disabled = true;
          b.classList.remove('is-sel');
          if (key === it.answer) b.classList.add('is-ok');
          else if (key === k) b.classList.add('is-bad');
        });
        ctx.result({ ok: ok, ans: k || '', score: ok ? 0.5 : 0 });
        var head = ok ? S.vhead('check', 'Верно') : S.vhead('close', 'Правильно: ' + it.answer);
        var body = [
          ok ? null : h('p.x-v-answer', { text: E.nb(it.answer + ' · ' + it.options[it.answer]) + (k ? '. Твой ответ: ' + k : '. Ты выбрал «не знаю»') }),
          E.flags(it),
          S.section('Почему', it.why, 'bulb'),
          S.section('Ловушка', it.trap, 'mistakes'),
          it.disputed ? S.section('Почему спорный', it.dispute_note || 'Ключ спорный: сверь со слайдом.', 'ask') : null,
          twinsText(it) ? h('p.x-note', { text: twinsText(it) }) : null
        ];
        S.swapFoot(S.foot([ui.button('Дальше', { onClick: ctx.next })], ok ? 'ok' : 'bad', [head, S.explain(body)]));
      }
    }
  };

  function entriesAll() { return L.dedupeTwins(L.entriesOfType(E.spec, 'test'), E.twins); }
  /* Отбор до схлопывания двойников: пометка «спорный» может стоять только у одного из пары. */
  function pickAll(filter) { return L.dedupeTwins(L.pickEntries(L.entriesOfType(E.spec, 'test'), E.progress(), filter), E.twins); }
  /* Вперемешку, но нерешённые и ошибки впереди: прерванный прогон продолжается с нового. */
  E.openFirst = function (list) {
    var p = E.progress();
    function isOk(e) { var r = L.rec(p, e.item.id); return !!r && r.last === 'ok'; }
    return list.filter(function (e) { return !isOk(e); }).concat(list.filter(isOk));
  };
  E.runTest = function (step, mode) {
    var p = E.progress(), list, title;
    if (mode === 'all') { list = E.openFirst(L.shuffle(entriesAll(), 'all-' + L.mskDay(E.now()))); title = 'Все варианты вперемешку'; }
    else if (mode === 'mistakes') { list = pickAll('mistakes'); title = 'Тест · только ошибки'; }
    else if (mode === 'disputed') { list = pickAll('disputed'); title = 'Тест · только спорные'; }
    else { list = L.pickEntries(L.stepEntries(step), p, 'resume'); title = step.title; }
    if (!list.length) { ui.toast('Таких вопросов нет'); return; }
    S.run({ title: title, entries: list, retry: true });
  };

  E.types.test = {
    open: function (step, sub) {
      if (sub === 'variant' || sub === 'all' || sub === 'mistakes' || sub === 'disputed') return E.runTest(step, sub);
      var st = E.stats(step), all = entriesAll();
      var mistakes = pickAll('mistakes').length, disputed = pickAll('disputed').length;
      var left = st.total - st.solved;
      var part = E.part('single');
      S.intro({
        step: step, label: 'Тест с одним ответом', head: step.title, stats: S.statChips(st),
        modes: [
          { icon: 'test', title: 'Этот вариант', sub: left ? 'сначала нерешённые и ошибки' : 'всё решено: пройти заново ради «знаю»',
            count: left || st.total, onClick: function () { E.runTest(step, 'variant'); } },
          { icon: 'repeat', title: 'Все варианты вперемешку', sub: 'одинаковые вопросы один раз', count: all.length,
            onClick: function () { E.runTest(step, 'all'); } },
          { icon: 'mistakes', title: 'Только ошибки', sub: 'последняя попытка неверная', count: mistakes, disabled: !mistakes,
            onClick: function () { E.runTest(step, 'mistakes'); } },
          { icon: 'ask', title: 'Только спорные', sub: 'где ключ под вопросом', count: disputed, disabled: !disputed,
            onClick: function () { E.runTest(step, 'disputed'); } }
        ],
        tips: [part ? E.tip('На экзамене: ' + part.count + ' × ' + L.points(part.points_each) + ' балла; ' + part.rule + '.', 'blue', 'info') : null,
          E.tip((step.done_rule ? step.done_rule[0].toUpperCase() + step.done_rule.slice(1) + '. ' : '') +
            '«Знаю»: два верных ответа подряд с первой попытки. Ошибки повторяются в конце сессии.', null, 'star')],
        start: { label: left ? 'Начать' : 'Пройти заново', onClick: function () { E.runTest(step, 'variant'); } }
      });
    }
  };
})();

/* ---- exam-order.js ---- */
/* exam-order.js — последовательности. Задание {id, variant, n, q, items: {А..Г}, answer: 'БВАГ', answer_mode: sequence|mapping,
 * mapping_labels, why, slide, crowd, crowd_wrong, disputed, dispute_note, also_in}.
 * sequence: плитки нажимаются по порядку, последнюю можно снять. mapping: под каждой позицией 1–4 ставится буква
 * (как на бумаге, буквы могут повторяться). Счёт по правилу экзамена: L.orderVerdict. */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;
  var VERDICT = { 1: ['check', 'Верно · 1 балл', 'ok'], 0.5: ['repeat', 'Одна ошибка · 0,5 балла', 'half'], 0: ['close', 'Неверно · 0 баллов', 'bad'] };

  function label(entry) {
    var v = E.variantOf(entry), mode = entry.item.answer_mode === 'mapping' ? 'сопоставление' : 'порядок';
    return (v ? 'Вариант ' + v + ' · ' : '') + mode + (entry.item.n ? ' · №\u00a0' + entry.item.n : '');
  }

  function slotsView(value, verdict, answer) {
    return h('div.x-slots', { aria: { label: 'Твой ответ' } }, [0, 1, 2, 3].map(function (i) {
      var ch = value[i] || '', cls = '';
      if (verdict) cls = ch === answer[i] ? '.is-ok' : '.is-bad';
      else if (ch) cls = '.is-filled';
      return h('span.x-slot' + cls, [h('small', { text: String(i + 1) }), h('b', { text: ch || ' ' })]);
    }));
  }

  E.kinds.order = {
    render: function (entry, ctx) {
      var it = entry.item, mapping = it.answer_mode === 'mapping', letters = L.LETTERS.filter(function (k) { return it.items && it.items[k]; });
      var value = ['', '', '', ''], history = [], done = false;
      var slotsBox = h('div.x-slots-wrap'), workBox = h('div');
      var undo = h('button.x-linkbtn', { type: 'button', on: { click: function () { pop(); } } }, [icon('undo', 18), h('span', { text: 'Снять последнюю' })]);
      var check = ui.button('Проверить', { disabled: true, onClick: function () { verdict(); } });
      var dunno = ui.button('Не знаю', { variant: 'outline', onClick: function () { value = ['', '', '', '']; verdict(); } });

      function filled() { return value.every(Boolean); }
      function paint() {
        ui.clear(slotsBox).appendChild(slotsView(value, done, it.answer));
        ui.clear(workBox).appendChild(mapping ? mappingView() : bankView());
        undo.disabled = !history.length || done;
        check.disabled = !filled() || done;
      }
      function set(pos, k) {
        value = value.slice();
        value[pos] = k;
        history = history.filter(function (p) { return p !== pos; }).concat(k ? [pos] : []);
        paint();
      }
      function pop() {
        if (!history.length || done) return;
        var pos = history[history.length - 1];
        value = value.slice();
        value[pos] = '';
        history = history.slice(0, -1);
        paint();
      }
      function bankView() {
        return h('div.choices.x-bank', letters.map(function (k) {
          var at = value.indexOf(k);
          var b = h('button.choice.x-tile' + (at >= 0 ? '.is-placed' : ''), { type: 'button', disabled: done },
            [h('span.choice-key', { text: k }), h('span.choice-label', [h('span.x-choice-text', { text: E.nb(it.items[k]) })]),
              at >= 0 ? h('span.x-badge', { text: String(at + 1) }) : null]);
          b.addEventListener('click', function () {
            if (done) return;
            if (at >= 0) { if (history[history.length - 1] === at) pop(); return; }
            var free = value.indexOf('');
            if (free >= 0) set(free, k);
          });
          return b;
        }));
      }
      function mappingView() {
        return h('div', [
          h('div.x-legend', letters.map(function (k) { return h('p', [h('b', { text: k }), h('span', { text: E.nb(it.items[k]) })]); })),
          h('div.x-maps', (it.mapping_labels || []).map(function (lab, i) {
            return h('div.x-map-row', [h('p.x-map-label', { text: lab }), h('div.x-letters', letters.map(function (k) {
              var b = h('button.x-letter' + (value[i] === k ? '.is-on' : ''), { type: 'button', disabled: done, aria: { label: lab + ': ' + k, pressed: String(value[i] === k) }, text: k });
              b.addEventListener('click', function () { if (!done) set(i, value[i] === k ? '' : k); });
              return b;
            }))]);
          }))
        ]);
      }
      paint();
      ctx.frame([h('p.ex-label', { text: ctx.label || label(entry) }), h('h2.x-q', { text: E.nb(it.q) }),
        h('p.x-hint', { text: mapping ? 'Под каждой позицией выбери букву. Сверху собирается ответ, как на бланке.' : 'Нажимай пункты по порядку: первый, второй, третий, четвёртый.' }),
        slotsBox, workBox, h('div.x-undo', [undo])], S.foot([dunno, check]));

      function verdict() {
        if (done) return;
        done = true;
        var user = value.map(function (c) { return c || '_'; }).join(''), v = L.orderVerdict(user, it.answer);
        paint();
        ctx.result({ ok: v.score === 1, ans: user, score: v.score });
        var look = VERDICT[v.score];
        var keyRows = Array.from(it.answer).map(function (k, i) {
          var lead = mapping ? (it.mapping_labels || [])[i] || String(i + 1) : String(i + 1) + '.';
          return h('li.x-keyrow' + (mapping ? '.is-map' : '') + (value[i] === k ? '' : '.is-miss'), [h('span.x-keylead', { text: lead }), h('b', { text: k }), h('span', { text: E.nb(it.items[k]) })]);
        });
        var body = [
          h('p.x-v-answer', { text: 'Ключ: ' + Array.from(it.answer).join(' ') + (user.replace(/_/g, '') ? ' · твой ответ: ' + user.split('').join(' ') : ' · ты выбрал «не знаю»') }),
          h('ol.x-keylist', keyRows),
          E.tip(L.ORDER_RULE, 'blue', 'info'),
          E.flags(it),
          S.section('Почему так', it.why, 'bulb'),
          it.disputed ? S.section('Почему спорный', it.dispute_note || 'Ключ спорный: сверь со слайдом.', 'ask') : null,
          E.twinsText(it) ? h('p.x-note', { text: E.twinsText(it) }) : null
        ];
        S.swapFoot(S.foot([ui.button('Дальше', { onClick: ctx.next })], look[2], [S.vhead(look[0], look[1]), S.explain(body)]));
      }
    }
  };

  function runOrder(step, filter) {
    var p = E.progress(), raw = L.stepEntries(step), list, title = step.title;
    if (filter === 'mistakes' || filter === 'disputed') {
      list = L.dedupeTwins(L.pickEntries(raw, p, filter), E.twins);
      title = 'Последовательности · ' + (filter === 'mistakes' ? 'ошибки' : 'спорные');
    } else if (/^v\d+$/.test(filter || '')) {
      var v = Number(filter.slice(1));   // вариант целиком, как на экзамене: двойники из других вариантов не выпадают
      list = L.pickEntries(raw.filter(function (e) { return E.variantOf(e) === v; }), p, 'resume');
      title = 'Последовательности · вариант ' + v;
    } else list = L.pickEntries(L.dedupeTwins(raw, E.twins), p, 'resume');
    if (!list.length) { ui.toast('Таких заданий нет'); return; }
    S.run({ title: title, entries: list, retry: true });
  }

  E.types.ordering = {
    open: function (step, sub) {
      if (sub) return runOrder(step, sub === 'run' ? 'resume' : sub);
      var p = E.progress(), st = E.stats(step), all = L.stepEntries(step), unique = L.dedupeTwins(all, E.twins);
      var openCount = L.pickEntries(unique, p, 'resume').length;
      var variants = [];
      all.forEach(function (e) { var v = E.variantOf(e); if (v && variants.indexOf(v) < 0) variants.push(v); });
      variants.sort(function (a, b) { return a - b; });
      var mistakes = L.dedupeTwins(L.pickEntries(all, p, 'mistakes'), E.twins).length;
      var disputed = L.dedupeTwins(L.pickEntries(all, p, 'disputed'), E.twins).length;
      var vchips = variants.length > 1 ? h('div.x-vchips', variants.map(function (v) {
        var mine = all.filter(function (e) { return E.variantOf(e) === v; });
        var ok = mine.filter(function (e) { var r = L.rec(p, e.item.id); return r && r.last === 'ok'; }).length;
        return h('button.x-vchip' + (ok === mine.length ? '.is-done' : ''), { type: 'button', on: { click: function () { runOrder(step, 'v' + v); } } },
          [h('b', { text: 'Вар. ' + v }), h('small', { text: ok + '/' + mine.length })]);
      })) : null;
      var part = E.part('ordering');
      S.intro({
        step: step, label: 'Последовательности', head: step.title, stats: S.statChips(st),
        modes: [
          { icon: 'order', title: 'Все задания', sub: st.solved < st.total ? 'сначала нерешённые и ошибки' : 'всё решено: пройти заново ради «знаю»',
            count: openCount, onClick: function () { runOrder(step, 'resume'); } },
          { icon: 'mistakes', title: 'Только ошибки', sub: 'последняя попытка не на 1 балл', count: mistakes, disabled: !mistakes,
            onClick: function () { runOrder(step, 'mistakes'); } },
          { icon: 'ask', title: 'Только спорные', sub: 'где ключ под вопросом', count: disputed, disabled: !disputed,
            onClick: function () { runOrder(step, 'disputed'); } }
        ],
        body: vchips ? [h('p.x-sub', { text: 'По вариантам' }), vchips] : [],
        tips: [E.tip((part ? 'На экзамене: ' + part.count + ' × ' + L.points(part.points_each) + ' балл. ' : '') + L.ORDER_RULE, 'blue', 'info')],
        start: { label: st.solved < st.total ? 'Начать' : 'Пройти заново', onClick: function () { runOrder(step, 'resume'); } }
      });
    }
  };
})();

/* ---- exam-problems.js ---- */
/* exam-problems.js — задачи. {id, source, level, text, formula_id, asks: [{label, value, unit, tol}], steps, answer_text, trap, ambiguity}.
 * Поле числа на каждый пункт (запятая или точка, пробелы не мешают), «Проверить» с допуском tol, после — решение по шагам.
 * «Формула» открывает карточку формулы (шаг formulas, card.id = formula_id) как подсказку. */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;

  E.formulaCard = function (id) {
    var hit = null;
    E.stepsOf('formulas').forEach(function (s) { (s.cards || []).forEach(function (c) { if (c.id === id) hit = c; }); });
    return hit;
  };
  E.formulaSheet = function (card) {
    ui.sheet([h('p.x-label', [icon('formula', 16), h('span', { text: 'Формула' })]), h('h2.sheet-title', { text: card.name }),
      h('p.x-formula', { text: card.formula }),
      card.legend ? h('p.x-legend-text', { text: card.legend }) : null,
      card.example ? S.section('Пример', card.example, 'pen') : null,
      card.trap ? S.section('Ловушка', card.trap, 'mistakes') : null], { label: card.name, cls: 'x-sheet' });
  };

  /* «±»: в цифровой клавиатуре iPhone нет минуса, а ответ бывает отрицательным (эластичность). */
  E.signButton = function (input, onChange) {
    return h('button.x-sign', { type: 'button', title: 'Сменить знак', aria: { label: 'Сменить знак' }, text: '±', on: { click: function () {
      if (input.disabled) return;
      var v = input.value.trim();
      input.value = /^[-−]/.test(v) ? v.replace(/^[-−]\s*/, '') : '−' + v;
      if (onChange) onChange();
      input.focus();
    } } });
  };

  function label(entry) { return 'Задача' + (entry.item.source ? ' · ' + entry.item.source : ''); }
  function unitText(ask) { return ask.unit ? ' ' + ask.unit : ''; }

  E.kinds.problem = {
    render: function (entry, ctx) {
      var it = entry.item, asks = it.asks || [], done = false, card = it.formula_id ? E.formulaCard(it.formula_id) : null;
      var check = ui.button('Проверить', { disabled: true, onClick: function () { verdict(false); } });
      var dunno = ui.button('Не знаю', { variant: 'outline', onClick: function () { verdict(true); } });
      var inputs = asks.map(function (ask, i) {
        var input = h('input.x-num', { type: 'text', inputmode: 'decimal', autocomplete: 'off', enterkeyhint: i === asks.length - 1 ? 'done' : 'next',
          aria: { label: ask.label }, placeholder: 'число' });
        input.addEventListener('input', function () { check.disabled = inputs.some(function (x) { return !x.value.trim(); }); });
        input.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          if (inputs[i + 1]) inputs[i + 1].focus(); else if (!check.disabled) verdict(false);
        });
        return input;
      });
      var rows = asks.map(function (ask, i) {
        var sync = function () { check.disabled = inputs.some(function (x) { return !x.value.trim(); }); };
        return h('label.x-ask', [h('span.x-ask-label', { text: ask.label }), h('span.x-ask-row', [inputs[i], E.signButton(inputs[i], sync), ask.unit ? h('span.x-unit', { text: ask.unit }) : null])]);
      });
      var hint = card ? h('button.x-linkbtn', { type: 'button', on: { click: function () { E.formulaSheet(card); } } }, [icon('formula', 18), h('span', { text: 'Формула' })]) : null;
      ctx.frame([h('div.x-phead', [h('p.ex-label', { text: ctx.label || label(entry) }), it.level ? E.chip(it.level, it.level === 'пул' ? 'lav' : null) : null]),
        h('div.x-ptext', E.text(it.text, 'x-p')), h('div.x-asks', rows), hint ? h('div.x-undo', [hint]) : null], S.foot([dunno, check]));

      function verdict(skip) {
        if (done) return;
        done = true;
        var res = L.checkAsks(asks, skip ? asks.map(function () { return ''; }) : inputs.map(function (x) { return x.value; }));
        rows.forEach(function (row, i) {
          var r = res.results[i];
          inputs[i].disabled = true;
          row.classList.add(r.ok ? 'is-ok' : 'is-bad');
          if (!r.ok) row.appendChild(h('span.x-ask-key', { text: 'верно: ' + L.formatNumber(asks[i].value) + unitText(asks[i]) + (asks[i].tol ? ' (допуск ±' + L.formatNumber(asks[i].tol) + ')' : '') }));
        });
        ctx.result({ ok: res.ok, ans: inputs.map(function (x) { return x.value; }).join(' | '), score: res.ok ? 3 : 0 });
        var part = E.part('problems');
        var body = [
          h('ul.x-asklist', res.results.map(function (r, i) {
            return h('li' + (r.ok ? '.is-ok' : '.is-bad'), [icon(r.ok ? 'check' : 'close', 16), h('span', { text: asks[i].label + ': ' + L.formatNumber(asks[i].value) +
              unitText(asks[i]).replace(' ', '\u00a0') + (r.ok ? '' : r.empty ? ' · пусто' : ' · у тебя ' + (isNaN(r.x) ? 'не число' : L.formatNumber(r.x))) })]);
          })),
          h('div.x-sec', [E.label('Решение', 'pen'), h('ol.x-steps', (it.steps || []).map(function (s) { return h('li', { text: E.nb(s) }); }))]),
          S.section('Ответ', it.answer_text, 'check'),
          S.section('Ловушка', it.trap, 'mistakes'),
          S.section('Если формулировка двусмысленна', it.ambiguity, 'ask'),
          part ? E.tip('На экзамене: ' + part.rule + '. Здесь проверяется только число.', 'blue', 'info') : null
        ];
        S.swapFoot(S.foot([ui.button('Дальше', { onClick: ctx.next })], res.ok ? 'ok' : 'bad',
          [S.vhead(res.ok ? 'check' : 'close', res.ok ? 'Верно · 3 балла' : 'Есть ошибка'), S.explain(body)]));
      }
    }
  };

  function runProblems(step, filter, only) {
    var p = E.progress(), all = L.stepEntries(step), list;
    if (only) list = all.filter(function (e) { return e.item.id === only; });
    else list = L.pickEntries(all, p, filter || 'resume');
    if (!list.length) { ui.toast('Таких задач нет'); return; }
    S.run({ title: only ? label(list[0]) : step.title, entries: list, retry: false });
  }

  E.types.problems = {
    open: function (step, sub) {
      if (sub === 'run' || sub === 'mistakes') return runProblems(step, sub === 'run' ? 'resume' : 'mistakes');
      var p = E.progress(), st = E.stats(step), entries = L.stepEntries(step);
      var list = h('div.x-plist', entries.map(function (e) {
        var r = L.rec(p, e.item.id), state = r ? (r.last === 'ok' ? '.is-ok' : '.is-bad') : '';
        return h('button.x-prow' + state, { type: 'button', on: { click: function () { runProblems(step, null, e.item.id); } } }, [
          h('span.x-prow-dot', [icon(r ? (r.last === 'ok' ? 'check' : 'close') : 'problem', 18)]),
          h('span.x-prow-text', [h('span.x-prow-title', { text: e.item.source || e.item.id }), h('span.x-prow-sub', { text: String(e.item.text || '').slice(0, 90) + (String(e.item.text || '').length > 90 ? '…' : '') })]),
          e.item.level ? E.chip(e.item.level, e.item.level === 'пул' ? 'lav' : null) : null
        ]);
      }));
      var mistakes = L.pickEntries(entries, p, 'mistakes').length;
      S.intro({
        step: step, label: 'Задачи', head: step.title, stats: S.statChips(st),
        modes: [{ icon: 'mistakes', title: 'Только ошибки', sub: 'последняя попытка неверная', count: mistakes, disabled: !mistakes,
          onClick: function () { runProblems(step, 'mistakes'); } }],
        body: [h('p.x-sub', { text: 'Все задачи' }), list],
        tips: [E.tip('Числа можно писать с пробелами и запятой: «75 000», «12,5». Кнопка «Формула» в задаче открывает подсказку.', null, 'info')],
        start: { label: st.solved < st.total ? 'Решать по порядку' : 'Решить заново', onClick: function () { runProblems(step, 'resume'); } }
      });
    }
  };
})();

/* ---- exam-formulas.js ---- */
/* exam-formulas.js — карточки формул {id, name, formula, given, legend, example, trap, slide, used_in}.
 * Лицо: название и что дано → вспомнить → перевернуть → «помню / не помню». «Не помню» возвращает карточку в конец сессии. */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;

  function usedIn(card) {
    var names = L.asList(card.used_in).map(function (id) {
      var hit = L.allEntries(E.spec).filter(function (e) { return e.item.id === id; })[0];
      return hit ? (hit.item.source || hit.item.id) : null;
    }).filter(Boolean);
    return names.length ? 'Нужна в: ' + names.join('; ') : '';
  }

  E.kinds.formula = {
    render: function (entry, ctx) {
      var card = entry.item, flipped = false;
      var front = h('div.x-face.x-front', [
        h('p.x-face-kicker', [icon('formula', 16), h('span', { text: 'Вспомни формулу' })]),
        h('div.x-face-mid', [h('p.x-fname', { text: card.name }),
          card.given ? h('p.x-given', [h('b', { text: 'Дано: ' }), document.createTextNode(E.nb(card.given))]) : null]),
        h('p.x-face-hint', { text: 'Нажми, чтобы перевернуть' })
      ]);
      var back = h('div.x-face.x-back', { aria: { hidden: 'true' } }, [
        h('p.x-face-kicker', [h('span', { text: card.name })]),
        h('p.x-formula', { text: card.formula }),
        card.legend ? h('p.x-legend-text', { text: E.nb(card.legend) }) : null,
        card.example ? S.section('Пример', card.example, 'pen') : null,
        card.trap ? S.section('Ловушка', card.trap, 'mistakes') : null,
        card.slide || usedIn(card) ? h('div.x-chips', [card.slide ? E.chip(card.slide, null, 'book') : null, usedIn(card) ? E.chip(usedIn(card), null, 'problem') : null]) : null
      ]);
      var flip = h('button.x-flip', { type: 'button', aria: { label: 'Перевернуть карточку' } }, [h('span.x-flip-inner', [front, back])]);
      flip.addEventListener('click', turn);
      var turnBtn = ui.button('Перевернуть', { onClick: turn });
      ctx.frame([h('p.ex-label', { text: ctx.label || 'Формулы' }), flip], S.foot([turnBtn]));

      function turn() {
        if (flipped) return;
        flipped = true;
        flip.classList.add('is-flipped');
        flip.setAttribute('aria-label', 'Карточка перевёрнута');
        front.setAttribute('aria-hidden', 'true');
        back.removeAttribute('aria-hidden');
        S.swapFoot(S.foot([
          ui.button('Не помню', { variant: 'outline', onClick: function () { mark(false); } }),
          ui.button('Помню', { variant: 'jade', onClick: function () { mark(true); } })
        ]));
      }
      function mark(ok) {
        ctx.result({ ok: ok, score: 0 });
        ctx.next();
      }
    }
  };

  function runFormulas(step, filter, only) {
    var p = E.progress(), all = L.stepEntries(step), list;
    if (only) list = all.filter(function (e) { return e.item.id === only; });
    else if (filter === 'all') list = all;
    else list = L.pickEntries(all, p, filter || 'resume');
    if (!list.length) { ui.toast('Таких карточек нет'); return; }
    S.run({ title: step.title, entries: list, retry: true, firstLabel: 'Помню сразу',
      label: function (e) { return 'Формула · ' + (all.findIndex(function (x) { return x.item.id === e.item.id; }) + 1) + ' из ' + all.length; } });
  }

  E.types.formulas = {
    open: function (step, sub) {
      if (sub === 'run' || sub === 'all' || sub === 'mistakes') return runFormulas(step, sub === 'run' ? 'resume' : sub);
      var p = E.progress(), st = E.stats(step), entries = L.stepEntries(step);
      var grid = h('div.x-fgrid', entries.map(function (e) {

/* exam-case.js — кейс: вкладки «Условие», «Разбор», «Репетиция». Репетиция: таймер (rehearsal.minutes, по умолчанию 40) и
 * раскладка минут по пунктам (rehearsal.time_plan), поле «твоя версия» на каждый пункт с автосохранением, «Показать образец»

(function () {

    paintControls();
    clearInterval(tick);
    tick = setInterval(function () { if (!document.body.contains(timeEl)) { clearInterval(tick); return; } paintTimer(); }, 1000);

    var saveTimers = {}, areas = {}, synced = {};   // synced[пункт]: текст, с которым поле последний раз совпадало с прогрессом

      var cur = Object.assign({}, E.caseState(step.id).drafts);

      ta.value = (drafts[p.point] || {}).text || '';

      var reveal = h('button.x-linkbtn', { type: 'button', disabled: !ta.value.trim() || !model }, [icon('eye', 18), h('span', { text: shown[p.point] ? 'Скрыть образец' : 'Показать образец' })]);
      reveal.addEventListener('click', function () {

      });
      return h('div.x-draft-block', [h('div.x-tpl-row', [h('span.x-num-badge', { text: p.point }), h('div', [h('p.x-tpl-title', { text: p.title }),
        p.what ? h('p.x-src', { text: p.what }) : null])]), ta, model ? reveal : h('p.x-src', { text: 'Образца для этого пункта нет' }), modelBox]);
    });

    var checks = h('div.m-checks', L.asList(step.criteria).map(function (c, i) {
      var b = h('button.m-check' + (crit[i] ? '.is-on' : ''), { type: 'button', aria: { pressed: String(!!crit[i]) } }, [E.dot(!!crit[i]), h('span', { text: c })]);

  function render(step, tab) {

/* ---- exam-plan.js ---- */
/* exam-plan.js — план по дням (шаг plan: days[{date, title, blocks[{time, min, what, step}]}]) и карточка «Сегодня»
 * на главной: сначала ошибки (если есть), потом блоки плана на сегодня или ближайший день. Блок отмечается сам,
 * когда его шаг готов, или вручную (progress.plan["дата#номер"]). */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;
  var KIND_NAMES = { test: ['вопрос', 'вопроса', 'вопросов'], order: ['последовательность', 'последовательности', 'последовательностей'], problem: ['задача', 'задачи', 'задач'] };

  E.planStep = function () { return E.stepsOf('plan')[0] || null; };
  E.mistakeSummary = function () {
    var list = L.collectMistakes(E.spec, E.progress(), E.twins), by = {};
    list.forEach(function (e) { by[e.kind] = (by[e.kind] || 0) + 1; });
    var text = Object.keys(KIND_NAMES).filter(function (k) { return by[k]; }).map(function (k) {
      return by[k] + ' ' + L.plural(by[k], KIND_NAMES[k][0], KIND_NAMES[k][1], KIND_NAMES[k][2]);
    }).join(' · ');
    return { list: list, total: list.length, text: text };
  };

  function blockKey(day, i) { return day.date + '#' + i; }
  /* Был ли в этот день ответ в шаге (по времени последней попытки элемента или правки кейса). */
  function activeOn(step, date) {
    if (step.type === 'case') { var t = E.caseState(step.id).t; return !!t && L.mskDay(t) === date; }
    return L.stepEntries(step).some(function (e) { var r = E.rec(e.item.id); return !!r && !!r.t && L.mskDay(r.t) === date; });
  }
  /* Блок сделан: отмечен вручную или его шаг готов и в этот день по нему были ответы (будущие дни сами не отмечаются). */
  function blockDone(day, block, i) {
    var step = block.step ? E.step(block.step) : null;
    if (E.progress().plan[blockKey(day, i)] > 0 || E.progress().plan[blockKey(day, i)] === true) return true;
    if (E.progress().plan[blockKey(day, i)] < 0) return false;   // снято вручную
    return !!step && L.counts(step) && E.stats(step).done && activeOn(step, day.date);
  }
  function dayLabel(day) {
    var d = new Date(Date.parse(day.date + 'T12:00:00+03:00'));
    var wd = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'][d.getUTCDay()];
    return day.title || (wd + ' ' + day.date.slice(8) + '.' + day.date.slice(5, 7));
  }
  function blockMeta(block) {
    return [block.time, block.min ? block.min + ' мин' : ''].filter(Boolean).join(' · ');
  }

  function blockRow(day, block, i, onToggle, compact) {
    var step = block.step ? E.step(block.step) : null, done = blockDone(day, block, i);
    var dot = h('button.x-bdot' + (done ? '.is-done' : ''), { type: 'button', aria: { label: done ? 'Отмечено' : 'Отметить сделанным', pressed: String(done) } }, [icon('check', 16)]);
    dot.addEventListener('click', function (e) {
      e.stopPropagation();
      E.putPlan(blockKey(day, i), !blockDone(day, block, i));
      onToggle();
    });
    var main = h('button.x-brow-main', { type: 'button' }, [
      h('span.x-brow-text', [blockMeta(block) ? h('span.x-brow-meta', { text: blockMeta(block) }) : null, h('span.x-brow-what', { text: block.what }),
        step && !compact ? h('span.x-brow-step', [icon(step.icon || 'star', 14), h('span', { text: step.title + (L.counts(step) && E.stats(step).done ? ' · шаг готов' : '') })]) : null]),
      step ? icon('chevron', 20) : null
    ]);
    main.addEventListener('click', function () { if (step) E.openStep(step.id); else dot.click(); });
    return h('div.x-brow' + (done ? '.is-done' : ''), [dot, main]);
  }

  function planScreen(step, keepScroll) {
    var cur = document.querySelector('.x-layer'), keep = keepScroll && cur ? cur.scrollTop : 0;
    var total = 0, ticked = 0;
    (step.days || []).forEach(function (d) { (d.blocks || []).forEach(function (b, i) { total++; if (blockDone(d, b, i)) ticked++; }); });
    var today = L.mskDay(E.now());
    var days = (step.days || []).map(function (d) {
      return h('section.x-day' + (d.date === today ? '.is-today' : ''), [
        h('div.x-day-head', [h('h3.x-day-title', { text: dayLabel(d) }), d.date === today ? E.chip('сегодня', 'blue') : d.date < today ? E.chip('прошёл', null) : null]),
        h('div.x-blocks', (d.blocks || []).map(function (b, i) { return blockRow(d, b, i, function () { planScreen(step, true); }); }))
      ]);
    });
    S.frame(ticked, Math.max(1, total), ticked + '/' + total, [
      h('p.ex-label', { text: 'План до экзамена' }), h('h2.ex-head', { text: step.title }),
      E.page.order_note ? h('p.m-order.x-order', [icon('info', 20), h('span', { text: E.page.order_note })]) : null
    ].concat(days), S.foot([ui.button('Готово', { onClick: S.close })]));
    if (keep) document.querySelector('.x-layer').scrollTop = keep;
  }
  E.types.plan = { open: function (step) { planScreen(step); } };

  /* Карточка «Сегодня» для главной; нечего показать — null. */
  E.todayCard = function (rerender) {
    var m = E.mistakeSummary(), plan = E.planStep(), pd = plan ? L.planDay(plan, E.now()) : null;
    if (!m.total && !pd) return null;
    var rows = [];
    if (m.total) {
      rows.push(h('button.x-mrow', { type: 'button', on: { click: function () { E.openStep('mistakes', 'run'); } } }, [
        h('span.x-mrow-ic', [icon('mistakes', 22)]),
        h('span.x-brow-text', [h('span.x-brow-what', { text: 'Ошибки · ' + m.total }), h('span.x-mrow-sub', { text: m.text })]),
        h('span.m-go.x-go', { text: 'Повторить' })
      ]));
    }
    if (pd) {
      (pd.day.blocks || []).forEach(function (b, i) { rows.push(blockRow(pd.day, b, i, rerender, true)); });
    }
    var title = pd ? (pd.isToday ? 'Сегодня · ' : 'Ближайший день · ') + dayLabel(pd.day) : 'Сегодня';
    return h('section.card.x-today', [
      h('div.card-head', [h('h2.card-title', { text: title }), plan ? h('button.card-link', { type: 'button', text: 'Весь план', on: { click: function () { E.openStep(plan.id); } } }) : null]),
      h('div.x-blocks', rows)

  };
})();

/* ---- exam-mistakes.js ---- */
/* exam-mistakes.js — шаг «Ошибки»: собирается из ответов на странице (не из данных). Вопросы теста, последовательности
 * и задачи, где последняя попытка неверная; двойник один раз. Повтор вперемешку по видам: тест, последовательности, задачи. */
(function () {
  'use strict';
  var NS = window.HanyuApp, ui = NS.ui, h = ui.h, icon = ui.icon, E = window.Exam, L = E.logic, S = E.session;
  var KIND_ICON = { test: 'test', order: 'order', problem: 'problem' };

  function short(text, n) { var s = String(text || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function lastLine(e) {
    var r = E.rec(e.item.id) || {}, it = e.item;
    if (e.kind === 'test') {
      var from = r.via ? L.allEntries(E.spec).filter(function (x) { return x.item.id === r.via; })[0] : null;
      var pool = (from ? from.item : it).options || {};
      return (r.ans ? 'твой ответ ' + r.ans + ' · ' + pool[r.ans] : 'ответил «не знаю»') + ' · верно ' + it.answer;
    }
    if (e.kind === 'order') {
      var ans = String(r.ans || '').replace(/_/g, '');
      return (ans ? 'твой ' + String(r.ans).replace(/_/g, '·') : 'ответил «не знаю»') + ' · ключ ' + it.answer;
    }
    return it.source || 'задача';
  }
  function title(e) {
    var v = E.variantOf(e);
    if (e.kind === 'problem') return short(e.item.text, 110);
    return (v ? 'В' + v + ' · ' : '') + short(e.item.q, 110);
  }

  function run(list, name) {
    S.run({ title: name, entries: list, retry: function (e) { return e.kind !== 'problem'; },
      label: function (e) {
        var v = E.variantOf(e), kind = e.kind === 'test' ? 'тест' : e.kind === 'order' ? 'последовательность' : 'задача';
        return 'Ошибка · ' + kind + (v ? ' · вариант ' + v : '');
      } });
  }

  E.types.mistakes = {
    open: function (step, sub) {
      var m = E.mistakeSummary();
